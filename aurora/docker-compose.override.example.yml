# The smoke stack is generated by `live/stack.py`: three agents and their recorders, a cued stub
# model in place of the upstream, and the contract fixture as the window, on scratch directories
# under .smoke-<pid>/ with a dummy key and its own project name. `python3 -m pytest live -q` brings
# it up, runs the live checks, and tears it down.
#
# Nothing here is a working override any more: the per-agent topology needs one recorder override
# per agent and the volume root pointed at scratch, which is why the stack writes its own.
services: {}
