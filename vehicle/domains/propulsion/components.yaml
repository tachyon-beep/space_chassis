# domains/propulsion/components.yaml — the engines, their sequencing, and the two gaps apollo
# does not fill.
#
# ## What this domain is for
#
# Propulsion is where the mission's Δv budget stops being a number in `mission.yaml` and starts
# being spent. It owns the one class of action that is large, fast and irreversible, and it is
# the domain where `apollo_diode.md:141`'s `prop.accumulated_dv_m_s` finally has a producer —
# conflict register C-12 records that `main_propulsion_diode.md` cuts off on duration, plan or
# GNC request and has **no** Δv cutoff path at all, so that channel would have had nothing
# behind it.
#
# ## The two gaps, stated rather than filled
#
# 1. **There is no throttle-to-thrust law.** `main_propulsion_diode.md:36` refuses thrust,
#    pressure, mixture ratio, impulse bit, valve transit and tank capacity as non-universal, and
#    it is right to. What this vehicle has instead is thrust *measured* — 91,188 N from 20,500
#    lbf, and an Isp — plus a throttle *command*, and the relation between them is a curve
#    nobody published. `thrust_curve` below declares its shape and leaves its coefficients
#    unset, because a linear interpolation between two endpoints is a claim about combustion
#    that this vehicle has no evidence for.
# 2. **The pressurant regulator has no transfer function.** `apollo_diode.md:139` gives
#    `pressurant_pressure_psi` as "vehicle dependent" and the F-09 trapped-line chain needs the
#    regulator's behaviour to be a model. It is declared unset, which means CNS-10 and PRP-03
#    are seeded against a component whose dynamics are owed.

domain: propulsion

# Valve transit is "typically 0.1 to several seconds" (apollo_diode.md:521) and the thrust
# response tail is of the same order, so the plant constant here is about a second. The
# 500-1000 Hz acquisition figure in main_propulsion_diode.md:547 is a flight-software
# scheduling period, not a time constant (review-findings.md #5), and it does not bind an
# integrator.
natural_rate_hz: 10

# `guidance` and `command_executive` both land on `engine_main` — `E-GNC-ENG` because closed loop
# means guidance holds the authority to start and stop a burn without a crew verb, `E-CMD-ENG`
# because the executive can still command the mode directly. `nav_state` was declared in their place
# and is one hop upstream of the mode that actually arrives here.
reads: [prop_main, pressurant_he, nav_state, structure_config, guidance, command_executive]
writes: [engine_main, thrust_main, sps_thrust]

# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [dps_throttle_pct, chamber_pressure_pct, pressurant_pressure_psi, feed_pressure_pct, accumulated_dv_m_s, sps_burn_count]
internal_order_note: >-
  the order the physics runs in: the throttle is set, the chamber pressure follows from it, the
  tanks' regulated pressure is set by the helium, and the feed follows the tanks. The two registers
  come last because they record what the burn did rather than feeding it. The tank pressure came
  after the feed until the pressurization rules landed, on the reading that the pressurant follows
  the feed; it is the other way round, because the feed is downstream of the tanks.

state:
  - id: sps_state
    node: engine_main
    method: discrete
    unit: "enum[off,standby,armed,ignition,mainstage,shutdown,failed]"
    initial: "off"
    initial_provenance:
      basis: derived
      relation: "the vehicle at MET 0, from `mission.yaml#launch_state`: the mission begins at the pad, so no engine has been commanded and no guidance manoeuvre is in progress"
      source: mission.yaml:launch_state
    moved_by:
      - "command:arm_engine"
    command_value:
      - verb: arm_engine
        argument: state
        # Each engine's state answers only the call that names it: unrouted, `arm_engine engine=sps`
        # armed all three engines.
        when: {engine: sps}
        maps:
          safe: standby
        why: >-
          `armed` is the identity. `safe` is not a value of this state; it is the command's word for
          leaving the armed state, and the state it leaves to is written here because nothing else
          says it. `main_propulsion_diode.md:810` names the destination in as many words — "Power
          brownout during pre-burn | readiness false | stay/return to safe **standby**"
    dwell: {min_on_s: 0.5, min_off_s: 5}
    provenance:
      basis: apollo
      ref: "apollo_diode.md:134-141"
      note: "apollo publishes prop.main_armed and a chamber-pressure channel with a <90 % event after ignition, which is a state machine with an armed state whether or not the corpus draws it. The dwell times are chosen from the SPS's 750 s total burn capability over 50 qualified restarts: a five-second floor between burns is what keeps a fleet from spending its restart budget in a minute"

  - id: dps_state
    node: engine_main
    method: discrete
    unit: "enum[off,standby,armed,ignition,mainstage,shutdown,failed]"
    initial: "off"
    initial_provenance:
      basis: derived
      relation: "the vehicle at MET 0, from `mission.yaml#launch_state`: the mission begins at the pad, so no engine has been commanded and no guidance manoeuvre is in progress"
      source: mission.yaml:launch_state
    moved_by:
      - "command:arm_engine"
    command_value:
      - verb: arm_engine
        argument: state
        when: {engine: dps}
        maps:
          safe: standby
        why: >-
          `armed` is the identity. `safe` is not a value of this state; it is the command's word for
          leaving the armed state, and the state it leaves to is written here because nothing else
          says it. `main_propulsion_diode.md:810` names the destination in as many words — "Power
          brownout during pre-burn | readiness false | stay/return to safe **standby**"
    dwell: {min_on_s: 2, min_off_s: 5}
    provenance:
      basis: historical
      source: "the DPS experience report and NR: the descent engine is throttleable and its operating band has a non-operating region, so its state machine has a throttle state as well as a run state. The two-second minimum on time is chosen against the 10:1 throttle range: below it the engine is still in its start transient and no commanded throttle means anything"
      note: >-
        that sentence is the whole finding: this entry quoted a source saying
        65-92.5 % is non-operating and then declared an operating band spanning
        it. The bands are two intervals now, and each `thrust_curve` segment carries
        an `operating:` flag so the curve and the bands can be held against each
        other rather than against a reader

  - id: aps_state
    node: engine_main
    method: discrete
    unit: "enum[off,armed,ignition,mainstage,shutdown,failed]"
    initial: "off"
    initial_provenance:
      basis: derived
      relation: "the vehicle at MET 0, from `mission.yaml#launch_state`: the mission begins at the pad, so no engine has been commanded and no guidance manoeuvre is in progress"
      source: mission.yaml:launch_state
    moved_by:
      - "command:arm_engine"
    command_value:
      - verb: arm_engine
        argument: state
        when: {engine: aps}
        maps:
          safe: "off"
        why: >-
          `armed` is the identity, and `safe` becomes `off` rather than `standby` because the ascent
          engine **has no standby**: its vocabulary is `off,armed,ignition,mainstage,shutdown,failed`
          and `vehicle.yaml#propulsion.lm_aps` says the engine cannot throttle, "which is why an
          ascent commit is a single irreversible act". There is no ready-but-not-armed position to
          return to, so safing it puts it out
    dwell: {min_on_s: 0.5, min_off_s: 0}
    provenance:
      basis: historical
      source: "the ascent engine cannot throttle and is not restartable in any operational sense, so its state machine has no throttle state and its minimum off time is zero — there is nothing to protect by waiting, because a second attempt is not a thing that happens"

  - id: thrust_main_n
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        no engine of this vehicle is firing at MET 0. The mission's clock starts at the top of
        `translunar_coast` (`mission.yaml#phases`), the budget's first entry is the SIVB's TLI —
        an external stage — and the first burn on the vehicle's own budget is the 6.4 m/s
        translunar midcourse correction later in that phase. Zero is what the mission profile
        says rather than a placeholder for a figure nobody has
    node: thrust_main
    # **A rule rather than a lag, because the driver is a mode and not a quantity.** As a `lag` this
    # relaxed toward its one incoming edge, `E-PROP-ENG`, which is the propellant tank's *drain*
    # (kg/s per N) and not a cause of thrust: the plant refused it as a numerator naming a quantity
    # the state is not, and it was right. What sets thrust is which engine is firing, which is a mode
    # on `engine_main`, and a mode selection is a table and never a gain. So the rule
    # (`domains/propulsion/rules.py`) relaxes toward the firing engine's rated thrust with the same
    # half-second constant: `rated_thrust_n[engine]` while that engine's state is in `firing_states`,
    # zero while none is. The DPS has no rated figure here, because its thrust at a throttle setting
    # is `thrust_curve`'s owed law, so a firing DPS is a gap rather than a number; two engines firing
    # at once is a gap too, because no configuration of this vehicle does it. `E-PROP-ENG` and
    # `E-PRESS-PROP` drain the SPS's tanks from `sps_thrust_n`, the SPS's share, not from this state:
    # read from here they spent the SPS's propellant and helium on an ascent-engine burn.
    method: dynamics
    unit: N
    tau_s: 0.5
    firing_states: [ignition, mainstage]
    engine_states: {sps: sps_state, dps: dps_state, aps: aps_state}
    rated_thrust_n: {sps: 91188, aps: 15569}
    provenance:
      basis: chosen
      reason: "thrust build-up and tailoff. apollo_diode.md:521 gives valve and motor mechanical transit as 'typically 0.1 to several seconds', and half a second sits inside that: long enough that a one-tick command cannot produce instant thrust, short enough that a burn's shape is dominated by its commanded duration rather than by its rise"
      note: >-
        `rated_thrust_n` is `components.sps.thrust_n` and `components.aps.thrust_n`, copied for the
        rule and held equal to them by `tests/test_propulsion_rules.py`; their provenance is there.
        `firing_states` counts `ignition` as firing because the build-up is this lag's job: an
        engine in ignition is producing a rising thrust, and the half-second constant is the rise

  - id: sps_thrust_n
    initial: 0
    initial_provenance:
      basis: chosen
      reason: "as `thrust_main_n`: the SPS is not firing at MET 0"
    node: sps_thrust
    # **The SPS's own thrust, for the edges that drain its tanks.** The same half-second relaxation as
    # `thrust_main_n`, toward the SPS's rated thrust while `sps_state` is in `firing_states` and zero
    # otherwise, so it equals `thrust_main_n` whenever the SPS is the engine firing (tail-off
    # included) and stays at zero through a descent or ascent burn. It is a state of its own because
    # a drain is read off a node, and `thrust_main` carries every engine's thrust for the dynamics.
    method: dynamics
    unit: N
    tau_s: 0.5
    firing_states: [ignition, mainstage]
    engine_state: sps_state
    rated_thrust_n: 91188
    provenance:
      basis: chosen
      reason: "as `thrust_main_n`, whose constant and firing states this copies; `tests/test_propulsion_rules.py` holds the copies equal"
      note: "`rated_thrust_n` is `components.sps.thrust_n`"

  - id: dps_throttle_pct
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        as `thrust_main_n`: the descent engine is not firing at MET 0, so its throttle actuator
        sits at its closed stop. The engine's own `operating_band_pct` starts at 10 % and the
        actuator's separate existence is what lets a command sit below the band it cannot use
    node: internal
    method: lag
    unit: "%"
    tau_s: 1.0
    provenance:
      basis: chosen
      reason: "the throttle actuator's response. It is a separate state from the engine's thrust because the actuator can be commanded somewhere the engine cannot operate, and that distinction is the whole content of the 65-92.5 % non-operating region"

  - id: chamber_pressure_pct
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        as `thrust_main_n`: no chamber is firing at MET 0, so the chamber is at ambient and its
        gauge reads zero percent of nominal. This is the state whose 0.3 s filling time the
        launch sequence exercises, and it starts empty
    node: internal
    # **A rule rather than a lag**, for the reason its own provenance gives: it "follows thrust", and
    # a state on the sentinel can be reached by no edge, so as a `lag` nothing could drive it. The
    # rule relaxes toward `100 x thrust_main_n / rated_thrust_n[engine]` for the firing engine with
    # the chamber's 0.3 s, and toward zero when none fires: apollo's own row, "0 off; 95-105 firing"
    # (apollo_diode.md:135), with 100 the nominal of a pressure-fed engine at its rated thrust. Thrust
    # is on `thrust_main`, scheduled before the sentinel, so the reading is this tick's. A firing DPS
    # is a gap here for the same reason it is one on `thrust_main_n`.
    method: dynamics
    unit: "% nominal"
    tau_s: 0.3
    thrust_state: thrust_main_n
    firing_states: [ignition, mainstage]
    engine_states: {sps: sps_state, dps: dps_state, aps: aps_state}
    rated_thrust_n: {sps: 91188, aps: 15569}
    provenance:
      basis: chosen
      reason: "chamber pressure follows thrust with the chamber's own filling time; faster than the valve because the chamber is small. apollo_diode.md:135 publishes it at 10 Hz with a 0.1 % precision, which is a fast channel and needs a fast state behind it"
      note: "`rated_thrust_n` is the same copy `thrust_main_n` carries, and the same test holds both to `components`"

  - id: pressurant_pressure_psi
    # **The SPS propellant tanks' ullage pressure: the regulated helium, as the tanks receive it.**
    # AOH SM2A-03 Block II Vol. 1 §2.4.1 (p. 2.4-1) and §2.4.2.1.2 (p. 2.4-7): the helium valves
    # "isolate the helium during nonthrusting periods", and in AUTO they are "automatically
    # controlled by a thrust ON-OFF signal". So between burns nothing flows and the tanks hold what
    # they had; during a burn the regulator holds its working pressure. The rule
    # (`domains/propulsion/rules.py`) is that: hold while the SPS is not firing, relax toward
    # `min(regulator_psia, bottle pressure)` while it is, so the tanks follow the bottles down once
    # the bottles fall below the regulator (blowdown). The bottle pressure is `bottle_fill_psia x
    # m / bottle_fill_kg` over `consumables.pressurant_he_kg`: isothermal at the loading point, and
    # ideal-gas in its *ratio* (helium's compressibility at 3,600 psia is about 1.1, so the ratio
    # reads high by up to that factor near empty; it matters only for blowdown, which the mission's
    # own load never reaches: the full 18,508 kg burns 33.1 kg of the 39.7).
    initial: 178
    initial_provenance:
      basis: historical
      source: >-
        ODB Vol III (SNA-8-D-027(III) Rev 2), Table 3.3-10 "Consumables Loading Requirements and
        Tolerances", Helium and Nitrogen, PDF p. 431: "Helium - Fuel Tanks 178 [psia] 70 [F]" and
        "Helium - N2O4 Tanks 178 70", 5.4 lb between them, actual 178 and 170 psia; the
        Amendment 80 table at PDF p. 205 gives the same requirement with 181/181 actual. The SPS
        fuel and oxidizer tanks are pressurized at the pad, so MET 0 starts at the loading
        requirement
      note: >-
        **This entry said the ODB gives only storage pressures and no regulated one, and read the
        178 as a bottle's.** The 178 psia line is the propellant tanks' own ullage charge: the next
        line in the same table is "Helium - N2O4 Tanks", at the same pressure, and the two share
        one 5.4 lb weight. It is below the regulator's 186 because the valves are closed until the
        first burn, and above the 157 psia SPS PRESS light
    node: internal
    method: dynamics
    unit: psi
    tau_s: 5
    tau_s_placeholder: >-
      used, and chosen in shape: no source gives how fast the ullage comes up to the regulated
      pressure when the valves open. It is the ullage's fill time rather than the regulator's
      response (the regulator is fast; the ullage is a volume), and five seconds is the order the
      thrust build-up is not, so the first seconds of a burn read below the regulated pressure
    engine_state: sps_state
    firing_states: [ignition, mainstage]
    regulator_psia: 186
    bottle_fill_psia: 3600
    bottle_fill_kg: 39.73469
    helium_state: pressurant_he_kg
    provenance:
      basis: chosen
      reason: "the time constant above; every pressure it relaxes between is sourced, and the copies are held to their homes by tests/test_propulsion_rules.py"
      note: >-
        `regulator_psia` is `components.pressurant_regulator.working_psia`, `bottle_fill_psia` is
        `components.helium_bottles.fill_psia`, and `bottle_fill_kg` is
        `consumables.pressurant_he_kg.initial`, copied for the rule

  - id: feed_pressure_pct
    # **The feed as a percentage of the regulator's working pressure.** apollo_diode.md:138 gives
    # the channel as "% nominal", 95-105 expected; the nominal is the pressure the system is built
    # to deliver, which is the regulator's 186 psia (AOH p. 2.4-41). The rule relaxes it toward
    # `100 x pressurant_pressure_psi / nominal_psia` with the line's 0.2 s, so at MET 0 the feed
    # reads the tanks' 178 psia as 95.7 % — inside apollo's band, and below 100 because the valves
    # have not yet opened — and during a burn it reads 100. What it does not model is any line drop
    # between the tanks and the injector, because no SPS source gives one: `vehicle.yaml` said
    # "engine inlet 165 psia", which the AOH and TN D-7375 do not support, and the 165 +/- 4 psia
    # the LM AOH does publish is the *ascent engine's* trim-orifice outlet (LM AOH p. 2.3-43).
    initial: 95.6989247311828
    initial_provenance:
      basis: derived
      relation: "the tanks' loading pressure over the regulator's working pressure, 178 / 186 = 95.70 %; the linter evaluates `initial_derivation` on integrator states only, so `tests/test_propulsion_rules.py` holds this one to its two inputs"
    node: internal
    method: dynamics
    unit: "% nominal"
    tau_s: 0.2
    tank_state: pressurant_pressure_psi
    nominal_psia: 186
    provenance:
      basis: chosen
      reason: "feed pressure is downstream of the regulator and upstream of the injector, so it responds fastest of the three. It is the channel the F-08 stuck-sensor chain turns on, and a state slower than the sensor would make a stuck sensor undetectable by rate"
      note: "`nominal_psia` is `components.pressurant_regulator.working_psia`, copied for the rule"

  - id: accumulated_dv_m_s
    node: internal
    method: dynamics
    unit: m/s
    # **The two things a scalar `dynamics` state needs, and the corpus declared neither because it
    # had never been asked.** An accumulator with no zero is a number nobody can interpret, and the
    # rule it integrates is `dv/dt = F/m` — so it owes both the zero and the mass.
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        no engine of this vehicle has fired at MET 0, and the state's own note says where the clock
        starts: the first burn on the vehicle's own budget is the translunar midcourse correction,
        and the SIVB's TLI is an external stage. Zero is what the mission profile says rather than a
        placeholder for a figure nobody has
    mass_kg: 44085
    mass_source: vehicle.yaml:configurations.csm_lm_docked.mass_kg
    # The sentinel can carry no edge, so the thrust is named. `thrust_main_n` advances at node
    # 27 of the derived order and this state advances with its domain after the whole schedule,
    # so the reading is always this tick's — which the linter checks rather than assumes.
    driven_by: thrust_main_n
    mass_note: >-
      **the mass is the configuration's, not the engine's**, and it is declared here rather than read
      from a stock the plant cannot yet advance. `csm_lm_docked` is the heaviest configuration and
      the one the mission starts in (`vehicle.yaml#configurations`, 44,085 kg) — the same figure
      `E-ENG-DYN`'s own sensitivity is derived from, `1/mass_kg` = 2.2683e-05 m/s2 per N. What is
      owed is the *live* mass: `E-ENG-DYN`'s note says the plant should use `1/m(t)`, and the same
      newton accelerates the LM twice as hard once the CSM is gone. The term that would make it live
      is the propellant stock, which is the flow this vehicle cannot yet move — `E-PROP-ENG`'s driver
      is a stock *level* and its unit is stated backwards. Until then a fixed mass is the honest
      reading, and it is named here rather than buried in the arithmetic
    provenance:
      basis: apollo
      ref: "apollo_diode.md:141"
      note: "an integrated state that is not conserved, which is what the `dynamics` class is for: position and velocity are the same kind of thing. It is integrated here rather than in GNC because the cutoff has to be available to the engine's own state machine at the moment of effect — a cutoff that waits for the guidance cycle is a cutoff that overruns"

  - id: sps_burn_count
    node: internal
    method: discrete
    unit: count
    moved_by:
      - "logic:the count of burns the engine has flown, incremented by the sequence"
    non_latching: true
    provenance:
      basis: historical
      source: "the AJ10-137 qualified for 50 restarts. Declared `non_latching` because a counter is not a latch: it is advanced by a burn-start event rather than by a comparator, and giving it hysteresis would be a category error the linter is right to ask about"

components:

  - id: sps
    kind: discrete
    class: engine
    vehicle: csm
    engine: AJ10-137
    thrust_n: 91188
    isp_s: 314.5
    throttleable: false
    qualified_restarts: 50
    vehicle_keys: [sps]
    provenance:
      basis: historical
      source: "20,500 lbf = 91,188 N; Isp 314.5 s; 100 psia chamber; qualified for 50 restarts, of which Apollo 11 used 5"
  - id: dps
    kind: discrete
    class: engine
    vehicle: lm
    thrust_max_n: 43192
    thrust_min_n: 4671
    throttle_ratio: 10
    isp_s: 305
    # Two operating intervals, not one. The DPS reaches 1,050 lbf at 10 % and its 9,710 lbf
    # maximum at 92.5 %, and **65-92.5 % is a region it is not designed to run in** — the source
    # below says so in those words. Until this round `operating_band_pct` was the single interval
    # `[10.5, 92.5]`, which contains the non-operating one: a fleet asking whether 75 % is
    # commandable got yes from this field and no from the next, and neither was read by a tool.
    # The floor was 10.5 %, which no source gives: 1,050 lbf is 10 % of the 10,500 lbf rating, and
    # TN D-7143 and the LMAOH both put the minimum-throttle point at 10 % (below).
    operating_band_pct:
      - [10, 65]
      - [92.5, 100]
    non_operating_band_pct:
      - [65, 92.5]
    vehicle_keys: [lm_dps]
    provenance:
      basis: historical
      source: "the DPS experience report: 9,710 lbf operating maximum and 1,050 lbf minimum, 10:1 range, with 65-92.5 % a NON-OPERATING region. TN D-7143 (Apollo Experience Report, Descent Propulsion System) p. 9: 'The minimum-throttle point was 10 percent of the rated thrust' (10,500 lb, p. 7). LMAOH LM-10 p. 2.1-155: the TTCA controls 'from 10% to 92.5 % of maximum thrust'; its p. 2.3-27 'Minimum engine thrust 1,280 pounds (12.2%)' is delivered thrust at that stop on LM-10 and later, not the commanded floor. Isp 305 s is the NASA end-of-duty-cycle requirement; the 311 s in circulation traces only to Wikipedia"
  - id: aps
    kind: discrete
    class: engine
    vehicle: lm
    thrust_n: 15569
    isp_s: 309.4
    throttleable: false
    vehicle_keys: [lm_aps]
    provenance:
      basis: historical
      source: "3,500 lbf nominal (3,464 predicted, 3,439 measured) = 15,569 N; Isp 309.4 predicted"
  - id: feed_valve_sps
    kind: discrete
    class: valve
    transit_s: 0.5
    provenance:
      basis: chosen
      reason: "apollo_diode.md:521 gives valve transit as 'typically 0.1 to several seconds' with no per-valve figure; half a second is inside the published range and is the same order as the thrust response it drives"
  - id: feed_valve_dps
    kind: discrete
    class: valve
    transit_s: 0.5
    provenance:
      basis: chosen
      reason: "as feed_valve_sps"
  - id: pressurant_regulator
    kind: flow
    class: regulator
    working_psia: 186
    working_tolerance_psi: 4
    lockup_psia: 195
    provenance:
      basis: historical
      source: >-
        AOH SM2A-03 Block II Vol. 1, §2.4.3.1 Design Data, p. 2.4-41 (change 16 July 1969):
        "Regulator Units (2) Working regulator, primary 186±4 psig, secondary 191±4 psig. Primary
        lockup 195 psig. Secondary lockup 200 psig." Regulator pressures are referenced to a bellows
        vented to ambient (§2.4.2.1.3, p. 2.4-7), so in vacuum psig reads as psia
      note: >-
        **this entry was UNCONFIGURED with the 186 in its own note**, attributed to "NR, AJ10
        report" without a page; the AOH is the page. TN D-7375 (Apollo Experience Report, Service
        Propulsion Subsystem, 1973, p. 3, PDF p. 7) says the design phase selected 4,400 psia helium
        "regulated to 180 psia": that is the Block I selection, and the Block II handbook's
        working figure is the one flown. What is still not declared is a transfer function between
        lockup and flow; the rule treats the regulator as holding its working pressure while the
        bottles stay above it, which is what a regulator is for
  - id: helium_bottles
    kind: flow
    class: tank
    count: 2
    volume_ft3_each: 19.4
    fill_psia: 3600
    fill_tolerance_psi: 50
    maximum_operating_psia: 4400
    provenance:
      basis: historical
      source: >-
        AOH SM2A-03 Block II Vol. 1, §2.4.3.1, p. 2.4-41: "Helium Tanks (2) 3600±50-psia nominal
        fill pressure, 4400-maximum operating pressure. Capacity 19.4 cubic ft each". The charge,
        87.6 lb at 3,600 psia and 70 F, is ODB Table 3.3-10's and is
        `consumables.pressurant_he_kg.initial`
  - id: sps_propellants
    kind: flow
    class: propellant
    mixture_ratio: 1.6
    reference_temperature_f: 70
    fuel_density_g_cc: {at_0_c: 0.922904, per_c: 0.0009377}
    oxidizer_density_g_cc: {at_0_c: 1.491539, per_c: 0.0022832}
    provenance:
      basis: historical
      source: >-
        Mixture ratio: TN D-7375 p. 6 (PDF p. 10), Block II "establishment of the operating propellant ratio as
        1.6 pounds of oxidizer per pound of fuel", and since "the propellant-density ratio was
        1.6:1" the fuel and oxidizer tanks are identical in size. Densities: ODB Vol III Rev 2,
        Table 3.1-11 note 2, PDF p. 213: "Nominal fuel density = 0.922904 - 0.0009377 (°C)",
        "Nominal oxidizer density = 1.491539 - 0.0022832 (°C)", g/cc at 14.7 psia. The reference
        temperature is the AOH gauging tables' 70 F (Figures 2.4-14 and 2.4-15) and the ODB's
        helium loading temperature
      note: >-
        what these are for: the helium a burn spends is the volume of propellant it expels, filled
        at the regulated pressure, so `E-PRESS-PROP` is derived from them. At 70 F the fuel is 903.1
        and the oxidizer 1,443.3 kg/m3, and at 1.6:1 a kilogram of propellant is 8.522e-4 m3
  - id: dps_throttle_actuator
    kind: discrete
    class: actuator
    band_pct: [10, 92.5]
    non_operating_pct: [65, 92.5]
    provenance:
      basis: historical
      source: "as dps. The actuator's *band* is what the interlock checks; a command inside the non-operating region is impossible rather than unwise, which is a distinction only a published band can carry"

# --------------------------------------------------------------------------------------
# The throttle-to-thrust relation, declared in shape and unset in value.
# --------------------------------------------------------------------------------------
thrust_curve:

  shape: "piecewise; monotone within each operating segment; zero outside the operating band"
  segments:
    - band_pct: [10, 65]
      operating: true
      model: "monotone, curvature unknown"
      coefficients: UNCONFIGURED
    - band_pct: [65, 92.5]
      operating: false
      model: "non-operating: thrust is undefined because the engine is not designed to run here"
      coefficients: null
    - band_pct: [92.5, 100]
      operating: true
      model: "operating maximum at 92.5 % of the throttle scale, above which the command saturates"
      coefficients: UNCONFIGURED
  provenance:
    basis: UNCONFIGURED
    note: >-
      This is the honest centre of the domain. main_propulsion_diode.md:36 refuses to state a
      thrust law and it is right to: a linear interpolation between the 1,050 lbf minimum and
      the 9,710 lbf maximum would be a claim about combustion that nobody has made. What the
      vehicle *can* do without the law is everything the mission actually needs from a burn
      model: commanded versus estimated thrust (apollo's own two channels), a chamber-pressure
      consequence, a duration, an accumulated delta-v, and a cutoff. The law matters for
      fidelity of the achieved delta-v, and the 65-92.5 % region matters more than the curve —
      because a command inside it is impossible rather than merely inaccurate.

      # --------------------------------------------------------------------------------------
      # Burn capability accounting. `mission.yaml` budgets the delta-v; this is what the vehicle
      # checks before accepting a burn.
      # --------------------------------------------------------------------------------------
capability:

  # **The engine each budget is for is now a component id rather than a prefix of a key.** The
  # block read `sps_total_burn_s` and `dps_total_burn_s`, and `mission.yaml`'s burns name their
  # engine `sps`, `lm_dps` and `lm_aps` — so `dps` and `lm_dps` are one engine under two names, and
  # a check that matched the key's prefix to the burn's `engine` would have had to know that. That
  # is the divergence `vehicle_keys` exists for, and here the link is the field itself.

  - engine: sps
    total_burn_s: 750
    restarts_qualified: 50
    provenance:
      basis: historical
      source: "the SPS is qualified for 750 s of total burn time and 50 restarts; the mission's own burns are in mission.yaml#delta_v_budget"
    note: >-
      a budget the mission spends, and Apollo 11 spent 531.9 s of it. That makes "can we fix this
      with a burn" a question with a number behind it rather than a question with an attitude
      behind it, which is the whole reason the figure is here. Until this round nothing read the
      budget and the mission's burn *durations* were sentences in `delta_v_budget`'s provenance —
      "LOI-1 2,917.4 ft/s over 357.53 s" — so there was nothing to spend it against. The durations
      are `burn_s` fields now and the sum is checked against this figure.

  - engine: dps
    total_burn_s: 960
    restarts_qualified: 20
    provenance:
      basis: historical
      source: >-
        `lm_propulsion_rcs_study_guide.pdf`, PDF p. 31 (printed p. 19), "Design and Performance
        Characteristics" for the descent engine: **Thrust 10,500 pounds**, throttling range 10:1,
        oxidiser/fuel ratio 1.6:1, **engine life 960 seconds**, **restart capability 20 times**,
        specific impulse 300 seconds (approx), chamber pressure 110 psi. The thrust and the
        throttling range are what identify the block as the DPS: the ascent engine's block, two
        pages of text later, gives 3,500 pounds and 120 psi
      note: >-
        **this entry said "the DPS's equivalent is unpublished", and the number is on printed page
        19 of a document the manifest lists.** It also mis-stated the spend: it said the mission's
        descent burn is 756.39 s and the sum the check reports is **786.39 s** across two burns, so
        the one figure the note did carry was 30 s wrong. The rating fits with room to spare —
        786.39 s of 960, and 20 restarts against the mission's two — which is the answer the block
        exists to give. For contrast the ascent engine has 460 s and the mission's single ascent
        burn is 434.88 s: a 5 % margin, and the tightest engine budget on the vehicle


  - engine: aps
    total_burn_s: 460
    restarts_qualified: 35
    provenance:
      basis: historical
      source: >-
        `lm_propulsion_rcs_study_guide.pdf`, PDF p. 39 (printed p. 27), "Design and Performance
        Characteristics" for the ascent engine: **Thrust 3500 pounds**, oxidiser/fuel ratio 1.6:1,
        **engine life 460 seconds**, **restart capability 35 times**, specific impulse 300 seconds
        (approx), chamber pressure 120 psi, oxidiser flow rate 7 lbs/sec (approx). The same page
        describes the valve package: a series-parallel arrangement of ball valves in fuel-oxidiser
        pairs, all eight rotating 90 degrees on a common crankshaft, with the actuators spring-closed
        when the solenoids de-energise — which is why an ascent commit is a single irreversible act
      note: >-
        **the entry this replaces was the block's own header note: "declares no budget for 2 burn(s)
        on this vehicle's own engines (ascent on aps, rendezvous on aps)"** — and the mission has had
        one ascent burn and no rendezvous burn on the APS for several rounds, so the debt's count was
        stale in both directions. 460 s against the mission's 434.88 s is the tightest of the three
        engine budgets: 94.5 % of the rating, against the SPS's 70 % and the DPS's 82 %. The
        Apollo 11 ascent burn was 435 s, so this is the figure the real mission flew against too
