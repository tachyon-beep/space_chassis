# domains/crew/components.yaml — the crew as an instrument, and the display contract that
# bounds what they may report.
#
# ## Why this file is the most important one in the vehicle
#
# `review-findings.md` #4 found that the design's rule for the GM — "the crew answer is bounded
# by what that crew member could perceive from where they are, not by what the GM knows"
# (`simulator-design.md:392-403`) — is an *instruction to an LLM*, in a design whose §7 argues
# that a convention will rot and enforces the instrument boundary in a function signature. Same
# anti-pattern, worse placement: a leak in a crew line arrives as a plausible sentence an agent
# correctly trusts.
#
# The fix is the perception function, computed **before** the GM composes so that excluded truth
# never enters its context window:
#
#     (full_truth, crew_position, display_contract) → perceivable_subset
#
# `simulator-design.md:561-564` claims `crew_diode.md` supplies the third argument. It does not:
# `crew_diode.md:42` says display topology "was not supplied" and "remains configuration item";
# `module` occurs zero times in that file and `panel` once, as a widget name. So the contract
# below is **authored**, and it is the artifact conflict register D-06 names as the precondition
# for enabling `ask_crew` at all.
#
# ## What the contract is, and what it is not
#
# It is not a UI specification and nothing renders it. It exists so that a question can be
# answered by a lookup instead of by a judgement: given a position, which readouts are in front
# of that person, at what displayed precision, and therefore what could they honestly say.
#
# The precision field is the part that matters most and the part a channel list cannot express.
# A crew member reading a cabin-pressure gauge to the nearest tenth of a psia is a different
# instrument from one reading it to the nearest hundredth, and `ask_crew` must inherit the
# *displayed* precision rather than the channel's published one — otherwise the crew become a
# better sensor than any instrument on the vehicle, which is the opposite of the point.

domain: crew

# Crew are not periodic. What is periodic is the alert system they read and the alarm they hear,
# and both are already cadenced by the domains that produce them.
natural_rate_hz: 1

# `water_potable` is the sixth and it is the one consumption in the corpus that is a *rate of
# people* rather than of machinery: `E-CREW-WATER` drinks it at 2.27 kg per crew-day, which is the
# figure `E-CREW-ATM` cites for oxygen at the water rate instead of the gas-exchange rate. The crew
# domain declares the dependency; the water is consumables' node.
reads: [instrumentation, cabin_atm, lm_cabin_atm, structure_config, command_executive,
        water_potable]
writes: [crew_state, alert_state]

# --------------------------------------------------------------------------------------
# State.
# --------------------------------------------------------------------------------------
# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [crew_destination, crew_roused, switch_panel, breaker_panel]
internal_order_note: >-
  where each person has been sent and whether they have been roused first, because they are a
  command's record and the panels do not read them. Both sit here rather than on `crew_state`
  because a command reaches a coupling node only through an `E-CMD-*` edge and the crew have none:
  the sentinel is the one place a verb's write lands with no edge, and the crew-day rules on
  `crew_state` read them a tick later, which is the latency of a person being woken. Then the two panels a crew position can throw: switches before breakers, because a
  breaker is opened in response to what a switch did.

state:
  - id: switch_panel
    node: internal
    method: discrete
    unit: "map[switch_id,bool]"
    moved_by:
      - "logic:the crew throw them, and no verb writes a switch — which is what `controls.switches` being a crew-only surface means"
    dwell:
      min_on_s: 1
      min_off_s: 1
    provenance:
      basis: apollo
      ref: "apollo_diode.md:224"
      note: >-
        the crew-operated switches, and the state this domain was publishing without having.
        `controls.switches` named `hatch_state` as its source — a state in *another domain* that
        has nothing to do with it — which the linter's `from` check found. The switch positions
        are the crew's own control surface: agents observe them and cannot move them, and in
        `rcs.mode = manual` they are how the vehicle is flown. One second of dwell (chosen)
        because a switch has mechanical detents and a position that could change every tick would
        be a bounce rather than a setting

  - id: breaker_panel
    node: internal
    method: discrete
    unit: "map[breaker_id,enum[in,out,tripped]]"
    initial: UNCONFIGURED
    initial_note: >-
      each breaker's position at MET 0. The state is a map over `breaker_id`, so its initial is a
      position per breaker — and `breaker_id` is the thing this state does not have. The launch
      checklist states pad breaker positions panel by panel (p. 11), then changes breakers during
      orbit, TLI and docking. MET 0 is after extraction, so the pad map cannot be its initial map.
      What would close it: the LCL set used by `set_breaker`, a mapping to checklist breaker names,
      and the resulting positions after the intervening checklist steps
    moved_by:
      - "command:set_breaker"
    command_value:
      - verb: set_breaker
        argument: state
        maps:
          reset: in
        why: >-
          `in` and `out` are the identity. `reset` is not a position, it is an action: it clears a
          latched trip and **attempts a reclose**, which is why this verb's own help says "a load
          that trips twice inside the recovery dwell will latch again on the next attempt" and why
          `power.lcl_tripped`'s note calls the mechanism "one controlled reclose and then latch"
          (`electrical_diode.md:254, :888-901`). So the breaker ends `in` — energised — and the
          protection is free to trip it again, which is what `electrical_diode.md:403`'s
          `reset_load_trip` rule ("fault disappeared, retry count, delay elapsed") is checked for
        key: breaker
    dwell:
      min_on_s: 5
      min_off_s: 5
    provenance:
      basis: apollo
      ref: "apollo_diode.md:225"
      note: >-
        the crew-operated breakers, and the same defect: it named the hatch. This is the one crew
        control with an immediate electrical consequence, which is why the lower equipment bay is
        where a crew action and an agent command can collide — `set_breaker` is the agent's route
        to the same hardware and `controls.breakers` is the crew's, and they are deliberately
        different channels for the same breakers. Five seconds of dwell because a breaker is a
        deliberate act and a tripped one is a fault rather than a setting

  - id: crew_destination
    node: internal
    method: discrete
    unit: "map[crew_id,enum[csm_commander,csm_navigator,csm_lower_equipment_bay,lm_commander,lm_pilot,tunnel,surface_eva]]"
    # Each person's own seat: nobody has been sent anywhere at MET 0, so the last station a person
    # was asked at is the one they started in. A destination the configuration takes out of reach
    # (a CSM seat once the LM is away) returns them to their seat in the vehicle they are in.
    initial:
      commander: csm_commander
      lm_pilot: csm_lower_equipment_bay
      csm_pilot: csm_navigator
    initial_provenance:
      basis: derived
      relation: "nobody can have been sent anywhere before MET 0, because `ask_crew` is the only thing that sends a person and the mission's first command lands after the epoch; so each destination is the person's starting station, `crew_location.initial`"
      source: mission.yaml:crew.positions
    moved_by:
      - "command:ask_crew"
    command_value:
      - verb: ask_crew
        argument: position
        key: crew_id
        # The identity, declared because `lm_pilot` is both a person (`crew_id`) and a station
        # (`position`), so which argument carries the value cannot be read off the vocabulary.
        maps:
          csm_commander: csm_commander
          csm_navigator: csm_navigator
          csm_lower_equipment_bay: csm_lower_equipment_bay
          lm_commander: lm_commander
          lm_pilot: lm_pilot
          tunnel: tunnel
          surface_eva: surface_eva
        why: >-
          a question is asked of a person *somewhere* (`ask_crew.help`: "is the aft bay frosted?" is
          answerable only by somebody who goes and looks, "which costs mission time and relocates
          the sensor"). So the station the question names is where the person goes, and they stay
          there until asked somewhere else: sending the LM pilot to the tunnel to listen for a leak
          takes them off the lower equipment bay's breakers until somebody asks them back. Whether
          they can get there is `crew_location`'s rule, which reads this
    dwell:
      min_on_s: 0
      min_off_s: 0
    provenance:
      basis: derived
      relation: >-
        the request half of `crew_location`, kept apart from it because a command writes its value
        before the tick and the rule decides whether the station is reachable: a station written
        straight into `crew_location` would put the CM pilot in the LM's left seat while the LM is
        on the surface, and the rule could not tell where she had been. Private truth, published
        nowhere: what a fleet sees is where the person is, `crew.location_[id]`
  - id: crew_clock_us
    node: crew_state
    method: discrete
    unit: us
    initial: 0
    initial_provenance:
      basis: derived
      relation: "the crew's flight-plan clock is MET, and MET is zero at the epoch (`mission.yaml#met_epoch_utc`)"
      source: mission.yaml:met_epoch_utc
    moved_by:
      - "logic:the tick's horizon, in whole microseconds"
    # A clock is a counter, not a latch: nothing compares it to a threshold, so it has no dwell.
    non_latching: true
    provenance:
      basis: derived
      relation: >-
        MET, kept by the crew domain because a rule reads its snapshot and nothing else, and the
        snapshot carries no clock: the flight plan the crew keep is a table in mission time, so the
        rule that reads it needs one. Whole microseconds, as `plant.md` §6 counts time, so a long
        coast does not drift by float accumulation. Private truth, published nowhere — the fleet
        has `mission.met_s`
  - id: crew_scheduled
    node: crew_state
    method: discrete
    unit: "map[when,enum[sleep,meal,work]]"
    initial:
      previous: work
      now: work
    initial_provenance:
      basis: derived
      relation: "the flight plan's first scheduled period after MET 0 is the GET 7:30 meal (FP11 p3-8), so at MET 0 the crew are working, and were at the tick before"
      source: domains/crew/components.yaml:state.crew_scheduled.flight_plan
    moved_by:
      - "logic:the flight plan's period at this MET, and the one at the tick before"
    # **The crew day, from the Apollo 11 Final Flight Plan (1 July 1969).** "The crew will eat and
    # sleep simultaneously throughout the mission. Eat periods will be normally 1-hour duration ...
    # Sleep periods will normally be 8 to 10 hour duration" (FP11 printed p1-13). Each row is a GET
    # from the plan's detailed timeline (section 3; the printed row, to ten minutes) and the phase
    # it is anchored to; `anchors_get_h` places each phase's Apollo 11 event at this mission's
    # start of that phase. Extracted in `/mnt/project-files/sources/crew.md` §1.2.
    flight_plan:
      - {anchor: translunar_coast, activity: meal, get_h: [7.5, 8.5]}
      - {anchor: translunar_coast, activity: meal, get_h: [12.5, 13.5]}
      - {anchor: translunar_coast, activity: sleep, get_h: [13.5, 22.0]}
      - {anchor: translunar_coast, activity: meal, get_h: [23.0, 24.0]}
      - {anchor: translunar_coast, activity: meal, get_h: [28.5, 29.5]}
      - {anchor: translunar_coast, activity: meal, get_h: [36.0, 37.0]}
      - {anchor: translunar_coast, activity: sleep, get_h: [37.0, 47.0]}
      - {anchor: translunar_coast, activity: meal, get_h: [47.5, 48.5]}
      - {anchor: translunar_coast, activity: meal, get_h: [52.5, 53.5]}
      - {anchor: translunar_coast, activity: meal, get_h: [59.5, 60.5]}
      - {anchor: translunar_coast, activity: sleep, get_h: [61.0, 69.0]}
      - {anchor: translunar_coast, activity: meal, get_h: [69.5, 70.5]}
      - {anchor: lunar_orbit, activity: meal, get_h: [78.0, 79.0]}
      - {anchor: lunar_orbit, activity: meal, get_h: [84.0, 85.0]}
      - {anchor: lunar_orbit, activity: sleep, get_h: [85.0, 94.0]}
      - {anchor: lunar_orbit, activity: meal, get_h: [94.0, 95.0]}
      - {anchor: transearth_coast, activity: meal, get_h: [136.0, 137.0]}
      - {anchor: transearth_coast, activity: sleep, get_h: [137.0, 147.0]}
      - {anchor: transearth_coast, activity: meal, get_h: [147.5, 148.5]}
      - {anchor: transearth_coast, activity: meal, get_h: [153.5, 154.5]}
      - {anchor: transearth_coast, activity: meal, get_h: [159.0, 160.0]}
      - {anchor: transearth_coast, activity: sleep, get_h: [160.0, 170.0]}
      - {anchor: transearth_coast, activity: meal, get_h: [170.0, 171.0]}
      - {anchor: transearth_coast, activity: meal, get_h: [175.5, 176.5]}
      - {anchor: transearth_coast, activity: meal, get_h: [181.5, 182.5]}
      - {anchor: transearth_coast, activity: sleep, get_h: [182.5, 189.5]}
      - {anchor: transearth_coast, activity: meal, get_h: [189.5, 190.5]}
    flight_plan_provenance:
      basis: historical
      source: >-
        Apollo 11 Flight Plan, AS-506/CSM-107/LM-5, Final, 1 July 1969 (re-formatted edition,
        https://apollojournals.org/alsj/a11/a11fltpln_final_reformat.pdf), detailed timeline printed
        pp. 3-6 to 3-129: the EAT PERIOD and REST PERIOD rows. Two rows are moved to the half hour
        where the printed row and the plan's own note disagree: the first rest period begins at
        GET 13:30 (printed p1-16, "starting with the First sleep period (GET 13:30)"), so the meal
        printed at 13:00 is the hour before it; and the third, printed "~60:00/61:00-69:00", is
        taken from 61:00 after the 59:30 meal
      note: >-
        **The descent, the surface and the ascent have no rows**, so the crew work through them: the
        plan has "two 4 to 5 hour sleep periods while the LM is on the lunar surface" (p1-13), and
        their GETs are not extracted yet. That is owed rather than invented (`open_debts`). The
        three activities are the ones the plan schedules for everyone at once; suiting, the
        tunnel and EVA are where a person is (`crew_location`), not what they are doing
    # Each anchored phase's Apollo 11 event, as the GET this mission's phase start stands for:
    # MET = GET - anchor.
    anchors_get_h:
      translunar_coast: 4.2833
      lunar_orbit: 2.8306
      transearth_coast: 2.8950
    anchors_provenance:
      basis: derived
      relation: >-
        MET = GET - (Apollo 11 GET of the phase's opening event - this mission's `starts_at_h` for
        the phase). `translunar_coast` opens at spacecraft ejection, GET 4:17 (MR11 Fig. 3-1), at
        MET 0; `lunar_orbit` opens at LOI-1 ignition, GET 75:49:50 (MR11 Table 3-I), at MET 73.0;
        `transearth_coast` opens at TEI ignition, GET 135:23:42 (MR11 Table 3-I), at MET 132.5. The
        three differ because this mission's coast is 73 h by design rather than Apollo 11's
        71.5 h, so each phase's rows keep their place relative to the event that starts it
      source: mission.yaml:phases
    # A projection of the clock through a table, not a comparator: it changes when the table says
    # and at no other time, so there is nothing for a dwell to debounce.
    non_latching: true
    provenance:
      basis: historical
      source: >-
        the flight plan above, read against `crew_clock_us`. It keeps the last tick's period beside
        this one (`previous`, `now`) because the start and the end of a rest period are what clear
        a question's hold on a person (`crew_roused`), and a rule reads only its snapshot
        (`domains/crew/rules.py:crew_scheduled`). Private truth: the fleet is given the flight plan
        in its brief, not on a channel
  - id: crew_roused
    node: internal
    method: discrete
    unit: "map[crew_id,bool]"
    initial:
      commander: false
      lm_pilot: false
      csm_pilot: false
    initial_provenance:
      basis: derived
      relation: "nobody has been asked anything before MET 0"
      source: domains/crew/commands.yaml:commands.ask_crew
    moved_by:
      - "command:ask_crew"
      - "logic:cleared when a scheduled rest period begins or ends"
    command_value:
      - verb: ask_crew
        argument: crew_id
        constant: true
        key: crew_id
        why: >-
          a question reaches the person it names, whatever they are doing. Asked in a rest period,
          they are awake for the rest of it, and the rest they lose is owed (`crew_rest_owed_s`).
          Asked while awake, the flag changes nothing until the next rest period begins, which
          clears it
    # Set by a question and cleared by the flight plan; neither is a reading that could chatter.
    non_latching: true
    provenance:
      basis: chosen
      reason: >-
        the cost of asking a sleeping person, made a state so it lasts beyond the question. Apollo 11
        flew simultaneous rest with one man in the left couch (FP11 p1-13, p3-11), and the ground
        let the crew sleep on rather than wake them (AFJ11, GET 47:41: "the Flight Director ...
        decided to let the crew remain asleep"). A question at night is the ground's choice to
        spend that. Private truth: the fleet sees `crew.available`
  - id: crew_rest_owed_s
    node: crew_state
    method: discrete
    unit: "map[crew_id,s]"
    initial:
      commander: 0.0
      lm_pilot: 0.0
      csm_pilot: 0.0
    initial_provenance:
      basis: derived
      relation: "no rest period has begun before MET 0, so none can have been cut short"
      source: mission.yaml:met_epoch_utc
    moved_by:
      - "logic:grows while a person is kept awake through a scheduled rest period, and is repaid as sleep after one ends"
    # An accumulator of seconds, not a latch.
    non_latching: true
    provenance:
      basis: chosen
      reason: >-
        the delayed half of waking someone: rest lost at night is taken when the rest period ends,
        so the person is asleep, and does not answer, at the start of the next working day. It is
        bookkeeping of hours, not a model of a person (`apollo_diode.md:754`): no fatigue, no error
        rate, just time not spent awake. Apollo did move rest periods on the ground's word — the
        third Apollo 11 rest period ran about two hours long when a midcourse correction was
        deleted (AFJ11, GET 68:28) — so the hours are the real currency. Private truth
  - id: crew_activity
    node: crew_state
    method: discrete
    unit: "map[crew_id,enum[sleep,meal,work]]"
    initial:
      commander: work
      lm_pilot: work
      csm_pilot: work
    initial_provenance:
      basis: derived
      relation: "`crew_scheduled.initial`: nobody has been roused and no rest is owed at MET 0, so each person does what the flight plan has scheduled"
      source: domains/crew/components.yaml:state.crew_scheduled.initial
    moved_by:
      - "logic:the flight plan's period at this MET, unless a question has kept a person awake through a rest period or rest is owed"
    # It changes at the flight plan's boundaries, at a question, and when owed rest is repaid: each is
    # an event, not a reading crossing a limit, so there is nothing to debounce.
    non_latching: true
    provenance:
      basis: historical
      source: >-
        the Apollo 11 flight plan's simultaneous eat and rest periods, above. Three activities and
        no more, because each one changes something a fleet can see: a rest period takes all three
        off the panels and lowers the cabin's CO2 production, and a meal draws the potable tank in
        steps that look, for an hour, like a leak (John, 2026-10-17 13:59Z: meals are worth
        modelling because they make events and noise the team must deal with that are not mission
        events). **The rule is `domains/crew/rules.py:crew_activity`**: the scheduled period at
        this MET (`crew_scheduled`), except that a person roused by a question stays awake through a rest period,
        and a person owed rest sleeps until it is repaid
  - id: crew_location
    node: crew_state
    method: discrete
    unit: "map[crew_id,enum[csm_commander,csm_navigator,csm_lower_equipment_bay,lm_commander,lm_pilot,tunnel,surface_eva]]"
    # Each person's own seat in the vehicle the configuration puts them in, which is the only
    # placement the corpus declares for MET 0: `mission.yaml#crew.positions[].stations.csm` for the
    # three of them, because `translunar_coast` opens docked and `csm_lm_docked` carries its crew in
    # the CSM (`vehicle.yaml#configurations`).
    initial:
      commander: csm_commander
      lm_pilot: csm_lower_equipment_bay
      csm_pilot: csm_navigator
    initial_provenance:
      basis: derived
      relation: >-
        `vehicle.yaml#configurations.csm_lm_docked.crew_in` is `csm`, and each person's CSM
        station is `mission.yaml#crew.positions[].stations.csm`; `plant.py --crew` prints the
        same three for `translunar_coast`
      source: mission.yaml:crew.positions
    moved_by:
      - "logic:the station a person was sent to while it is reachable in the current configuration, else their own seat in the vehicle the configuration puts them in"
    # The person's seat in each vehicle, which is `mission.yaml#crew.positions[].stations` and is
    # held to it by the test file. A person with no station in a vehicle (the CM pilot in the LM) is
    # one the configuration never puts there.
    stations:
      commander: {csm: csm_commander, lm: lm_commander}
      lm_pilot: {csm: csm_lower_equipment_bay, lm: lm_pilot}
      csm_pilot: {csm: csm_navigator}
    stations_provenance:
      basis: derived
      relation: "mission.yaml#crew.positions[].stations, verbatim"
      source: mission.yaml:crew.positions
    # Which vehicle each person is in, per value of `structure.configuration`. `docked` is the
    # stack, crewed from the CSM; `undocked` and `separated` are the LM away with the surface
    # party in it and the CM pilot alone in the CSM; `abandoned` is the ascent stage jettisoned
    # with all three back in the CSM.
    vehicle_by_configuration:
      docked: {commander: csm, lm_pilot: csm, csm_pilot: csm}
      undocked: {commander: lm, lm_pilot: lm, csm_pilot: csm}
      separated: {commander: lm, lm_pilot: lm, csm_pilot: csm}
      abandoned: {commander: csm, lm_pilot: csm, csm_pilot: csm}
    vehicle_by_configuration_provenance:
      basis: derived
      relation: >-
        `vehicle.yaml#configurations[].crew_in` for the configuration each value names
        (`csm_lm_docked` csm; `lm_alone_descent` and `lm_ascent_stage` lm, with `csm_alone_lunar`
        holding the one person whose `goes_to_surface` is false; `csm_alone` csm), split by
        `mission.yaml#crew.positions[].goes_to_surface`
      source: vehicle.yaml:configurations
    # The stations a person may be sent to, per configuration. Docked, the tunnel joins the two
    # cabins and every station in both is in reach of everyone aboard; apart, a person can reach
    # only the stations of the vehicle they are in, and the surface from the LM.
    reachable_by_configuration:
      docked: [csm_commander, csm_navigator, csm_lower_equipment_bay, tunnel, lm_commander, lm_pilot]
      undocked: {csm: [csm_commander, csm_navigator, csm_lower_equipment_bay], lm: [lm_commander, lm_pilot, surface_eva]}
      separated: {csm: [csm_commander, csm_navigator, csm_lower_equipment_bay], lm: [lm_commander, lm_pilot]}
      abandoned: [csm_commander, csm_navigator, csm_lower_equipment_bay]
    reachable_provenance:
      basis: chosen
      reason: >-
        the geometry the display contract already declares: the tunnel is "a transit position" and
        exists only while the vehicles are joined, and `surface_eva` is reachable only from the LM
        and only before the ascent stage leaves the descent stage. **Two gates the open debt names
        are not here**: the hatch being open and the suit loop running are states on the structure
        and ECLSS sentinels, which no other domain's rule can read, and whether the LM is on the
        surface or in orbit is a phase, which no rule can read either — `undocked` covers both. So
        a fleet can send a person out of an LM in orbit, and what stops it is the hatch rule
        structure owns; see `open_debts`
    dwell:
      min_on_s: 30
      min_off_s: 0
    provenance:
      basis: apollo
      ref: "apollo_diode.md:226-227"
      note: >-
        observability has geometry (simulator-design.md:379-381): a crew member is somewhere, and
        someone in the LM cannot report on the CSM. The 30-second minimum is a transit time — a
        crew member does not change position in a tick, and a caller cannot be in two places. The
        enum is the `channels.yaml#crew_positions` list verbatim, and the linter refuses a state
        whose stations differ from the bound's: a station the crew can occupy but the bound does
        not describe is a question answered from nowhere, and a station the bound describes but
        nobody can occupy is a panel that is never read. **The rule is
        `domains/crew/rules.py:crew_location`**: a person sent somewhere by `ask_crew`'s `position`
        (`crew_destination`) is there while it is reachable, and in their own seat otherwise, so a
        separation that strands a destination returns the person to the vehicle they are in rather
        than leaving them in a tunnel that no longer exists.
  - id: crew_availability
    node: crew_state
    method: discrete
    unit: "map[crew_id,enum[available,resting,suit,incapacitated]]"
    initial:
      commander: available
      lm_pilot: available
      csm_pilot: available
    initial_provenance:
      basis: derived
      relation: >-
        MET 0 is after LM ejection, and the Apollo 11 flight plan's
        first rest period begins at GET 13:30 (FP11 p1-16), about nine hours later; so all three are
        awake, unsuited (FP11 p3-6 doffs the suits at GET 5:10, before any question can be asked)
        and able to answer; the flight plan's period at MET 0 is work (`crew_scheduled.initial`)
      source: domains/crew/components.yaml:state.crew_scheduled.initial
    moved_by:
      - "logic:resting while the person's activity is sleep, on suit while they are on the surface, available otherwise; incapacitated holds once a fault has made it so"
    dwell:
      min_on_s: 60
      min_off_s: 60
    provenance:
      basis: apollo
      ref: "apollo_diode.md:226"
      note: >-
        apollo publishes `crew.available` as a boolean with a Sim marker, and a coarse workload
        state, with the explicit warning to avoid synthetic psychology. The four values here are
        the minimum that lets a question go unanswered for a reason: a crew member who is
        resting, on suit, or incapacitated are three different silences. **The rule is
        `domains/crew/rules.py:crew_availability`**, and `incapacitated` is the one value it never
        writes: what puts a person there is CRW-01, whose onset names a person, and which person is
        a scenario's choice rather than this file's (`open_debts`).
  - id: csm_crew_count
    node: crew_state
    method: algebraic
    unit: crew
    moved_by:
      - "logic:the number of people whose station is in the CSM's cabin, the tunnel included"
    cabin_stations: [csm_commander, csm_navigator, csm_lower_equipment_bay, tunnel]
    provenance:
      basis: derived
      relation: >-
        the count of `crew_location` entries whose station is a `csm_*` station or `tunnel`
        (`domains/crew/rules.py:csm_crew_count`). The tunnel is counted with the CSM because it
        opens into the command module once the forward hatch and the probe and drogue are out,
        and it is the CSM's cabin that the tunnel's air is part of. The repair `open_debts` named:
        the crew count as a state of its own, so an edge reading `crew_state` can name it with
        `reads:` — `E-CREW-ATM` (ECLSS's edge, ECLSS's to point here) and `E-CREW-WATER`
      note: >-
        a quantity rather than a mode on a node of modes, which is the change that repair makes to
        what the vehicle models. It is the people breathing this cabin's air, and the number moves
        when somebody goes through the tunnel, which is the first-order effect a cabin CO2 trend
        carries and a fleet watching one should be able to explain
  - id: lm_crew_count
    node: crew_state
    method: algebraic
    unit: crew
    moved_by:
      - "logic:the number of people whose station is in the LM's cabin"
    cabin_stations: [lm_commander, lm_pilot]
    provenance:
      basis: derived
      relation: >-
        the count of `crew_location` entries whose station is an `lm_*` station
        (`domains/crew/rules.py:lm_crew_count`). `surface_eva` is not counted: a person on the
        surface breathes the suit's loop, not the cabin's, so an EVA takes its crew out of the LM
        cabin's CO2 and oxygen budget for as long as it lasts — which is `E-LM-CREW-ATM`'s driver
        (ECLSS's edge, ECLSS's to point here with `reads: lm_crew_count`)
  - id: csm_metabolic_crew
    node: crew_state
    method: algebraic
    unit: crew
    moved_by:
      - "logic:the CSM cabin's people, each weighted by the metabolic rate of what they are doing"
    cabin_stations: [csm_commander, csm_navigator, csm_lower_equipment_bay, tunnel]
    # Awake-equivalents: the edges' rates are "per crew member, awake", so a working or eating
    # person is 1.
    metabolic_factor:
      sleep: 0.7
      meal: 1.0
      work: 1.0
    metabolic_factor_provenance:
      basis: chosen
      reason: >-
        coordinator under John's delegation, 2026-10-17 14:27Z. No Apollo document found gives a
        sleep or intravehicular rate: the CSM handbook gives a daily average, 11,200 Btu per man-day
        (AOH SM2A-03-SC014 p2.7-27, 467 Btu/h), and SP-368 gives EVA rates (200-300 kcal/h).
        Asleep at about 330 Btu/h against about 470 awake is the inference 0.7 rests on. Not
        renormalised: over a day these awake-equivalents run below the planning totals by the
        sleeping hours' 30 %, which is recorded as a known approximation rather than hidden in a
        scale factor. What would close it: the CSM/LM Spacecraft Operational Data Book
        (SNA-8-D-027) consumables tables
    provenance:
      basis: derived
      relation: >-
        the sum over `crew_location` entries in `cabin_stations` of `metabolic_factor` for that
        person's `crew_activity` (`domains/crew/rules.py:csm_metabolic_crew`). Offered to ECLSS
        as the driver of `E-CREW-ATM` in place of `csm_crew_count`: a cabin whose CO2 rise slows at
        bedtime and quickens at wake is one where a better-working absorber and a sleeping crew look
        alike, which is the confounder this state exists to carry. Apollo 11 saw the other
        direction: the LM pilot's exercise raised cabin pCO2 about 0.6 mmHg (MR11 p12-3)
  - id: lm_metabolic_crew
    node: crew_state
    method: algebraic
    unit: crew
    moved_by:
      - "logic:the LM cabin's people, each weighted by the metabolic rate of what they are doing"
    cabin_stations: [lm_commander, lm_pilot]
    metabolic_factor:
      sleep: 0.7
      meal: 1.0
      work: 1.0
    metabolic_factor_provenance:
      basis: derived
      relation: "csm_metabolic_crew.metabolic_factor: one crew, one rate, whichever cabin they breathe"
      source: domains/crew/components.yaml:state.csm_metabolic_crew.metabolic_factor
    provenance:
      basis: derived
      relation: >-
        as `csm_metabolic_crew`, over the LM's two stations (`domains/crew/rules.py:lm_metabolic_crew`);
        the LM's own offer for `E-LM-CREW-ATM`. A person on the surface is on the suit's loop and
        counts in neither cabin
  - id: csm_water_draw_crew
    node: crew_state
    method: algebraic
    unit: crew
    moved_by:
      - "logic:the CSM's people drawing potable water, weighted by when in the day they draw it"
    cabin_stations: [csm_commander, csm_navigator, csm_lower_equipment_bay, tunnel]
    # Crew-equivalents at `E-CREW-WATER`'s planning rate (2.27 kg per crew-day / 24 h): half of a
    # person's day of water in the three one-hour meals, the other half over the waking hours
    # outside them, none asleep.
    draw_weight:
      sleep: 0.0
      meal: 4.0
      work: 0.9863
    draw_weight_provenance:
      basis: chosen
      reason: >-
        coordinator under John's delegation, 2026-10-17 14:27Z: half of each person's daily water in
        the three meal hours, the rest across waking work hours, nothing asleep. What is sourced:
        the food preparation unit meters 1-oz aliquots (AOH SM2A-03-BLOCK II p2.12-78), hot water
        recovers at about 10 oz per 30 minutes (p2.7-16), beverages are 8-oz servings (TN D-7720
        p17), Apollo 17 crews drank 2.1-2.7 L a day (SP-368 p297), and meals were 1 h and
        simultaneous (FP11 p1-13). No per-meal rehydration volume was found. The weights follow:
        a meal hour carries half the day over three hours, 0.5 x 24 / 3 = 4.0; a waking hour
        carries the other half over the TLC flight plan's mean 12.167 waking non-meal hours a day
        (24 - 3 - 8.833 h of rest), 0.5 x 24 / 12.167 = 0.9863. The test file re-derives both from
        `crew_activity.flight_plan`
    provenance:
      basis: derived
      relation: >-
        the sum over `crew_location` entries in `cabin_stations` of `draw_weight` for that person's
        `crew_activity` (`domains/crew/rules.py:csm_water_draw_crew`), because the potable tank is
        the command module's and a person in the LM drinks the LM's water. It is `E-CREW-WATER`'s
        driver. The potable quantity therefore drops by about 1.1 kg in each meal hour
        for three people and is flat through the night, against a fuel-cell fill that is steady:
        for an hour after every meal, the tank looks the way a leak or a failing fuel cell would
  - id: crew_workload
    node: crew_state
    method: lag
    unit: "enum-level"
    initial: UNCONFIGURED
    initial_note: >-
      the workload level at MET 0. `apollo_diode.md:227` gives the four-level vocabulary and the
      five-minute lag, and no source in the corpus gives a starting level — the mission's clock
      starts at the top of `translunar_coast`, so what the crew are doing then is a property of
      the scenario that nothing declares. What would close it: a crew activity timeline for the
      early coast, or a decision that the index begins at `low`, which is a statement about the
      mission's start rather than a measurement
    tau_s: 300
    provenance:
      basis: apollo
      ref: "apollo_diode.md:227"
      note: >-
        coarse on purpose: low, medium, high, with a five-minute lag. The lag is what makes
        workload a *trend* rather than a reaction — a crew member who has just been asked
        something is not thereby busy, and one who has been busy for an hour is.
  - id: alert_lifecycle
    node: alert_state
    method: discrete
    unit: "map[alert_id,enum[nominal,asserted,active_unacknowledged,acknowledged,clearing,latched,cleared]]"
    moved_by:
      - "logic:the lifecycle the thresholds drive, which is why it is a state and not a channel"
    dwell:
      min_on_s: 1
      min_off_s: 1
    provenance:
      basis: historical
      source: >-
        crew_diode.md's alert lifecycle with suppress, inhibit and shelve as orthogonal overlays,
        adopted at simulator-design.md:544-550. The lifecycle is a *commanded* state machine
        rather than a comparator — acknowledgement moves it and does not clear it, which is the
        distinction the whole C&W design turns on.
  - id: alarm_horn
    node: alert_state
    method: discrete
    unit: "enum[silent,continuous,intermittent]"
    moved_by:
      - "logic:the audible half of the master alarm, driven by the lifecycle"
    dwell:
      min_on_s: 1
      min_off_s: 1
    provenance:
      basis: apollo
      ref: "apollo_diode.md:221-222"
      note: >-
        the audible half of the master alarm. It is modelled because it is the only alert channel
        that reaches a crew member who is not looking at a panel — which is exactly the situation
        the surface_eva position describes.

# --------------------------------------------------------------------------------------
# The display contract. One entry per position; each panel lists the readouts it shows with the
# precision it shows them at, and each position lists what it cannot see.
#
# Cross-checked by the linter against `../../channels.yaml#crew_positions`: every position here
# must exist there and every readout here must be in that position's perceivable list. The two
# artifacts say different things — the channel list says what is perceptible, this one says what
# an instrument in front of a person actually displays — and a disagreement between them is a
# leak in the perception bound.
#
# **Both columns of every readout are held now, and until this round neither was.** The membership
# checks above read `channel` and nothing else, so `displayed_precision` (37 declarations) and
# `units` (30) were compared to nothing — in the block whose own `why` says it is "the third
# argument of the perception function". The rules are the registry's own two fields: a panel may
# round a channel's published `precision` and may not invent resolution, `exact` belongs only to
# the channels the registry itself publishes as `exact`, and a displayed unit must be the
# channel's or one the dimensional map places in the same dimension. Reading them found two units
# the map did not know — `psid` and `% nominal`, each used here and nowhere else the checks
# looked — which is what a column with no reader accumulates.
# --------------------------------------------------------------------------------------
display_contract:
  revision: 1
  supplied_by: authored
  why: >-
    crew_diode.md:42 says display topology was not supplied and remains a configuration item.
    conflict register D-06 records that this is the third argument of the perception function
    and that ask_crew cannot be safely enabled without it.

  positions:
    - id: csm_commander
      panels:
        - id: main_display
          shows:
            - {channel: eclss.cabin_pressure_psia, displayed_precision: 0.1, units: psia}
            - {channel: eclss.cabin_temp_c, displayed_precision: 1, units: degC}
            - {channel: eclss.co2_pp_mmhg, displayed_precision: 1, units: mmHg}
            - {channel: eclss.pp_o2_mmhg, displayed_precision: 1, units: mmHg}
            - {channel: structure.cabin_dp_psi, displayed_precision: 0.1, units: psid}
        - id: electrical_panel
          shows:
            - {channel: power.dc_bus_a_v, displayed_precision: 0.5, units: V}
            - {channel: power.bus_tie_state, displayed_precision: exact}
        - id: caution_warning
          shows:
            - {channel: cw.master_alarm, displayed_precision: exact}
            - {channel: cw.active_lights, displayed_precision: exact}
        - id: suit_loop
          shows:
            - {channel: eclss.suit_loop_flow_cfm, displayed_precision: 1, units: "ft3/min"}
      controls: [controls.switches, controls.breakers, structure.hatch_state]
      cannot_see: [thermal.avionics_plate_c, thermal.comm_amp_c, prop.chamber_pressure_pct,
                   power.load_margin_w, eclss.lm_cabin_pressure_psia]
      human_channels:
        - "a bang, a hiss, a smell, a draught, frost on a panel, a vibration felt through the structure"
      note: >-
        the left seat. The human channels are the coverage no instrument has: `bob` on no
        channel, and a crew member who mentions one has reported something the vehicle cannot.

    - id: csm_navigator
      panels:
        - id: gnc_display
          shows:
            - {channel: gnc.guidance_mode, displayed_precision: exact}
            - {channel: "gnc.attitude_q[0..3]", displayed_precision: 0.001}
            - {channel: gnc.body_rate_xyz_deg_s, displayed_precision: 0.01, units: "deg/s"}
            - {channel: gnc.nav_position_sigma_m, displayed_precision: 100, units: m}
        - id: computer_panel
          shows:
            - {channel: avionics.computer_mode, displayed_precision: exact}
            - {channel: avionics.program_alarm_code, displayed_precision: exact}
        - id: caution_warning
          shows:
            - {channel: cw.master_alarm, displayed_precision: exact}
            - {channel: cw.active_lights, displayed_precision: exact}
      controls: [controls.switches, controls.breakers]
      cannot_see: [eclss.cabin_pressure_psia, thermal.avionics_plate_c,
                   prop.chamber_pressure_pct, power.battery_soc_pct]
      human_channels:
        - "a stellar sighting that does not look right, debris outside the window, a light that flickers"
      note: >-
        the right seat, and the one whose displayed precisions are coarsest relative to their
        channels: `nav_position_sigma_m` publishes at 1 m and the panel shows it in hundreds of
        metres, which is what a three-digit readout does.

    - id: csm_lower_equipment_bay
      panels:
        - id: breaker_panel
          shows:
            - {channel: controls.breakers, displayed_precision: exact}
            - {channel: "power.lcl_[n]_state", displayed_precision: exact}
            - {channel: power.dc_bus_a_v, displayed_precision: 0.5, units: V}
            - {channel: power.dc_bus_b_v, displayed_precision: 0.5, units: V}
      controls: [controls.breakers, controls.switches]
      cannot_see: [gnc.guidance_mode, eclss.co2_pp_mmhg, thermal.comm_amp_c, comm.snr_db]
      human_channels:
        - "a hot smell from a rack, a relay chattering, a breaker that will not stay in"
      note: >-
        below the floor. A crew member here can act on the electrical system directly and cannot
        see a single display the other two seats are reading, which is the geometry that makes
        two people a different instrument from one.

    - id: lm_commander
      panels:
        - id: landing_display
          shows:
            - {channel: gnc.radar_altitude_m, displayed_precision: 1, units: m}
            - {channel: structure.accel_xyz_g, displayed_precision: 0.01, units: g}
            - {channel: prop.dps_throttle_pct, displayed_precision: 1, units: "%"}
            - {channel: prop.chamber_pressure_pct, displayed_precision: 1, units: "%"}
        - id: lm_environment
          shows:
            - {channel: eclss.lm_cabin_pressure_psia, displayed_precision: 0.1, units: psia}
            - {channel: eclss.lm_co2_pp_mmhg, displayed_precision: 1, units: mmHg}
            - {channel: eclss.lm_pp_o2_mmhg, displayed_precision: 1, units: mmHg}
        - id: caution_warning
          shows:
            - {channel: cw.master_alarm, displayed_precision: exact}
            - {channel: cw.active_lights, displayed_precision: exact}
      controls: [controls.switches, controls.breakers, structure.hatch_state]
      cannot_see: [power.dc_bus_a_v, thermal.comm_amp_c, prop.pressurant_pressure_psi,
                   eclss.cabin_pressure_psia]
      human_channels:
        - "the view out of the window, which is the landing radar's only cross-check, and dust"
      note: >-
        the commander's position during a descent. Apollo 11's commander flew the final approach
        by hand with the radar and the throttle in front of him, and the not-perceivable list is
        the important half: the CSM's cabin pressure is another vehicle's.

    - id: lm_pilot
      panels:
        - id: systems_display
          shows:
            - {channel: avionics.exec_margin_pct, displayed_precision: 1, units: "%"}
            - {channel: avionics.program_alarm_code, displayed_precision: exact}
            - {channel: gnc.nav_position_sigma_m, displayed_precision: 100, units: m}
            - {channel: gnc.radar_range_rate_m_s, displayed_precision: 0.1, units: "m/s"}
        - id: caution_warning
          shows:
            - {channel: cw.master_alarm, displayed_precision: exact}
            - {channel: cw.active_lights, displayed_precision: exact}
      controls: [controls.switches]
      cannot_see: [structure.accel_xyz_g, prop.dps_throttle_pct, power.dc_bus_a_v, comm.snr_db]
      human_channels:
        - "a callout from the commander, a gauge that disagrees with the number he just read"
      note: >-
        systems and navigation, callouts to the commander, and no access to the flight controls.
        `apollo_diode.md:1044` is explicit that the pilot kept the commander informed about
        systems status and navigational information, which makes this position a *reporter*
        rather than an actor — and a reporter is what a question can address.

    - id: tunnel
      panels: []
      controls: [structure.hatch_state, structure.docking_latches]
      cannot_see: [thermal.coolant_supply_c, power.battery_soc_pct, eclss.co2_pp_mmhg]
      human_channels:
        - "whether the tunnel is pressurised, which is felt rather than read; a leak you can hear"
      note: >-
        a transit position with no panels at all. Nothing is readable here that is not a discrete,
        so a crew member in the tunnel is a sensor with almost no coverage exactly when they are
        between two vehicles — and the felt sense of pressure is the exception, which is why this
        position's human channels matter more than its instruments.

    - id: surface_eva
      panels: []
      controls: []
      cannot_see: [eclss.lm_cabin_pressure_psia, thermal.coolant_supply_c,
                   prop.chamber_pressure_pct, comm.snr_db]
      human_channels:
        - "everything. A suit has a flow indicator and an alarm light and nothing else, so every other observation is a person's"
      note: >-
        outside, on a suit, with no displays. The suit's own flow and the alarm light are the
        entire instrumentation, and everything else the crew member reports is a human
        observation — the coverage that no channel on this vehicle provides and the reason
        `apollo_diode.md:369` calls the crew the most interesting sensor aboard.

  # --------------------------------------------------------------------------------------
  # Crew wrongness. `review-findings.md` #4 asks whether it is seeded or model whim and notes
  # that for experimental control it should be a **seeded perturbation of the perceivable
  # subset**. This is that decision, made.
  # --------------------------------------------------------------------------------------
  wrongness:
    model: "seeded perturbation of the perceivable subset, applied before the GM composes"
    kinds:
      - id: misheard
        seedable: true
        weight: 0.4445
        mechanism: "a number transposed or a decimal shifted: 850 becomes 580"
        provenance_note: "the most common error a person makes reading a gauge aloud"
      - id: misattributed
        seedable: true
        weight: 0.3333
        mechanism: "the right observation attached to the wrong source: frost reported on the wrong panel"
      - id: forgot
        seedable: true
        weight: 0.2222
        mechanism: "an observation that was made and not mentioned until asked, or not at all"
      - id: wrong_module
        seedable: false
        mechanism: "a report that belongs to another position's instruments, which is a *perception-bound violation* and must be impossible by construction"
    seeded: true
    note: >-
      The four modes are the source's, and **the weights are chosen**. `wrong_module` carries no
      weight because this vehicle cannot produce it — the perceivable subset is computed before the
      GM composes, so a report about an instrument the position does not have is unreachable, and a
      share of a distribution spent on an unreachable outcome is a share nothing can ever draw.
      Until this round it carried 0.1, and that 0.1 was what made the four sum to one: the three
      modes that *can* fire summed to 0.9, so the model as declared was not a distribution over
      anything. The three are 4:3:2 — the corpus's own 0.4/0.3/0.2, renormalised — given here as
      4/9, 3/9 and 2/9 to four places, with the largest taking the rounding so that the three make
      exactly 1.0 rather than 0.9999.
    provenance:
      basis: historical
      source: >-
        simulator-design.md:362-371 — the crew-as-instrument table, whose "Failure mode" row reads
        "forgot, misheard, misattributed, wrong module" against the instrument's "noise, bias,
        saturation, dropout", and the paragraph under it that makes the crew the only sensor able
        to report an unanticipated observation
      note: >-
        This cited `crew_diode.md` until this round, which carries none of the four names: the
        citation named the wrong document, and no tool could have noticed, because whether a source
        says a thing is not a fact a linter can look up. The weights are in neither document — the
        design lists the four modes and says nothing about how often each occurs — which is why they
        are `chosen` rather than taken

  # --------------------------------------------------------------------------------------
  # Decision outputs. Adopted at simulator-design.md:556, and the file's claim that the design
  # lists three of four is correct: the enum's first value is the one that keeps an ordinary
  # state from reading as an advisory.
  # --------------------------------------------------------------------------------------
  decision_outputs:
    values: [NONE, ADVISORY_ONLY, CREW_ACTION_REQUIRED, REQUEST_SAFE_ACTION]
    authority: >-
      advisory only. crew_diode.md:470-474 is explicit that the caution/warning system never
      actuates; it directs investigation and requests, and every physical effect still crosses
      the diode as a command from an agent.
    provenance:
      basis: historical
      source: "crew_diode.md:39, :470-474"

# --------------------------------------------------------------------------------------
# The C&W overlays. Orthogonal to acknowledgement, never crossing semantics with it.
# --------------------------------------------------------------------------------------
alert_overlays:
  overlays:
    - {id: suppress, scope: "one alert, bounded time", clears_on: "expiry or the condition persisting", provenance_note: "crew_diode.md:393-445"}
    - {id: inhibit, scope: "a class of alerts, bounded by a declared condition"}
    - {id: shelve, scope: "one alert until its condition clears and re-asserts"}
  never:
    - "an overlay may not clear a safety-relevant alert"
    - "acknowledgement is not a clear predicate: stale, missing or invalid evidence never satisfies one (crew_diode.md:433)"
    - "an overlay may not be applied by anyone but the crew or the service; an agent's command cannot silence an alarm"

open_debts:
  - "**The breaker the command names is a class, not an element.** `set_breaker`'s `breaker` argument offers `csm_tie_ab` and `lcl`, and `breaker_panel` is keyed by `breaker_id`. So `key: breaker` says which *argument* selects the element and not which element it is: `lcl` is every current-limiting load switch on the vehicle, and the command is declared against the key as though it named one. What is owed is the LCL set — the ids behind `lcl` — which is the same list `power.lcl_[n]_state` is templated over and which nothing joins to this verb."
  - "**The crew count is a state now, and two of the three couplings that need it still read the node.** `E-CREW-ATM`, `E-LM-CREW-ATM` and `E-CREW-WATER` declare `kg/h per crew`, and a coupling edge reads a **value**: `crew_state` carries several states, so it publishes none, and the two cabin CO2 stocks and the potable-water tank were blocked on every tick. Of the two repairs round 65 named, this domain took the one that is a domain edit: `csm_crew_count` and `lm_crew_count` are quantities on `crew_state`, projections of `crew_location`, and an edge names the one it means with `reads:` (the field the plant has had since round 70). `E-CREW-WATER` lands on this node, so it is this domain's and reads `csm_water_draw_crew`. **What is owed is the other two edges' one line each**: `E-CREW-ATM` `reads: csm_crew_count` and `E-LM-CREW-ATM` `reads: lm_crew_count`. Those edges land on the cabins, so they are ECLSS's to write, and a tick with both lines added advances both CO2 stocks."
  - "**The display mode has no state.** `set_display_mode` changes what a station's panel is showing — the four modes are `crew_diode.md:352-370`'s widget types, and its own provenance says implementing them as a *display* command rather than as a perception change is the point D-06 turns on — and the vehicle records that nowhere. It was linked to `switch_panel`, which is the crew's switches: a surface whose own note here and whose channel's note in `points.yaml` both say agents observe it and cannot move it, and whose key was a switch id while the verb's `position` argument takes crew stations. That link is what this round removed. What closes this is a state per station holding one of the four modes, on a node the executive reaches — a new state and a new coupling node rather than a value, which is why it is here and not in a field."
  - "The displayed precisions are authored. They are the *inverse* of the channel registry's published precisions — a panel is coarser than the instrument behind it — and the mapping from one to the other is a display-design choice with no source. What is not a choice is that they must be coarser: a crew member reading a digital channel exactly would be a better instrument than the sensor."
  - "Reading times are not modelled. A real crew member takes seconds to find and read a gauge, and `ask_crew` currently answers instantly — which understates the cost of the crew as a sensor. It belongs with the allowance machinery rather than here. What *is* modelled is the larger cost: a question at night wakes the person it names, and the rest they lose is repaid as sleep at the start of the next working day (`crew_roused`, `crew_rest_owed_s`)."
  - "**The perception function has no caller.** `tools/crew_perception.py:perceive` is `(frame, crew_id, location, availability, display_contract, seed, ask_index) -> perceived + audit`, the lookup this file's header asks for, and nothing calls it: answering an `ask_crew` is the executive's and the console's (`tools/console.py`), which is engine code another lane owns. Per console (D-07): the answer goes to the asking console alone, and each crew member's count of exchanges is the vehicle's record of the conversation."

# Found by asking whether a fleet can pursue each of `mission.yaml`'s outcome objectives, which is
# a question no check in this folder had asked. Two of the three have a clear verb path —
# `crew_survive` through the six ECLSS verbs, `return` through the three propulsion ones — and the
# third looked at first like it had none at all. It does: `set_hatch_valve` is available in all
# eight phases, and `domains/structure/components.yaml#one_way_events` carries
# `hatch_open_surface` with its consequence spelled out ("the LM cabin's atmosphere is lost to
# vacuum unless the crew are on suit loop; the cost is an atmosphere per opening") and its three
# observables. So the *hardware* half of an EVA is declared, and `apollo_diode.md:238` fixes the
# vocabulary — Apollo has no EVA verb, because depressurisation is `set_vent_valve` and the suit
# circuit is `set_suit_loop`.
#
# What is not declared is the crew half. `crew_location` can take `surface_eva` and
# `crew_availability` can take `suit`, and nothing says what puts a crew member there: no verb
# writes `crew_location` — the four crew verbs are `ack_alarm`, `ask_crew`, `set_alert_overlay`
# and `set_display_mode`, none of which moves anybody — and no file records the rule. The objective
# is scorable only because a crew-domain state machine that is not written down happens to move
# them. The rule has a shape, and stating it here is what keeps whatever writes it from inventing
# one: egress is gated on the phase being `surface`, the hatch being open and the suit loop
# running; ingress is gated on the hatch closing; the 30-second dwell on the state is already the
# transit time; and `apollo_diode.md:754` bounds the whole thing — crew physiology is "preferably
# omitted", so the rule may not grow a model of a person.
  - "**What moves the crew is declared now, and three of the egress rule's gates are not reachable from it.** `crew_location` is a rule (`domains/crew/rules.py`): a person is where `ask_crew` last sent them while the station is reachable in `structure.configuration`, and in their own seat in the vehicle the configuration puts them in otherwise. The shape the earlier debt fixed — egress gated on the phase being `surface`, the hatch open and the suit loop running; ingress on the hatch closing — is only half reachable: a rule reads its snapshot, and the phase is in no state, while `hatch_state` and `suit_loop_flow_cfm` are on the structure and ECLSS sentinels, which no other domain's rule can read. So `surface_eva` is reachable from the LM whenever it is `undocked`, in orbit as well as on the surface, and the hatch and the suit are the structure and ECLSS lanes' to enforce on their own side. What closes it: the hatch position and the suit-loop flow on coupling nodes the crew can declare in `reads:`, and the mission phase as a state."
  - "**The surface has no flight plan rows.** `crew_scheduled.flight_plan` carries the Apollo 11 plan's translunar, lunar-orbit and transearth eat and rest periods; the plan's surface stay has \"two 4 to 5 hour sleep periods while the LM is on the lunar surface\" (FP11 printed p1-13), and their GETs, and the CM pilot's matching rest in orbit (MR11: \"timed to coincide with that of the lunar module crew so that radio silence could be observed\"), are not extracted. Until they are, the crew work through the descent, the surface and the ascent. What closes it: the FP11 detailed timeline pages for GET ~100-130, anchored to `descent`, `surface` and `ascent_rendezvous`."
  - "**CRW-01 has no onset, because its onset names a person.** `crew_availability` holds `incapacitated` once written and its rule never writes it, so the fault is the only way there; an onset row with `becomes: incapacitated` needs a `key`, and which crew member a scenario incapacitates is the scenario's choice. What closes it: an onset row per crew id (three faults, or a fault the scheduler parameterises by person)."
  - "**`crew_workload` has no driver.** It is a `lag` in an `enum-level` and nothing drives it: `E-CREW-WATER` did, by declaring no `advances`, which made a drink of water the workload's input. The activity is the obvious input (rest low, a meal or work medium, the surface high) and no source states the mapping or the starting level; and a lag is the plant's integrator, so an activity-driven workload is either an edge from a quantity or a rule on a different class. Owed as a design choice; it adds the separation between a busy crew member and an incapacitated one that CRW-01's own `false_positive_risk` asks for."
  - "Crew physiology is out of scope by design (`apollo_diode.md:754`: metabolic rates are an input, not a model of a person). `incapacitated` is therefore a state with a cause the vehicle does not model."
