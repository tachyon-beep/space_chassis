# domains/power/components.yaml — what the electrical system is made of, and what the
# scheduler needs to know to advance it.
#
# The design's build order (simulator-design.md:113) is "dictionary + linter, then a spike on
# electrical → thermal → consumables". This is the first domain. It is deliberately the
# hardest one to get wrong and the easiest to check: the topology is simple, the physics is
# algebraic except for one stock and two lags, and `electrical_diode.md` supplies a
# load-shed ladder that had to be **re-anchored** before it could be used (conflict
# register C-01 — its tiers sit up to 2 V below the point apollo calls an event).
#
# The vehicle has two separate electrical systems, and the separation is the point. The CSM
# runs on three fuel cells fed from the cryogenic O2 inventory; the LM runs on batteries
# alone and its power is a countdown rather than a budget. That is what makes the Apollo-13
# reconfiguration — move the load to the LM — a resource decision rather than a mode change,
# and it is why `lm_bus` and `csm_bus` do not share a bus tie.

domain: power
natural_rate_hz: 50

# Reads and writes are node ids from coupling.yaml. Domains do not call each other
# (plant.md §2); these declarations are what the scheduler orders.
#
# Three reads were missing until the edge list was read against this line, and each is a dependency
# the graph had and the declaration denied: `coldplate_t`, which `E-PLATE-BAT` derates the battery's
# usable capacity by; `link`, which `E-AMP-LOAD` puts on `bus_a` at 1/28 A per W; and
# `command_executive`, which `E-CMD-BUS` drives the load-shed ladder with. All three are *inputs*,
# which is why they belong here rather than in `writes` — the nodes they land on are power's.
reads: [o2_csm, h2_csm, coldplate_t, link, command_executive]
writes: [fuel_cell, source_converter, bus_a, bus_b, battery_energy, bus_tie, load_shed_state,
         fc_o2_draw, fc_h2_draw, battery_usable_j]

# --------------------------------------------------------------------------------------
# State. Each entry names its integrator class from plant.md §3, and the class decides what
# parameters are owed. The linter refuses a `lag` with no time constant, a `stock` with no
# quantum, and a latched `discrete` with no hysteresis.
# --------------------------------------------------------------------------------------
# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [source_enabled, lcl_tripped, battery_thermal_state]
internal_order_note: >-
  the source switches come first because `set_source` writes them before the tick and nothing on the
  sentinel reads them; the trip state is a latch, and the battery's temperature is what the surviving load does to the
  pack — the same chain the power inventory's relationships describe, in the order they act. The
  load between them, `bus_a_load_w`, left the sentinel for the `fuel_cell` node, where the bus solve
  can read it in the same tick.

state:
  - id: fuel_cell_power_w
    method: algebraic
    node: fuel_cell
    unit: W
    # The field the arithmetic produces, named by the state's own id. 1,723 W is the reference
    # operating point the linter re-derives against: every CSM load on and the transmitter on, which
    # is `load_budget.csm_total_demand_w` split across the two buses.
    fuel_cell_power_w: 1723
    note: >-
      What the three modules deliver to the two main buses this tick: the two bus loads, summed. At
      steady state the output is the load, so a load `set_load` turns off leaves this state in the
      same tick. The margin a crew watches is the capacity headroom, three 1,420 W modules against
      this figure, which is what `power.load_margin_w` means. The reactant draw is charged per
      ampere of module current (`fuel_cell_current_a`), not per watt of this figure (ADR 0003 item 3)
    provenance:
      basis: derived
      computes: fuel_cell_power_w
      derivation:
        expression: bus_a_load + bus_b_load
        inputs:
          bus_a_load: bus_a_load_w
          bus_b_load: bus_b_load_w
      relation: >-
        the cells generate what the buses draw, so this is the two bus loads read as one generation.
        Until the quiet-coast power rules it summed the fourteen `demand_w` declarations directly, a
        constant: now each bus sums the loads its switches leave connected (`domains/power/rules.py`)
        and this state adds the two, so the electricity follows the switches. The node's
        `state_order` puts both bus loads before it

  - id: source_converter_v
    method: lag
    node: source_converter
    unit: V
    initial: 29
    initial_source: vehicle.yaml:electrical.fuel_cells.output_v
    initial_provenance:
      basis: derived
      relation: >-
        the converter starts at the cells' declared output voltage, 29 V — the three modules are
        activated before launch and rated at 29 +- 2 V each, so the bus is up before the mission
        clock starts and the converter regulates around what they are already making
    tau_s: UNCONFIGURED
    evidence_question: >-
      WP02 E-5 (docs/evidence/wp02-electrical.md). **The Apollo CSM has no source converter to
      take a time constant from**: the fuel cells connect to the main buses through motor switches
      and their terminal voltage falls with load (AOH SM2A-03-Block II-(1) pp. 2.6-2, 2.6-25,
      2.6-38). The only figure in reach is electrical_diode.md:248's reference-design target,
      "regulation transient <10 ms", which is a settling bound for hardware the vehicle does not
      carry and is under one 20 ms tick. Owed to the operator as a model decision, not a value:
      (a) replace this lag with the algebraic terminal relation V = E0 - R I on `fc_[n]` (E0
      32.30 V, R 0.1008 ohm, both derived), or (b) keep a converter and take its tau from a
      source for a converter. The slow effect Apollo does describe -- voltage recovering as the
      stack's skin temperature follows the load (p. 2.6-25) -- has no published time constant
    note: >-
      Converter regulation lags its setpoint. electrical_diode.md:248 gives a 1.2 kW
      converter with a >=94 % efficiency but no time constant — and its 24-32 V envelope is
      re-anchored to apollo's 27.0-30.5 V band (C-01), so the parameter is owed rather than
      inherited. **Off the episode path** (ADR 0003 item 1, option (a) above): `bus_a_v` and
      `bus_b_v` solve the modules' terminal relation directly, and no edge from `source_converter`
      reaches a bus or anything else, so the owed `tau_s` blocks nothing the quiet-coast episode
      needs. The state stays declared, and stays owed, rather than being deleted or given a tau:
      `tests/test_power_rules.py` holds that nothing reads it, so a reader added later has to
      answer this question first.
    provenance:
      basis: chosen
      reason: "a regulated converter is a first-order lag by construction; electrical_diode.md:248 gives its rating and efficiency but no time constant, so the class is chosen and the parameter is owed"

  - id: bus_a_v
    method: algebraic
    node: bus_a
    unit: V
    # The rule's parameters (`domains/power/rules.py`, `bus_a_v`). Main bus A is fed by fuel cells
    # 1 and 2 in parallel; the per-module terminal relation is `components.fc_[n]`'s, copied here
    # because a rule reads only its own state's declaration, and held to those components by
    # `tests/test_power_rules.py`.
    # The modules that can feed this bus; the solve uses the ones `source_enabled` leaves on.
    cells: [fc_1, fc_2]
    cell_open_circuit_v: 32.30
    cell_resistance_ohm: 0.1008
    cell_current_envelope_a: [12.903, 52.593]
    solve_provenance:
      basis: derived
      relation: >-
        no source converter (ADR 0003 item 1; AOH SM2A-03-Block II-(1) pp. 2.6-2, 2.6-25): the bus is
        the terminals of the modules feeding it. Per module V = E0 - R i with E0 32.30 V and R
        0.1008 ohm, `components.fc_1.open_circuit_intercept_v` and `source_resistance_ohm` (derived,
        WP02 E-2, the secant of the AOH p. 2.6-2 envelope). Two modules in parallel share the bus
        current, so V = E0 - (R/n) I for the n of them connected, and the rule solves P = V I for I at the bus load: the smaller
        root of (R/2) I^2 - E0 I + P = 0. The envelope is that secant's own range, 400 W / 31 V =
        12.903 A to 1,420 W / 27 V = 52.593 A per module; outside it the relation is an
        extrapolation and the rule returns no value, as it does for a load beyond E0^2 / (4 R/2)
      routing: >-
        fuel cells 1 and 2 on main bus A: `components.fc_[1-2].normal_bus` (TN D-7609 p. 5; Apollo 15
        Mission Report 6.2)
    note: >-
      The nodal solve. Bus voltage is a function of source EMF, source internal resistance and total
      load; there is no bus capacitance to integrate, and that choice is load-bearing:
      review-findings.md #5 makes the whole 50 Hz verdict conditional on the electrical network being
      algebraic. If this becomes an ODE with real capacitance the verdict inverts and the requirement
      becomes 1-10 kHz. **What the solve does not include**: the bus tie (normally open in coast,
      `bus_tie_closed` initial `open`), the batteries (off the main buses in coast, TN D-7609; A10C)
      and the feeder and motor-switch drop between the terminals and the bus, which WP02 E-2 bounds
      at 0-1.0 V against flown bus voltages. A tie closure or a battery on the bus is not modelled by
      this rule
    provenance:
      basis: chosen
      reason: "review-findings.md #5 makes the entire 50 Hz verdict conditional on the electrical network being algebraic rather than an ODE with bus capacitance; recording that here means a later change to this line has to argue with the review"

  - id: bus_b_v
    method: algebraic
    node: bus_b
    unit: V
    cells: [fc_3]
    cell_open_circuit_v: 32.30
    cell_resistance_ohm: 0.1008
    cell_current_envelope_a: [12.903, 52.593]
    solve_provenance:
      basis: derived
      relation: "as `bus_a_v`, with one module: fuel cell 3 alone, so V = E0 - R I"
      routing: >-
        fuel cell 3 on main bus B: `components.fc_3.normal_bus` (TN D-7609 p. 5; Apollo 15 Mission
        Report 6.2)
    note: >-
      second bus, the same nodal solve over its own source and load set. Its source set was the part
      the graph did not have (`E-FC-BUSB` closed that); its load set is `bus_b_load_w`. The battery
      half the corpus describes (`BAT_B <-> BAT_CONV_B <-> BUS_B`) is still not modelled, and in
      translunar coast the batteries are off the main buses, so the solve does not need it
    provenance:
      basis: chosen
      reason: "as bus_a_v: the second bus is the same nodal solve over a different source and load set"

  - id: battery_usable_j_j
    node: battery_usable_j
    method: algebraic
    unit: J
    derate_curve: UNCONFIGURED
    evidence_question: >-
      WP02 E-6. What fraction of the CSM entry batteries' 40 Ah is deliverable as a function of
      pack temperature? Searched: AOH section 2.6, the J-mission EPS handout, TN D-6976 (battery
      experience report; its entry-battery curves, figs. 4-6, are graphical and not about
      temperature) and the Apollo 10 consumables analysis. What is published is a rated
      *minimum* of 40 Ah over a 50-110 F qualified ambient, planned as 40 Ah in flight and 45 Ah
      postlanding -- a flat floor inside the qualification, and nothing outside it, which is the
      region the crisis value of E-PLATE-BAT is about. Next source: the CSM/LM Operational Data
      Book volume I EPS battery pages (not text-extractable from here)
    provenance:
      basis: UNCONFIGURED
      note: >-
        usable energy is the stored charge times a derating that falls with temperature, and **no
        source publishes the curve**: `electrical_diode.md:341` names the effect — "radiator
        isolation / poor attitude raises battery temperature and derates usable capacity" — and gives
        no numbers. **Searched:** `ApolloTrainingElectricalPowerSystemStudyGuide.pdf` end to end for
        a capacity-versus-temperature curve — it publishes the battery capacities, the 40 Ah entry
        cells and the LM's 400/296 Ah, and no derating table — and ODB Vol III, whose electrical
        sections are loading requirements rather than performance. So the shape is declared and the
        scalar is owed, rather than a plausible capacity-fade curve being invented for a vehicle
        whose batteries are Apollo's
  - id: fc_o2_draw_kg_s
    node: fc_o2_draw
    method: algebraic
    unit: kg O2/s
    # At the reference operating point (every CSM load on, transmitter on): 56.686 A of module
    # current, `fuel_cell_current_a`'s own field, times 2.56996e-6 kg/s per ampere.
    draw_kg_s: 0.000145681
    provenance:
      basis: derived
      computes: draw_kg_s
      derivation:
        expression: current_a * per_amp_kg_s
        inputs:
          current_a: fuel_cell_current_a
          per_amp_kg_s: coupling.yaml:edges.E-FC-DRAW-O2.sensitivity.value
      relation: >-
        the cells' oxygen draw is what an ampere of module current costs times the current the three
        modules are carrying, and the cost is `E-FC-DRAW-O2`'s own figure: one home for 2.56996e-6
        kg O2/s per ampere, which is the J-mission EPS handout's table (p. 2.6-21, 2.04e-2 lb/h per
        ampere per fuel cell) reached through the hydrogen rate and the reaction's mass ratio. **Per
        ampere, not per watt** (ADR 0003 item 3): the table is per ampere, and charging per watt at a
        fixed 29 V undercounts by 7 % at a 27 V terminal and overcounts by 5 % at the 30.4 V the
        coast bus solves to. The current is a reading of `fuel_cell_current_a`, which the schedule
        reaches first (node `fuel_cell`), so the draw is this tick's operating point
      note: >-
        **the field this state computed was a coefficient wearing a rate's unit** until round 69: the
        unit said `kg O2/s` and the arithmetic produced kilograms per joule. The tank's discharge edge
        (`E-O2-DRAW`, `kg O2 per kg O2`) reads this node as the rate it drains at, so a coefficient
        here is a plausible number one multiplication away from being used as a flow
  - id: fc_h2_draw_kg_s
    node: fc_h2_draw
    method: algebraic
    unit: kg H2/s
    draw_kg_s: 1.83558e-05
    provenance:
      basis: derived
      computes: draw_kg_s
      derivation:
        expression: current_a * per_amp_kg_s
        inputs:
          current_a: fuel_cell_current_a
          per_amp_kg_s: coupling.yaml:edges.E-FC-DRAW-H2.sensitivity.value
      relation: >-
        as the oxygen draw: the module current times what an ampere costs in hydrogen, and that cost
        is `E-FC-DRAW-H2`'s own figure -- the published 2.57e-3 lb/h per ampere (J-mission EPS
        handout p. 2.6-21; Mission E consumables analysis) -- so the hydrogen draw is the oxygen draw
        times 0.126 *by construction* rather than by a second arithmetic that could drift from it
      note: >-
        **and this one computed a mass ratio**, 0.126 kg H2 per kg O2, under a unit of `kg H2/s`,
        until round 69. The two reactant states were one defect in two spellings, which is why the
        fix is one relation in two places rather than two

  - id: battery_charge_j
    method: stock
    node: battery_energy
    unit: J
    # The charge was owed for as long as this state has existed, and the figure was published,
    # declared and *already checked* the whole time. `load_budget.csm_battery_energy_wh` is 3,360
    # Wh — three 40 Ah entry batteries at 28 V, held by `check_power_inventory` against the cells'
    # own `ah x v_nominal` — and this state integrates joules, so the initial is that figure times
    # 3,600. The path names the group, which is what the old note said was missing: "which group
    # presents to it is `domain_group`'s question", and the answer is the CSM's, because the one
    # node's edge runs to `bus_a`.
    initial: 12096000
    initial_source: "domains/power/components.yaml:load_budget.csm_battery_energy_wh"
    initial_factor: 3600
    # **A joule was too coarse and nothing could see it until the smallest flow was derived.**
    # The rule is `plant.md` §4's: the quantum is the dead zone, so it must sit below the smallest
    # flow the stock sees over one tick. At 50 Hz and the smallest load on this bus, that flow is
    # 36 W x 0.02 s = 0.72 J, and a 1 J quantum swallowed the S-band transceiver whole — the
    # linter refused it the moment `min_flow_per_s` stopped being a debt. A tenth of a joule is
    # seven times finer than the smallest flow and still coarse enough to keep the fixed point
    # cheap.
    quantum: 0.1
    min_flow_per_s: 36.0
    min_flow_derivation:
      expression: "smallest_load_w"
      inputs:
        smallest_load_w: domains/power/components.yaml:loads.csm_sband_transceiver.demand_w
    min_flow_note: >-
      **the smallest flow this stock must represent, and it is the smallest load the battery
      feeds.** The node's one edge runs to `bus_a`, and the smallest load on that bus is the S-band
      transceiver at **36 W = 36 J/s** — the coarsest flow the dead zone may swallow whole. A
      `min_flow_per_s` larger than any real flow would absorb that load and the stock would never
      see it; one far smaller buys fixed-point iterations for nothing. The relation is the load
      budget's own `demand_w` field — **which the old note called `rated_w`**, a field this domain
      has on its *sources* and on no load at all, so a reader following that sentence would have
      gone looking for a key that does not exist.
    note: >-
      The one conserved quantity in the domain, and the reason the LM is a countdown. The quantum is
      1 J, which is far below any real battery flow, so the dead zone is not a risk here — and
      `min_flow_per_s` is now derived from the smallest load rather than owed.
    provenance:
      basis: historical
      source: "the capacities are published (NR, PSR: 40 Ah entry batteries, 400 Ah LM descent, 296 Ah LM ascent); that the charge is a conserved stock rather than a voltage-dependent model is chosen, because a first-order relaxation model would need parameters no source gives"

  - id: battery_thermal_state
    node: internal
    method: lag
    unit: degC
    initial: UNCONFIGURED
    evidence_question: >-
      WP02 E-7. The CSM entry batteries are passively cooled in the CM ("active thermal control
      was not required because of the mild thermal environment of the CM cabin", TN D-6976
      p. 5) and qualified for 50-110 F ambient (AOH p. 2.6-17), which bounds the initial at
      10-43.3 C and gives no value: no CSM battery temperature telemetry or pack thermal mass was
      found. Both the initial and tau_s need the pack's mass, specific heat and mounting
      conductance, which is WP02's thermal-aggregation question, not an electrical one
    initial_note: >-
      the pack's temperature at MET 0, owed with its time constant and for the same reason:
      `thermal_diode.md:965` declares every thermal constant unspecified, this state's `tau_s`
      is UNCONFIGURED because of it, and where the pack starts is the same analysis. It matters
      more here than for a zone: `battery_overtemp` and `battery_thermal_runaway_rate` are two
      thresholds judged against this channel, so a guessed starting temperature is a guessed
      margin on a runaway
    tau_s: UNCONFIGURED
    provenance:
      basis: apollo
      ref: "apollo_diode.md:104"
      note: >-
        the battery's temperature, and the state this domain was publishing without: the linter's
        `from` check found `power.battery_temp_c` naming a state that exists nowhere, while
        `battery_overtemp` and `battery_thermal_runaway_rate` — two thresholds — watch that
        channel. A threshold on a channel with no producer is the same defect as an alarm with no
        threshold, arriving from the other side. A lag because a battery is a lumped thermal mass,
        and the time constant is owed: `thermal_diode.md:965` declares every thermal constant
        unspecified, and a battery pack's is no exception

  - id: bus_tie_closed
    method: discrete
    node: bus_tie
    unit: "enum[open,closed,tripped]"
    initial: open
    initial_provenance:
      basis: historical
      source: mission.yaml:launch_state
      note: >-
        the Apollo 17 launch checklist turns both main bus ties OFF on p. 33 and verifies them OFF
        on p. 36, before TLI and extraction. The pad configuration on pp. 11 and 22 had them ON;
        carrying that earlier position into this post-extraction initial state was a temporal
        error. The synthetic model starts with the tie `open`; any later closure requires a command
    moved_by:
      - "command:set_bus_tie"
    command_value:
      - verb: set_bus_tie
        argument: state
        maps:
          auto: UNCONFIGURED
        evidence_question: >-
          WP02 E-8. Apollo's MAIN BUS TIE switches (BAT A/C, BAT B/C) tie the *batteries* to the
          main buses through motor switches S1 and S2 (AOH p. 2.6-3/4, Fig. 2.6-1 note; J-mission
          handout p. 2.6-3); section 2.6 describes no direct main-bus-A-to-B tie at all. So this
          A-B tie and its `auto` have no Apollo article to take a mapping from, and the AUTO
          position the real switch has is not described in any text reached. A model decision for
          the operator: keep the A-B tie as the corpus's reference-design `TIE_AB`
          (electrical_diode.md:252) and say what `auto` means, or re-model the tie as Apollo's
          battery-to-main-bus tie
        why: >-
          `open` and `closed` are the identity. `auto` is not a position at all: it hands the
          decision to the service, "which closes only when the two buses are within 1 V and no
          ground fault is active" (`set_bus_tie`'s help), so it names no value this state can hold
        note: >-
          the tie's control *mode* has nowhere to live. `auto` is a delegation the service acts on
          and nothing records, so a vehicle told to work the tie automatically cannot say that it
          was. What would hold it is a mode beside the position — and the position itself is then
          set by the service through `E-BUSB-TIE`, which is the one edge into this node that is not
          the executive's
    dwell: {min_on_s: 0.2, min_off_s: 0.2}
    note: >-
      The tie may close only when the two buses are within 1 V, and it latches open on a ground
      fault. Closing a tie into a fault couples the healthy bus to the failed one
      (apollo_diode.md:340). This was a `bool` with a numeric comparator, and the state's own
      provenance note said why that could not work: apollo publishes open/closed/tripped and
      makes an unintended trip an *event*, which is only meaningful if the position is latched —
      and a boolean has no third value to latch into. The vehicle could trip its tie and had no
      way to say so, which is the same fault as a regulator position it cannot report, arriving
      through a type rather than a vocabulary. The 1 V interlock is not restated here: it is
      `power.tie_dv_limit`, a declared threshold on `power.dc_bus_a_v`, and a state that
      re-implemented it would be a second source of truth for one limit
    provenance:
      basis: apollo
      ref: "apollo_diode.md:79"
      note: "apollo publishes bus_tie_state as open/closed/tripped and makes an unintended trip an event, which is only meaningful if the position is latched rather than compared"

  - id: lcl_tripped
    method: discrete
    node: internal
    unit: "map[load_id,enum[closed,tripped,retrying,latched]]"
    moved_by:
      - "trigger:set_breaker"
      - "logic:the protection trips it and reports it on power.lcl_[n]_state; one controlled reclose, then latch"
    hysteresis: {assert: 1.25, clear: 1.05, dwell_ms: 500}
    band_on: power.lcl_[n]_current_a
    band_units: "fraction of the rating rather than amperes"
    band_value: {assert: tripped, clear: closed}
    note: >-
      One controlled reclose and then latch (electrical_diode.md:254, :888-901). The
      reclose-then-latch shape is the whole reason this is a latched discrete with hysteresis
      rather than a comparison: a load that trips on a transient must come back, and one that
      trips twice inside the recovery dwell must not. Its band is the same band as
      `lcl_overcurrent` in profiles.yaml — 125 % and 105 % — carried as a fraction of the load's
      rating instead of in amperes, which is what `band_units` declares: the two numbers are the
      same decision in two units, so the check that holds them together is their ratio (1.190,
      the same as 313 A / 263 A) rather than their values. Declaring the band in amperes here
      would be a second source of truth for a limit the threshold already owns, and it is the
      reason the assert is a multiple rather than 313. `band_value` is what the band *makes* the
      state — `tripped` at the assert, `closed` at the clear — and the two members it does not
      name are not band outcomes at all: `retrying` and `latched` are the one-reclose-then-latch
      lifecycle this entry is named for, which is a rule about how many times the band may fire
      rather than a third boundary of it.
    provenance:
      basis: chosen
      reason: "electrical_diode.md:254 supplies one controlled reclose then latch; a latched discrete with hysteresis is the only representation in which reclose-then-latch is expressible at all, and its band is the lcl_overcurrent band as a fraction of the load's rating"

  - id: load_shed_class
    method: discrete
    node: load_shed_state
    unit: "enum[none,P3,P2,P1,P0]"
    moved_by:
      - "logic:the undervoltage ladder's own position, which the bus thresholds drive"
    hysteresis: {assert: 26.5, clear: 27.2, dwell_ms: 500}
    band_on: power.dc_bus_a_v
    band_value: UNCONFIGURED
    evidence_question: >-
      WP02 E-9. Not a value a source can give: Apollo shed load by crew procedure, not by an
      automatic ladder. What the sources do give is the envelope the ladder sits in: the DC
      undervoltage caution at 26.25 V (AOH p. 2.6-5; TN D-7609 p. 8), sustained operation
      26.5-30.0 V and limits 26.5-31.0 V (J-mission handout p. 2.6-26), and "use batts only when
      main bus volts < 24.5" in the emergency power-down (Apollo 15 CSM Systems Checklist
      EMER/1-7). The rung-to-class map remains the decision coupling.yaml#open_debts names
    note: >-
      The ladder's position, and the one band of the four in profiles.yaml that the position
      itself latches on: the top tier, `bus_a_undervoltage` — assert 26.5 V, clear 27.2 V. The
      clear was 27.0 V until `check_band_on` read this entry's `band_on` against the threshold it
      names, and the two statements about the same volts disagreed by 0.2 V: a bus recovering to
      27.1 V released the ladder's position while `bus_a_undervoltage` was still asserted. The
      per-tier dwells and the three tiers below stay in profiles.yaml, where the thresholds that
      step through them carry them; what this entry owns is the latch, and a latch needs one band
      rather than four. **`band_value` is `UNCONFIGURED`, and it is the sharpest thing this entry
      owes.** By the rung map `coupling.yaml#open_debts` already records, `bus_a_undervoltage`
      selects `none` — which is what the threshold's own provenance says when it calls this tier
      one that "does not shed load" — so *both* outcomes of the one band this state declares are
      the same member of its vocabulary. A band that makes the state `none` whichever way the bus
      crosses it cannot move the state at all, and the three rungs that do move it are the other
      `bus_a_*` thresholds, which this entry does not band. What is owed is the ladder's
      rung-to-class map as a declaration a band can read, which is one decision with the missing
      P1 rung rather than a value somebody can supply.
    provenance:
      basis: chosen
      reason: "the ladder position is a mode, not a measurement, so it is latched; its band is the top tier's own band on power.dc_bus_a_v, which `band_on` names so the linter holds the two to the same volts"

  # The connection of every source `set_source` names. Internal: power alone reads it.
  - id: source_enabled
    node: internal
    method: discrete
    unit: "map[source_id,enum[on,off]]"
    initial:
      fc_1: "on"
      fc_2: "on"
      fc_3: "on"
      battery_csm_1: "off"
      battery_csm_2: "off"
      battery_csm_3: "off"
      battery_lm_descent_1: "off"
      battery_lm_descent_2: "off"
      battery_lm_descent_3: "off"
      battery_lm_descent_4: "off"
      battery_lm_ascent_1: "off"
      battery_lm_ascent_2: "off"
    initial_provenance:
      basis: historical
      source: >-
        TN D-7609 p. 5: "the normal configurations were with fuel cells 1 and 2 on main bus A and with
        fuel cell 3 on main bus B", and the batteries off the main buses in coast (TN D-7609; Apollo 10
        consumables analysis Table 8-I: two batteries in parallel only "during ascent and each SPS
        maneuver"). The LM batteries are off because the LM is unpowered cargo in translunar coast
      note: >-
        the battery entries are positions `set_source` writes and no rule reads yet: the bus solve is
        the fuel cells' alone, as `bus_a_v`'s note says. They are declared so the map is the verb's
        whole argument space, and they become a reading when the batteries join the bus
    moved_by: ["command:set_source"]
    command_value:
      - verb: set_source
        argument: state
        key: source
        why: >-
          identity: the verb's `state` argument is `on` or `off` and so is the element it writes, keyed
          by the verb's `source` argument
    note: >-
      one position per source. A fuel cell set `off` is disconnected from its main bus: "one fuel cell
      can be disconnected from the buses increasing the loads on the remaining fuel cells" (AOH
      p. 2.6-28), and a module isolated after a malfunction is the AOH p. 2.6-23 case. The bus solve,
      the module currents, the reactant draw and the bus A margin all follow it in the same tick,
      because the command is applied before the tick walks the schedule (`plant.md` §9 step 1)
    provenance:
      basis: apollo
      ref: "apollo_diode.md:237"
      note: "apollo's `set_source` connects or disconnects a generating source; this is the position the verb writes, which until this state it wrote nowhere (`--apply`: 0 values changed)"

  # The two bus loads and the cells' current. On the `fuel_cell` node, in the order its
  # `state_order` declares, because the cells deliver what the buses draw and everything downstream
  # of the cells (the bus solves, the reactant draws, the waste heat) needs them this tick. They were
  # one constant sum on the sentinel, which advances last.
  - id: bus_a_load_w
    method: algebraic
    node: fuel_cell
    unit: W
    # The reference operating point, the reading the linter re-derives `fuel_cell_power_w` against:
    # every load below on and the transmitter on. The tick computes it from the switches.
    bus_a_load_w: 1148
    # The bus is dead, and its loads draw nothing, when none of these modules is connected.
    cells: [fc_1, fc_2]
    # The rule's parameters (`domains/power/rules.py`): the loads `loads[].bus` puts on main bus A,
    # with their `demand_w`, copied because a rule reads only its own state's declaration and held to
    # the inventory by `tests/test_power_rules.py`.
    loads_w:
      csm_sband_transceiver: 36
      csm_sband_power_amplifier: 72
      csm_imu: 90
      csm_guidance_computer: 150
      csm_instrumentation: 120
      csm_coolant_pump_2: 250
      csm_heaters: 300
      csm_rcs_heaters: 80
      csm_comm_heaters: 50
    transmitter_gated: [csm_sband_power_amplifier]
    note: >-
      the watts main bus A carries this tick: the loads on it that `load_enabled` leaves on, with the
      power amplifier counted only while `comms.transmitter_on` is `on` as well. **The amplifier's
      watts have one home**, the 72 W inventory row (ADR 0003 item 5): `E-AMP-LOAD` orders comms
      before the bus and adds nothing, and `comms.tx_power` is a published measurement, never a load.
      Until the quiet-coast power rules this state was the CSM's whole connected load on both buses,
      1,723 W, because every electrical edge ended on `bus_a`; now each bus carries its own share
    provenance:
      basis: chosen
      reason: >-
        the sum is arithmetic; the *assignment* of loads to buses is chosen (ADR 0003 item 2):
        Apollo flew with fuel cells 1 and 2 on main bus A and fuel cell 3 on main bus B (TN D-7609
        p. 5), and with roughly two thirds of the load on the two-cell bus. No per-load bus
        assignment was found, so `loads[].bus` puts 1,148 W of the 1,723 W (66.6 %) on bus A by
        moving the second coolant pump and the heater bank there, which also puts the two redundant
        pumps on different buses. The earlier split (598 W A, 1,125 W B) ran bus A's two modules at
        9.5 A each, below the 12.9 A normal minimum, at 31.3 V, above the 31 V envelope (WP02 E-2)
  - id: bus_b_load_w
    method: algebraic
    node: fuel_cell
    unit: W
    bus_b_load_w: 575
    cells: [fc_3]
    loads_w:
      csm_suit_fan: 85
      csm_cabin_fan: 60
      csm_co2_scrubber: 80
      csm_coolant_pump_1: 250
      csm_lighting: 100
    transmitter_gated: []
    note: "as `bus_a_load_w`, for main bus B: the loads `loads[].bus` puts there that `load_enabled` leaves on"
    provenance:
      basis: chosen
      reason: "as `bus_a_load_w`: the sum is arithmetic and the load-to-bus assignment is chosen, bounded by the flown two-thirds share on bus A (ADR 0003 item 2)"
  - id: fuel_cell_current_a
    method: algebraic
    node: fuel_cell
    unit: A
    # The reference operating point: bus A's 1,148 W on two modules solves to 37.767 A at 30.397 V,
    # bus B's 575 W on one to 18.919 A at 30.393 V. 56.686 A in all, 18.9 A per module, inside the
    # 12.9-52.6 A envelope.
    fuel_cell_current_a: 56.686
    buses:
      - {bus: csm_bus_a, load: bus_a_load_w, cells: [fc_1, fc_2]}
      - {bus: csm_bus_b, load: bus_b_load_w, cells: [fc_3]}
    cell_open_circuit_v: 32.30
    cell_resistance_ohm: 0.1008
    cell_current_envelope_a: [12.903, 52.593]
    note: >-
      the three modules' summed current, which is what the reactants are charged by (ADR 0003 item 3):
      the J-mission EPS handout p. 2.6-21 publishes consumption per ampere per fuel cell, so the
      vehicle's draw is the per-ampere rate times the sum of the module currents. Each bus is solved
      at its own load with the same relation as `bus_a_v` and `bus_b_v` (`rules.solve_bus`), so this
      current and those voltages are one operating point. No value when either bus has none
    provenance:
      basis: derived
      relation: >-
        I = I_A + I_B, each the smaller root of (R/n) I^2 - E0 I + P = 0 for its bus's load P and the
        n of its modules (`buses`) that `source_enabled` leaves connected; a bus with none carries 0 A. E0, R and the envelope are `components.fc_[n]`'s, copied as
        `bus_a_v` copies them and held to them by `tests/test_power_rules.py`

  # One module's own current, and the rated output bus A's connected modules can deliver. Both on the
  # `fuel_cell` node, after the module current, because they are the same operating point read per
  # module and per bus.
  - id: fc_1_current_a
    method: algebraic
    node: fuel_cell
    unit: A
    # The reference operating point: bus A's 1,148 W on two modules is 37.767 A, half of it each.
    fc_1_current_a: 18.884
    cell: fc_1
    buses:
      - {bus: csm_bus_a, load: bus_a_load_w, cells: [fc_1, fc_2]}
      - {bus: csm_bus_b, load: bus_b_load_w, cells: [fc_3]}
    cell_open_circuit_v: 32.30
    cell_resistance_ohm: 0.1008
    cell_current_envelope_a: [12.903, 52.593]
    note: >-
      what fuel cell 1 itself delivers, which `power.source_1_current_a` publishes. Until this state
      the channel was `fuel_cell_power_w / bus_a_v`, the three modules' watts over one bus's volts:
      about 54 A at MET 0 for a module carrying 17.6 A, and a number that did not fall when the module
      was taken off line. PWR-02's evidence is "one source current falls while the others rise", so
      the channel has to be one module's. 0 A when the module is disconnected
    provenance:
      basis: derived
      relation: >-
        its bus's current (the same solve as `fuel_cell_current_a`, `rules.solve_bus`) divided equally
        among the connected modules on that bus: identical modules in parallel at one terminal voltage
        share the current equally under V = E0 - R i (`components.fc_[n]`, WP02 E-2). E0, R and the
        envelope are copied as `bus_a_v` copies them and held to them by `tests/test_power_rules.py`
  - id: bus_a_rated_w
    method: algebraic
    node: fuel_cell
    unit: W
    # Both bus A modules connected: 2 x 1,420 W.
    bus_a_rated_w: 2840
    cells: [fc_1, fc_2]
    rated_w: {fc_1: 1420, fc_2: 1420}
    note: >-
      the rated output of the modules connected to main bus A, which `power.load_margin_w` subtracts
      the bus's load from. The margin read the two modules' `rated_w` straight from the components
      until this state, so a module taken off line left the margin where it was, the omission the
      point's own provenance named ("a failed module (the routing is the normal one, not a switch
      state)")
    provenance:
      basis: derived
      relation: >-
        the sum of `components.fc_[n].rated_w` (1,420 W, the top of the AOH p. 2.6-2 normal envelope,
        WP02 E-1) over the bus A modules `source_enabled` leaves on. The quantity is still ADR 0004
        operator item 1's (John, 2026-10-16): available generation on bus A less its load

  # The switch position of every load in the inventory below, and the state `set_load` moves. It is
  # on a coupling node, `load_shed_state` beside the ladder's class, rather than the sentinel, because
  # two domains read it: power sums the enabled loads onto each bus, and thermal sums the same loads'
  # heat. A state on the sentinel is readable by its own domain only (`plant.md` §2, D5).
  - id: load_enabled
    node: load_shed_state
    method: discrete
    unit: "map[load_id,enum[on,off]]"
    initial:
      csm_sband_transceiver: "on"
      csm_sband_power_amplifier: "on"
      csm_suit_fan: "on"
      csm_cabin_fan: "on"
      csm_co2_scrubber: "on"
      csm_imu: "on"
      csm_guidance_computer: "on"
      csm_instrumentation: "on"
      csm_coolant_pump_1: "on"
      csm_coolant_pump_2: "on"
      csm_heaters: "on"
      csm_rcs_heaters: "on"
      csm_comm_heaters: "on"
      csm_lighting: "on"
      lm_sband_transmitter: "off"
      lm_sband_high_power: "off"
      lm_cabin_fan: "off"
      lm_suit_fan: "off"
      lm_co2_scrubber: "off"
      lm_guidance_computer: "off"
      lm_landing_radar: "off"
      lm_instrumentation: "off"
      lm_heaters: "off"
      lm_rcs_heaters: "off"
      lm_lighting: "off"
    initial_provenance:
      basis: chosen
      reason: >-
        all inventory loads on at MET 0, matching the configured 1,723 W total, which TN D-7609 p.2
        bounds to the flown 60–80 A coast band. The CSM loads are the fourteen whose `demand_w` sums to
        `load_budget.csm_total_demand_w`, and 1,723 W at 28 V is 61.5 A, inside the 60-80 A that TN
        D-7609 p. 2 gives "between SPS burns". The LM loads are off because the LM is unpowered cargo
        in translunar coast (`docs/vehicle-completion/09-quiet-coast-episode.md` §4, in the
        repository root); its own bus is not a CSM bus and none of them reaches `bus_a` or `bus_b`
      note: >-
        not a checklist position. The inventory's loads are model aggregates (`csm_heaters`,
        `csm_lighting`) rather than Apollo circuit breakers, so a per-breaker MET-0 map from the
        Apollo 17 launch checklist (pp. 33-59, which `mission.yaml#launch_state` cites) would first
        need the load-to-breaker mapping `breaker_panel`'s own initial owes. What would replace this
        choice: that mapping, and the post-extraction breaker positions read through it
    moved_by: ["command:set_load"]
    command_value:
      - verb: set_load
        argument: state
        key: load
        why: >-
          identity: the verb's `state` argument is `on` or `off` and so is the element it writes, keyed
          by the verb's `load` argument. `priority` is not a position and writes nothing here
    note: >-
      one position per load, keyed by `loads[].id`. The switch is the load's *connection*; whether a
      connected load draws is the bus rules' business (`domains/power/rules.py`), which is where the
      power amplifier's draw is gated on `comms.transmitter_on` as well. A load the command turns off
      leaves both bus sums, the generation and the reactant draw in the same tick, because the command
      is applied before the tick walks the schedule (`plant.md` §9 step 1)
    provenance:
      basis: apollo
      ref: "apollo_diode.md:237"
      note: "apollo's `set_load` energises or de-energises a load; this is the position the verb writes, which until this state existed it wrote nowhere (`--apply`: 0 values changed)"
# --------------------------------------------------------------------------------------
# Components. `kind` follows coupling.yaml's node kinds; the electrical network's members are
# sources, storage, distribution and protection.
# --------------------------------------------------------------------------------------
components:

  - id: fc_1
    kind: flow
    class: source
    vehicle: csm
    rated_w: 1420
    bus_v: [27, 31]
    note: "one of three fuel-cell modules (vehicle.yaml#electrical)"
    provenance:
      basis: historical
      source: "TN D-7142: three modules of 563-1,420 W each at 27-31 V dc"
    # WP02 electrical evidence (docs/evidence/wp02-electrical.md, E-1 to E-3). The cell is
    # wired straight to the main buses through motor switches: Apollo had no source regulator, and
    # "the application and removal of fuel cell loads causes the terminal voltage to decrease and
    # increase, respectively" (AOH SM2A-03-Block II-(1) p. 2.6-25). These three fields are the
    # published envelope that sentence describes and the source impedance it implies.
    normal_power_w: [400, 1420]
    terminal_v_at_normal_power: [31, 27]
    normal_envelope_provenance:
      basis: historical
      source: >-
        Apollo Operations Handbook SM2A-03-Block II-(1), section 2.6 (CSM 106 and subs; basic
        15 Apr 1969, changed 15 Oct 1969) p. 2.6-2: each power plant "normally supplies 400 to 1420
        watts at 31 to 27 vdc (at fuel cell terminals)" -
        https://www.ibiblio.org/apollo/ApolloProjectOnline/Documents/SMA2A-03-BLOCK%20II%20Volume%201%2019691015/aoh-v1-2-06-eps.pdf
        - and the same 400-1420 W in the J-mission EPS handout (North American Rockwell, 1 Oct
        1971, CSM 112-114) p. 2.6-2
      note: >-
        the voltage range is written high-to-low against a power range written low-to-high, which
        pairs the ends: 31 V at 400 W and 27 V at 1,420 W. That pairing is the one reading the
        derived impedance below rests on. The 563 W lower figure in `provenance.source` is TN
        D-7142's and SP-5115's (p. 29); the AOH and the J-mission handout both say 400 W
    source_resistance_ohm: 0.1008
    open_circuit_intercept_v: 32.30
    source_resistance_provenance:
      basis: derived
      relation: >-
        the secant of the cell's terminal characteristic across its published normal envelope:
        I_low = 400 W / 31 V = 12.903 A, I_high = 1420 W / 27 V = 52.593 A, so
        R = (31 - 27) / (52.593 - 12.903) = 0.10078 ohm, and the open-circuit intercept of that
        line is E0 = 31 + 0.10078 x 12.903 = 32.30 V. Linear in current between the envelope ends;
        outside them it is an extrapolation and a rule must not use it there
      note: >-
        **what this is not**: a polarization curve. No text-extractable primary source reached gives
        terminal volts at a stated current (the Apollo 14 CSM Systems Data Book lists a "FUEL CELL
        PERFORMANCE - VACUUM" chart whose data is graphical only). The secant is the impedance a
        bus solve needs; the curvature it omits is owed with that chart. Per bus: fuel cells 1 and 2
        in parallel on main bus A present 0.0504 ohm, fuel cell 3 alone on main bus B 0.1008 ohm
    normal_bus: csm_bus_a
    normal_bus_provenance:
      basis: historical
      source: >-
        TN D-7609 (Apollo Experience Report: CSM Electrical Power Distribution Subsystem, Mar 1974)
        p. 5: "the normal configurations were with fuel cells 1 and 2 on main bus A and with fuel
        cell 3 on main bus B"; Apollo 15 Mission Report section 6.2: "fuel cells 1 and 2 were placed
        on main bus A and fuel cell 3 on main bus B". The AOH (p. 2.6-2) gives the switchable set:
        fuel cell 1 to bus A, fuel cell 2 to A and B, fuel cell 3 to B
  - id: fc_2
    kind: flow
    class: source
    vehicle: csm
    rated_w: 1420
    bus_v: [27, 31]
    provenance:
      basis: historical
      source: "as fc_1"
    normal_power_w: [400, 1420]
    terminal_v_at_normal_power: [31, 27]
    normal_envelope_provenance: {basis: historical, source: "as fc_1"}
    source_resistance_ohm: 0.1008
    open_circuit_intercept_v: 32.30
    source_resistance_provenance: {basis: derived, relation: "as fc_1: the secant of the AOH p. 2.6-2 normal envelope"}
    normal_bus: csm_bus_a
    normal_bus_provenance: {basis: historical, source: "as fc_1 (TN D-7609 p. 5; Apollo 15 Mission Report 6.2); the AOH allows it on either bus (p. 2.6-2), and the flown normal was bus A"}
  - id: fc_3
    kind: flow
    class: source
    vehicle: csm
    rated_w: 1420
    bus_v: [27, 31]
    provenance:
      basis: historical
      source: "as fc_1"
    normal_power_w: [400, 1420]
    terminal_v_at_normal_power: [31, 27]
    normal_envelope_provenance: {basis: historical, source: "as fc_1"}
    source_resistance_ohm: 0.1008
    open_circuit_intercept_v: 32.30
    source_resistance_provenance: {basis: derived, relation: "as fc_1: the secant of the AOH p. 2.6-2 normal envelope"}
    normal_bus: csm_bus_b
    normal_bus_provenance: {basis: historical, source: "as fc_1 (TN D-7609 p. 5; Apollo 15 Mission Report 6.2)"}
  - id: battery_csm_1
    kind: stock
    class: storage
    vehicle: csm
    ah: 40
    v_nominal: 28
    chemistry: "silver-oxide/zinc"
    provenance:
      basis: historical
      source: "NR and PSR: 3 x 40 Ah entry batteries, 20 cells, 37.2 V open circuit, 27 V minimum loaded"
    # WP02 electrical evidence (docs/evidence/wp02-electrical.md, E-4). The published electrical
    # points, kept as the two handbooks print them because they disagree on the loaded point.
    cells: 20
    open_circuit_v: 37.2
    loaded_points:
      - {source: "AOH SM2A-03-Block II-(1) p. 2.6-17 (CSM 106 and subs)", v: 29, a: 35, v_min: 27}
      - {source: "J-mission EPS handout, 1 Oct 1971, p. 2.6-19 (CSM 112-114)", v: 28, a: 25, v_min: 27, open_circuit_v: 37.1}
    qualified_ambient_f: [50, 110]
    capacity_planning_ah: {in_flight: 40, postlanding: 45}
    electrical_provenance:
      basis: historical
      source: >-
        AOH SM2A-03-Block II-(1) pp. 2.6-16/17: "rated at 40-ampere hours (AH) minimum", open circuit
        37.2 V, 29 V at 35 A, 27 V minimum, ambient 50-110 F, 45 AH after a full recharge for
        postlanding; J-mission EPS handout (https://www.ibiblio.org/apollo/Documents/J%20Mission%20Electrical%20Power%20System%20Oct%201971.pdf)
        pp. 2.6-18/19: 20 silver oxide-zinc cells, 40 Ah minimum (25 A for 60 min), 37.1 V open
        circuit, 28 V nominal / 27 V minimum at 25 A, 50-110 F; Apollo 10 consumables analysis
        (MSC, 9 May 1969) Table 8-I p. 40: 40 Ah each until splashdown, then 45 Ah
      note: >-
        TN D-6976 (Apollo Experience Report: Battery Subsystem, Sep 1972) Table I lists the entry
        battery at **29 V nominal** and p. 3 states "40 A-h (1160 W-h each)"; this component's
        `v_nominal` is 28, so `load_budget.csm_battery_energy_wh` (3 x 40 x 28 = 3,360 Wh) is 3.4 %
        below the 3,480 Wh the experience report's own figure gives. Recorded, not changed: the
        28 is the J-mission handout's loaded figure and the choice between them is the energy
        basis WP04 owes with the derate curve
  - id: battery_csm_2
    kind: stock
    class: storage
    vehicle: csm
    ah: 40
    v_nominal: 28
    chemistry: "silver-oxide/zinc"
    provenance:
      basis: historical
      source: "as battery_csm_1"
  - id: battery_csm_3
    kind: stock
    class: storage
    vehicle: csm
    ah: 40
    v_nominal: 28
    chemistry: "silver-oxide/zinc"
    provenance:
      basis: historical
      source: "as battery_csm_1"
  - id: battery_lm_descent_1
    kind: stock
    class: storage
    vehicle: lm
    ah: 400
    v_nominal: 28
    provenance:
      basis: historical
      source: "NR and PSR: 4 x 400 Ah descent batteries on Apollo 11; they delivered 1,055 Ah of a nominal 1,600 Ah"
  - id: battery_lm_descent_2
    kind: stock
    class: storage
    vehicle: lm
    ah: 400
    v_nominal: 28
    provenance:
      basis: historical
      source: "as battery_lm_descent_1"
  - id: battery_lm_descent_3
    kind: stock
    class: storage
    vehicle: lm
    ah: 400
    v_nominal: 28
    provenance:
      basis: historical
      source: "as battery_lm_descent_1"
  - id: battery_lm_descent_4
    kind: stock
    class: storage
    vehicle: lm
    ah: 400
    v_nominal: 28
    provenance:
      basis: historical
      source: "as battery_lm_descent_1"
  - id: battery_lm_ascent_1
    kind: stock
    class: storage
    vehicle: lm
    ah: 296
    v_nominal: 28
    provenance:
      basis: historical
      source: "NR: 2 x 296 Ah ascent batteries, 50 A for 5.9 h"
  - id: battery_lm_ascent_2
    kind: stock
    class: storage
    vehicle: lm
    ah: 296
    v_nominal: 28
    provenance:
      basis: historical
      source: "as battery_lm_ascent_1"
  - id: csm_bus_a
    kind: state
    class: bus
    vehicle: csm
    v_band: [27.0, 30.5]
    # The band above is the *envelope*; this is the number every watt-to-amp conversion on the
    # vehicle divides by. Until this round the bus carried the band and no nominal, and three
    # edges wrote `1/28` — a figure that was a battery's `v_nominal`, the low end of a fuel
    # cell's 27-31 V range, and prose, but never a declaration about the bus itself. 28 V is what
    # the corpus's own arithmetic already uses (`apollo_diode.md:157`'s "28 V bus"), so declaring
    # it is a promotion rather than a choice.
    v_nominal: 28
    provenance:
      basis: apollo
      ref: "apollo_diode.md:73"
      note: "the band is apollo's, not electrical_diode.md:251's 24-32 V; C-01"
  - id: csm_bus_b
    kind: state
    class: bus
    vehicle: csm
    v_band: [27.0, 30.5]
    v_nominal: 28
    provenance:
      basis: apollo
      ref: "apollo_diode.md:74"
  - id: lm_bus
    kind: state
    class: bus
    vehicle: lm
    v_band: [26.0, 31.0]
    v_nominal: 28
    provenance:
      basis: chosen
      reason: "the LM ran a single 28 V bus with no second source; the band is chosen because no source gives an LM bus envelope, and it is deliberately narrower than the CSM's so a shared threshold cannot be reused by accident"
  - id: csm_tie_ab
    kind: discrete
    class: protection
    vehicle: csm
    normally: open
    provenance:
      basis: apollo
      ref: "apollo_diode.md:79"
      note: "apollo publishes bus_tie_state as open/closed/tripped and makes an unintended trip an event"
  - id: lcl
    kind: discrete
    class: protection
    per: load
    provenance:
      basis: chosen
      reason: "electrical_diode.md:254: a solid-state current-limiting switch per load, 110-125 % limit and >200 % hard short in <=2 ms. Apollo had mechanical breakers plus the PDU; a per-load LCL is the modelling choice that makes an overloaded load distinguishable from a failed bus"

# --------------------------------------------------------------------------------------
# The load inventory. The corpus has none: electrical_diode.md:216-224 names eight loads for
# a twelve-domain vehicle, and no source publishes CSM or LM total loads in watts. So this is
# authored, anchored wherever a figure exists and marked otherwise.
#
# `demand_w` is the steady draw and `inrush_w` the starting transient, because the starting
# transient is what makes a marginal bus drop a pump — the flagship chain of the experiment.
# The four classes are the shed order: P0 is survival, protection, control and telemetry; P3
# is discretionary.
# --------------------------------------------------------------------------------------
loads:

  # --- CSM ------------------------------------------------------------------------------
  - id: csm_sband_transceiver
    vehicle: csm
    bus: csm_bus_a
    demand_w: 36
    inrush_w: 36
    class: P1
    provenance:
      basis: apollo
      ref: "apollo_diode.md:157"
      note: "36 W input for the basic S-band transceiver"
  - id: csm_sband_power_amplifier
    vehicle: csm
    bus: csm_bus_a
    demand_w: 72
    inrush_w: 72
    class: P2
    provenance:
      basis: apollo
      ref: "apollo_diode.md:157"
      note: "72 W with the power amplifier. This is the load whose switch-on exposes a marginal pump (apollo_diode.md:1140): it is never the root fault and always the trigger"
  - id: csm_suit_fan
    vehicle: csm
    bus: csm_bus_b
    demand_w: 85
    inrush_w: 130
    class: P0
    provenance:
      basis: historical
      source: "NR: CSM suit fan 85 W"
  - id: csm_cabin_fan
    vehicle: csm
    bus: csm_bus_b
    demand_w: 60
    inrush_w: 95
    class: P1
    provenance:
      basis: chosen
      reason: "no published CSM cabin-fan figure found; scaled from the LM cabin fan's 62 W (NR) because the two perform the same job on a similar volume"
  - id: csm_co2_scrubber
    vehicle: csm
    bus: csm_bus_b
    demand_w: 80
    inrush_w: 110
    class: P0
    provenance:
      basis: chosen
      reason: "a LiOH bed needs a blower and no source gives its draw; P0 because losing it is a life-support failure on a timescale of hours, not minutes"
  - id: csm_imu
    vehicle: csm
    bus: csm_bus_a
    demand_w: 90
    inrush_w: 90
    class: P1
    provenance:
      basis: chosen
      reason: "the inertial platform is on the bus that must not sag; a platform that drops out costs an alignment, which costs mission time and propellant"
  - id: csm_guidance_computer
    vehicle: csm
    bus: csm_bus_a
    demand_w: 150
    inrush_w: 150
    class: P1
    provenance:
      basis: chosen
      reason: "apollo_diode.md:177 publishes exec_margin_pct with a <10 event, so the computer's own budget is observable; its draw is not published"
  - id: csm_instrumentation
    vehicle: csm
    bus: csm_bus_a
    demand_w: 120
    inrush_w: 120
    class: P2
    provenance:
      basis: apollo
      ref: "apollo_diode.md:182"
      note: "apollo publishes avionics.instrumentation_power_w with an excessive/zero event; the magnitude is chosen"
  - id: csm_coolant_pump_1
    vehicle: csm
    bus: csm_bus_b
    demand_w: 250
    inrush_w: 420
    class: P1
    provenance:
      basis: chosen
      reason: "THE load of the flagship chain. Its inrush is 1.68x its demand because that ratio is what makes a sagging bus drop the pump and start the thermal cascade; the absolute figure is chosen to sit where a 27 V bus with a 0.05 ohm source impedance crosses the contactor-hold threshold under a 72 W step"
  - id: csm_coolant_pump_2
    vehicle: csm
    bus: csm_bus_a
    bus_provenance: {basis: chosen, reason: "moved from csm_bus_b so main bus A carries 1,148 W of 1,723 W, the flown two-thirds share on the two-cell bus (ADR 0003 item 2; TN D-7609 p. 5); no per-load bus assignment was found"}
    demand_w: 250
    inrush_w: 420
    class: P2
    provenance:
      basis: chosen
      reason: "the redundant pump, deliberately one class lower so that shedding the second pump is a decision with a thermal consequence rather than a free choice"
  - id: csm_heaters
    vehicle: csm
    bus: csm_bus_a
    bus_provenance: {basis: chosen, reason: "moved from csm_bus_b so main bus A carries 1,148 W of 1,723 W, the flown two-thirds share on the two-cell bus (ADR 0003 item 2; TN D-7609 p. 5); no per-load bus assignment was found"}
    demand_w: 300
    inrush_w: 300
    class: P2
    provenance:
      basis: chosen
      reason: "thermal_diode.md:191-207 has heater banks as the TCS's main actuation; the bank draw is chosen so that heater load and pump load are comparable, which is what makes a cold vehicle and a shed vehicle the same problem"
  - id: csm_rcs_heaters
    vehicle: csm
    bus: csm_bus_a
    demand_w: 80
    inrush_w: 80
    class: P2
    provenance:
      basis: chosen
      reason: "hypergolic RCS plumbing is heater-protected; no figure published"
  - id: csm_comm_heaters
    vehicle: csm
    bus: csm_bus_a
    demand_w: 50
    inrush_w: 50
    class: P3
    provenance:
      basis: chosen
      reason: "P3 because a cold transmitter degrades gracefully and a cold propellant line does not"
  - id: csm_lighting
    vehicle: csm
    bus: csm_bus_b
    demand_w: 100
    inrush_w: 100
    class: P3
    provenance:
      basis: chosen
      reason: "discretionary by definition, and the first thing a crew sheds"

  # --- LM -------------------------------------------------------------------------------
  - id: lm_sband_transmitter
    vehicle: lm
    bus: lm_bus
    demand_w: 20
    inrush_w: 20
    class: P1
    provenance:
      basis: historical
      source: "PSR: LM S-band 0.75 W low power; the 20 W is the chosen dc input from vehicle.yaml#comms"
  - id: lm_sband_high_power
    vehicle: lm
    bus: lm_bus
    demand_w: 90
    inrush_w: 90
    class: P2
    provenance:
      basis: historical
      source: "PSR: LM S-band 18.6 W high power; 90 W is the chosen dc input"
  - id: lm_cabin_fan
    vehicle: lm
    bus: lm_bus
    demand_w: 62
    inrush_w: 95
    class: P0
    provenance:
      basis: historical
      source: "NR: LM cabin fan 62 W average"
  - id: lm_suit_fan
    vehicle: lm
    bus: lm_bus
    demand_w: 85
    inrush_w: 130
    class: P0
    provenance:
      basis: historical
      source: "NR: suit fan 85 W"
  - id: lm_co2_scrubber
    vehicle: lm
    bus: lm_bus
    demand_w: 80
    inrush_w: 110
    class: P0
    provenance:
      basis: chosen
      reason: "as csm_co2_scrubber; on the LM this is the load Apollo 13's improvisation was about"
  - id: lm_guidance_computer
    vehicle: lm
    bus: lm_bus
    demand_w: 150
    inrush_w: 150
    class: P1
    provenance:
      basis: chosen
      reason: "the LM guidance computer; no published draw found"
  - id: lm_landing_radar
    vehicle: lm
    bus: lm_bus
    demand_w: 120
    inrush_w: 120
    class: P2
    provenance:
      basis: chosen
      reason: "landing radar is only needed from PDI to touchdown, so it is a phase-scoped load and a natural thing to find switched off at the wrong moment"
  - id: lm_instrumentation
    vehicle: lm
    bus: lm_bus
    demand_w: 100
    inrush_w: 100
    class: P2
    provenance:
      basis: chosen
      reason: "as csm_instrumentation"
  - id: lm_heaters
    vehicle: lm
    bus: lm_bus
    demand_w: 200
    inrush_w: 200
    class: P2
    provenance:
      basis: chosen
      reason: "as csm_heaters, scaled down for the smaller cabin"
  - id: lm_rcs_heaters
    vehicle: lm
    bus: lm_bus
    demand_w: 60
    inrush_w: 60
    class: P2
    provenance:
      basis: chosen
      reason: "as csm_rcs_heaters"
  - id: lm_lighting
    vehicle: lm
    bus: lm_bus
    demand_w: 40
    inrush_w: 40
    class: P3
    provenance:
      basis: chosen
      reason: "as csm_lighting"

# --------------------------------------------------------------------------------------
# Load total, and the one check on it that has a published anchor.
# --------------------------------------------------------------------------------------
load_budget:

  csm_total_demand_w: 1723
  lm_total_demand_w: 1007
  # **The denominator `power.battery_soc_pct` never had.** The channel is a percentage and nothing
  # said a percentage *of what*: `battery_charge_j` is a stock with no capacity, and the batteries'
  # `ah` and `v_nominal` were read by nothing. These are the products, summed per vehicle.
  #
  # The LM's figure is a total and not a *simultaneous* one: the four descent batteries are
  # jettisoned with the descent stage, so `lm_ascent_stage` flies on the two ascent batteries alone
  # — 16,576 Wh, which is 16.5 h of the LM bus at full draw against an `ascent_rendezvous` phase of
  # 3.5 h. Both halves are recorded because the interesting number is the smaller one.
  csm_battery_energy_wh: 3360
  lm_battery_energy_wh: 61376
  lm_battery_energy_ascent_stage_wh: 16576
  lm_battery_energy_descent_stage_wh: 44800
  provenance:
    basis: derived
    relation: >-
      CSM demand sums to 1,723 W against the 2,020 W average load implied by Apollo 11's
      393 kWh over 195 h (vehicle.yaml#electrical) — the 297 W difference is battery charging,
      transients and the loads Apollo carried that this inventory does not model. LM demand
      sums to 1,007 W against an 81 A peak during powered descent, about 2,300 W, which is the
      radar and computer at full tilt plus the descent-engine valve load.
    source: "A11: 393 kWh over 195 h at an average 68.7 A on a 29.4 V CM bus; LM peak 81 A during PDI"
