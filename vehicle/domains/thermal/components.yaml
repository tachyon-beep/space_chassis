          specific_heat_j_per_kg_k: domains/thermal/components.yaml:state.zone_lm_cabin_t.specific_heat_j_per_kg_k
          conductance_w_per_k: domains/thermal/components.yaml:state.zone_lm_cabin_t.conductance_w_per_k
      relation: >-
        as the CSM cabin, and carried rather than asserted to be the same: 6.7 m3 at about 5 psia
        against the CSM's 5.9, so the same lumped mass and conductance within the precision of
        either figure. The two compartments are the same construction in two spacecraft, which is
        why the second one is a copy of the first and says so
  - id: zone_lm_descent_t
    # **A heat balance on the LM's loop, as the service bay's.** `C dT/dt = Q_bay - G * f *
    # (T - T_coolant)`. The LM loop has no temperature or flow state (the LM is unpowered cargo in
    # this episode), so `T_coolant` is the loop's declared supply, as `cabin_eq_lm_k` reads it, and
    # `f` is 1 while the LM's pump is commanded on (`coolant_pump`) and 0 otherwise. The LM's pump
    # declares no power load, so there is no switch to read. At MET 0 the pump is off and every LM
    # load is off, so the stage holds its starting temperature: nothing in this model heats it, and
    # it has no path to anything colder.
    method: dynamics
    node: descent_bay_zone_t
    unit: K
    initial: 283.15
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11: the middle of the bay's declared [-30, 50] C
        limits (`vehicle.yaml#thermal.zones.lm_descent_bay.limit_c`), 10 C = 283.15 K. The LM-5
        descent stage's temperature at the model's MET 0 is not published. The LM-3 temperature
        history in LM0-510-1070 has a different vehicle and mission epoch and cannot supply this
        starting value directly
    heat_state: descent_bay_heat_w
    supply_k: 280.35
    pump_state: coolant_pump
    pump: pump_lm
    lumped_mass_kg: 768
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 64
    provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11. No source reached gives the stage's node
        capacity or its conductance to the LM loop (T1). G is the stage's declared 180 W over its
        rise above the 280.35 K supply at the chosen start, 180 / 2.8 = 64.3 W/K, rounded to 64 W/K
        (the powered equilibrium is then 283.16 K). C is G times the 10,800 s time constant this
        zone carried as a lag (chosen: an exposed, unregulated stage whose mass is mostly propellant
        and structure with a poor path to the loop), 691,200 J/K, which is 768 kg at 900 J/kg-K
      bound: "G >= 180 / (323.15 - 280.35) = 4.21 W/K: the steady rise Q_bay/G over the 7.2 C supply must hold the stage under its 50 C limit; C/G = 10,800 s; only the transient depends on C"
      note: >-
        the chosen time constant does not validate a physical conductance. LM0-510-1070 (31 January
        1969), reference 5, cites LM0-510-1036, "Revised Thermal Nodal Diagrams for LM-3"
        (17 December 1968). That separate document has not been examined. Its title establishes
        LM-3 nodal scope, not the presence of capacity data or applicability to Apollo 11 LM-5.
        A usable LM-5 zone needs capacity and coupling data for its descent stage plus a stated
        aggregation of those nodes. Searched again 2026-10-17 (web search for an LM descent-stage
        nodal model): nothing that carries capacities
      source_audit:
        modeled_vehicle: LM-5
        candidate_document: LM0-510-1036
        candidate_effectivity: LM-3 only; LM-5 applicability unverified
        evidence_status: citation_only
        missing: LM-5 descent node capacities and conductances mapped to the descent-bay zone
    supply_provenance:
      basis: chosen
      reason: "`vehicle.yaml#thermal.loops.loop_lm.supply_c`, 7.2 C = 280.35 K, itself `chosen`; the figure `cabin_eq_lm_k.supply_k` copies"
  - id: radiator_eq_t
    node: radiator_eq
    method: algebraic
    unit: K
    total_k: 322.06
    # **The radiator at the loop's temperature (`E-RAD-THERM`'s rejection law).** The rule solves
    # for the mean temperature of the glycol in the panel, `T_m`, from the loop's own balance:
    # the coolant enters at `T_ri = coolant_loop_t + load / (m_dot * c_p)` and leaves cooled by what
    # the panel rejects, so `T_m = T_ri - (eps * sigma * A * T_m^4 - Q_env) / (2 * m_dot * c_p)`,
    # solved by bisection. With no flow through the panel (pump off or `set_radiator_bypass`
    # bypass) it is the panel's own sink, `(Q_env / (eps * sigma * A))^0.25`, where it rejects
    # nothing. `zone_radiator_t` relaxes toward it.
    load_state: loop_primary_load_w
    supply_state: coolant_loop_t
    flow_state: coolant_flow_kg_s
    environment_state: environment_heat_w
    bypass_state: radiator_bypass
    loop: loop_primary
    # The published 200 lb/hr (`coolant_flow_kg_s.rated_flow_kg_s`): below it the panel and the
    # evaporator take heat only from the share of the coolant that passes them.
    rated_flow_kg_s: 0.025199576111111112
    emissivity: 0.85
    area_effective_m2: 8.1
    stefan_boltzmann: 5.670374419e-08
    specific_heat_j_per_kg_k: 3626.1
    provenance:
      basis: derived
      relation: >-
        the panel's law, `Q = eps * sigma * A_eff * T^4 - Q_env`, from `radiator_model.csm`
        (eps 0.85, A_eff 8.1 m2) and `vehicle.yaml#thermal.loops.loop_primary.specific_heat_j_per_kg_k`
        (3,626.1 J/kg-K), all copied for the rule and held equal to their homes by
        `tests/test_thermal_rules.py`. `total_k` is the figure this state carried until ADR 0003:
        the temperature at which the panel alone carries 1,723 W against the 2,477 W hold, 322.06
        K. It was the defect `09-quiet-coast-episode.md` §3 names: 25 K hotter than the loop's own
        22.8-23.9 C radiator inlet, while `E-WATER-RAD` charged evaporator water for the same load.
        It stays as the design-point figure the old relation computed and is not the tick's value
      note: >-
        Under the declared hot hold (ADR 0003 item 9) and the MET-0 load the panel's glycol sits
        near 296 K and the panel rejects about 500 W net. The evaporator carries the rest, which is
        the episode's scarcity
  - id: zone_radiator_t
    method: lag
    node: radiator_reject
    unit: K
    initial: 289.38
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 10: the panel starts where its own law settles for
        the MET-0 operating point. It is the fixed point of a quartic with no closed form, so it
        cannot be an `initial_derivation`; it is computed by `radiator_eq_t`'s rule and held to
        0.01 K by `tests/test_quiet_coast_scenario.py`: `radiator_eq_t`'s fixed point with the loop
        at its 280.35 K supply, 0.0252 kg/s of flow, the default vehicle's passive-thermal-control
        absorbed load (`environment_heat_w.initial`, 1,086.9 W) and the MET-0 collected load of
        1,651 W (every CSM load on, the power amplifier's transmitter off, so its 72 W is not
        dissipated). There the panel carries the whole load and the evaporator is off. The
        quiet-coast episode's hot hold starts it at 295.65 K instead
        (`scenarios/quiet_coast.yaml`, held by `tests/test_thermal_rules.py`). It was 322.06 K
        until ADR 0003, the temperature at which the panel *alone* carries the whole load against
        the hot hold, which is not where a panel with a working evaporator settles
    tau_s: 300
    provenance:
      basis: derived
      relation: "the panel's own lumped mass over its radiation conductance: a 9.1 m2 aluminium panel at 2.7 kg/m2 is 25 kg = 22,500 J/K, and its linearised radiation conductance at 285 K is 4 x 2,588/285 = 36 W/K, giving 625 s. Chosen at 300 s because the linearised conductance overstates damping at the cold end; the value sits inside the range the two estimates bracket."
      note: "the radiator itself is an observable with no command interface (simulator-design.md:158) — it has a temperature and a rejection curve, and nothing an agent can command acts on it directly"
  - id: comm_amp_t
    # **A heat balance on the amplifier's own lump (ADR 0003 items 5, 10-11).** `C dT/dt = P -
    # G (T - T_plate)`, explicit, where `P` is comms' `amp_dissipation_w`: the amplifier's 72 W of
    # dc input less its 11.2 W of RF while the transmitter is on, and zero while it is off. It was
    # a `lag` with no driver and a rise sized for a 250 W dissipation the amplifier does not have.
    method: dynamics
    node: internal
    unit: K
    initial: 283.35
    initial_provenance:
      basis: derived
      relation: >-
        the amplifier's equilibrium at MET 0 (ADR 0003 item 10): the transmitter is off at MET 0
        (`comms.transmitter_on`), so it dissipates nothing and sits at the coldplate's own
        equilibrium, 283.35 K (`zone_csm_avionics_t.initial`)
    dissipation_state: amp_dissipation_w
    plate_state: zone_csm_avionics_t
    lumped_mass_kg: 5
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 17
    provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11. No source reached gives the travelling-wave tube assembly's capacity or its
        conductance to the plate (T1). C = 5 kg x 900 J/kg-K = 4,500 J/K and G = 17 W/K are the
        values this state carried, kept and relabelled. With the dissipation now derived from the
        amplifier's input and efficiency (60.8 W), the steady rise above the plate is 60.8/17 =
        3.6 K, not the 15 K the 250 W sizing implied. The flown aggregate (SP-368 p. 525) bounds the
        loop and not this lump, so it does not constrain C or G
      bound: "G in (0, inf): the steady rise is P/G; C/G = 265 s"
    note: "apollo_diode.md:106 publishes comm_amp_c with a >60 C event. It gets its own node rather than sharing the avionics lump because it is the component the flagship chain overheats, and its smaller mass is what makes it the first to go"
  - id: coolant_loop_t
    # **The loop's heat balance (`E-PUMP-COOL`, `E-RAD-THERM`).** One well-mixed lump at the
    # supply station, the evaporator's outlet: `C dT/dt = Q_load - Q_rad - Q_evap`, explicit, with
    # `C` the loop's coolant mass times its specific heat. `Q_rad` is `radiator_rejection_w` while
    # coolant flows through the panel and zero when it does not (pump off, or the bypass valve at
    # `bypass`); `Q_evap` is `evaporator_duty_w`. With the evaporator holding the outlet, the loop
    # relaxes to its 280.35 K setpoint with the time constant `C / (m_dot * c_p)` = 1,042 s, one
    # loop transit; with the pump off nothing leaves it and it warms at `Q_load / C`.
    method: dynamics
    node: coolant_supply_t
    unit: K
    initial: 280.35
    initial_derivation:
      expression: supply_c + kelvin_offset
      inputs:
        supply_c: vehicle.yaml:thermal.loops.loop_primary.supply_c
        kelvin_offset: 273.15
    initial_provenance:
      basis: derived
      relation: >-
        the loop starts at its declared supply temperature, 7.2 C = 280.35 K
        (`vehicle.yaml#thermal.loops.loop_primary.supply_c`). It is also the balance's own
        equilibrium at MET 0 (ADR 0003 item 10): the evaporator is fed and holds its outlet at that
        setpoint (`evaporator_duty_w.outlet_setpoint_k`)
    load_state: loop_primary_load_w
    flow_state: coolant_flow_kg_s
    rejection_state: radiator_rejection_w
    evaporator_state: evaporator_duty_w
    bypass_state: radiator_bypass
    loop: loop_primary
    # The published 200 lb/hr (`coolant_flow_kg_s.rated_flow_kg_s`): below it the panel and the
    # evaporator take heat only from the share of the coolant that passes them.
    rated_flow_kg_s: 0.025199576111111112
    heat_capacity_j_per_k: 95185.125
    provenance:
      basis: derived
      relation: >-
        C = the loop's coolant mass x its specific heat: 26.25 kg
        (`vehicle.yaml#thermal.loops.loop_primary.coolant_mass_kg`, 25 L at 1,050 kg/m3) x 3,626.1
        J/kg-K (`specific_heat_j_per_kg_k`, derived from TN D-6718's own load, flow and rise) =
        95,185.125 J/K. It was a `lag` with `tau_s: 45`, a sensor-and-mixing constant nothing
        derived, driven by `E-PUMP-COOL`, which owed its value. A lag relaxes toward one driver and
        the loop has three heat terms, so it is a balance now
      note: "the transit is the delay element `loop_transport_t`, not this balance. Two different things that a single lumped node would fuse into one wrong number."
  - id: coolant_flow_kg_s
    # **The pump as flow (ADR 0003 item 4).** The rule relaxes the flow toward `f * rated_flow`
    # with the pump's spin-up constant, `f` being 1 while a primary-loop pump is commanded on
    # (`coolant_pump`) and powered (`power.load_enabled[<its load>]`), and 0 otherwise. One running
    # pump moves the published 200 lb/hr; the primary loop's second pump is its standby, not a
    # second 200 lb/hr. No rated speed is needed.
    method: dynamics
    node: coolant_flow
    unit: "kg/s"
    initial: 0.025199576111111112
    initial_derivation:
      expression: nominal_flow_lb_per_h * lb_to_kg / seconds_per_hour
      inputs:
        nominal_flow_lb_per_h: vehicle.yaml:thermal.loops.loop_primary.nominal_flow_lb_per_h
        lb_to_kg: 0.45359237
        seconds_per_hour: 3600
    initial_provenance:
      basis: derived
      relation: >-
        the loop starts at its published flow: 200 lb/hr (`vehicle.yaml#thermal.loops`), which
        is the 0.0252 kg/s this state's own relation above quotes and the figure the loop's
        mixing time constant is derived from
    rated_flow_kg_s: 0.025199576111111112
    pump_state: coolant_pump
    pump_loads: {pump_1: csm_coolant_pump_1, pump_2: csm_coolant_pump_2}
    tau_s: 8
    provenance:
      basis: chosen
      reason: "pump spin-up: a centrifugal pump reaches speed in a few seconds, and 8 s is long enough that a bus sag lasting one tick cannot produce an instant flow loss. This is the lag that makes the flagship chain a ramp rather than a step"
      note: >-
        `rated_flow_kg_s` is the published 200 lb/hr (TN D-6718 p. 11), the same derivation as
        `initial`. `pump_loads` is `components.pump_1.power_load` and `pump_2.power_load`, copied for
        the rule. The pumps are 200 V 3-phase ac machines (AOH SM2A-03 Vol. 1 p. 2.7-24), so the dc
        bus voltage does not set their speed: `E-BUS-PUMP`'s volts-to-flow gain is not read by
        this rule
  - id: pump_1_speed_frac
    # **The pump's speed as a fraction of its rated speed (ADR 0003 item 4).** It was
    # `pump_1_speed_rpm`, a lag that owed the rated rpm three times over: its `initial`, its `on`
    # mapping and `E-CMD-PUMP`'s sensitivity. No source reached gives the rpm or a pump curve
    # (WP02 T2: TN D-6718 pp. 3, 11; SM2A-03 Vol. 1 pp. 2.7-17 to 2.7-24, whose design-data table
    # is illegible; the CSM News Reference p. 122), and ADR 0003 item 4 already moved the loop's
    # flow to a fraction of the published 200 lb/hr. The speed follows the same way: 1 while the
    # pump is commanded on and its load is powered, 0 otherwise, relaxing with the spin-up constant
    # `coolant_flow_kg_s` uses. The rated speed is the unit, so no figure is owed. The state stays
    # separate from the flow because the two together are the diagnosis
    # (`thermal.pump_[n]_speed`): a restricted loop loads the pump without slowing it, and a
    # failing pump slows with the flow. In a healthy loop they move together.
    method: dynamics
    node: coolant_flow
    unit: normalized
    initial: 1.0
    initial_provenance:
      basis: derived
      relation: >-
        pump 1 is commanded on at MET 0 (`coolant_pump.initial`) and its load,
        `csm_coolant_pump_1`, is on (power's MET-0 positions), so it runs at its rated speed, which
        is 1 in this state's unit; the same start `coolant_flow_kg_s.initial` takes at the published
        flow
    pump_state: coolant_pump
    pump: pump_1
    pump_load: csm_coolant_pump_1
    tau_s: 8
    moved_by:
      - "command:set_coolant_pump"
    # **ADR 0003 item 4: the pump's command moves `coolant_pump`, and this state follows it.**
    # `set_coolant_pump` writes `coolant_pump`, which this state's rule reads, as
    # `coolant_flow_kg_s`'s does.
    command_value:
      - verb: set_coolant_pump
        argument: state
        computed: "the shaft speed follows the pump's commanded state: 1 (rated) while on and powered, 0 while off"
        selects: coolant_pump
        why: >-
          a commanded-off pump coasts to zero and a commanded-on one spins up to its rated speed,
          which is the unit of this state. The rated rpm is published nowhere reached, which is why
          the unit is the rating rather than an rpm (ADR 0003 item 4)
    provenance:
      basis: chosen
      reason: >-
        as `coolant_flow_kg_s`: the pump has its own speed state because a blocked loop and a
        slowing pump produce the same flow with different speeds, and that difference is the
        diagnosis. `tau_s` is the flow's 8 s spin-up constant, copied for the rule and held equal by
        `tests/test_thermal_rules.py`. `pump_load` is `components.pump_1.power_load`, copied for
        the rule
  - id: loop_transport_t
    initial: 280.35
    initial_derivation:
      expression: supply_c + kelvin_offset
      inputs:
        supply_c: vehicle.yaml:thermal.loops.loop_primary.supply_c
        kelvin_offset: 273.15
    initial_provenance:
      basis: derived
      relation: >-
        the transport line is full of supply-temperature coolant before anything moves, so its
        contents at MET 0 are the same starting condition as the loop node above — one fluid at
        one temperature, and the delay element holds what is in the pipe
    method: delay
    node: loop_transport
    unit: K
    delay_s: 1042
    provenance:
      basis: derived
      relation: "25 L at the published 200 lb/hr = 90.7 kg/h, i.e. 1.44 L/min of glycol-water at 1,050 kg/m3, gives 17.4 min = 1,042 s of transit"
      note: "implemented as a tick-indexed ring buffer, exact and deterministic, rather than as a chain of small nodes — which would create nodes with residence times below dt and reintroduce the stiffness the exponential map exists to remove (review-findings.md #12)"
  - id: radiator_rejection_w
    method: algebraic
    node: radiator_reject
    unit: W
    total_w: 1723.13
    # **The law at the panel's temperature this tick (`E-RAD-THERM`).** `eps * sigma * A_eff *
    # zone_radiator_t^4 - environment_heat_w`. The panel follows the glycol in it
    # (`radiator_eq_t`), so this is the rejection at the loop's temperature.
    surface_state: zone_radiator_t
    environment_state: environment_heat_w
    emissivity: 0.85
    area_effective_m2: 8.1
    stefan_boltzmann: 5.670374419e-08
    provenance:
      basis: derived
      relation: >-
        the law `radiator_model` states, read at the panel's temperature: eps 0.85 and A_eff 8.1 m2
        from `radiator_model.csm`, copied for the rule and held equal by `tests/test_thermal_rules.py`.
        `total_w` is the figure the old derivation gave at the old 322.06 K equilibrium (0.85 x
        5.670374419e-8 x 8.1 x 322.06^4 - 2,477 = 1,723.13 W, the panel carrying the whole load),
        kept as that design figure. Algebraic because rejection is a function of the current surface
        temperature, not an integral of it
  - id: loop_lm_load_w
    node: internal
    method: algebraic
    unit: W
    total_w: 1007
    zone_heat_states: [cabin_heat_lm_w, descent_bay_heat_w]
    provenance:
      basis: derived
      relation: >-
        as `loop_primary_load_w`, over the two zones that name `loop_lm`: the LM cabin's 827 W and
        the descent stage's 180 W, which is the LM's whole declared demand, 1,007 W
  - id: heater_bank_duty
    method: algebraic
    node: internal
    unit: "-"
    provenance:
      basis: chosen
      reason: "heater duty is commanded and then limited by the zone's own hard limits; there is no state to integrate, and treating it as a state would let a heater command persist through a mode change"
      note: >-
        not in the quiet-coast closure (ADR 0003): `set_heater` carries `duty` as an integer, and a
        commanded state's effect is a mapping from an enum argument's values, which the linter holds
        (`check_command_values`). The heater bank's heat is in the cabin sum at its `demand_w` while
        `csm_heaters` is enabled, so `set_load csm_heaters off` is the closure's heater lever
  - id: evaporator_duty_w
    # **The glycol evaporator (ADR 0003 item 5).** Off unless `set_evaporator_feed` has the CSM's
    # feed on and there is water. It activates when its inlet (the radiator's outlet,
    # `T_ro = coolant_loop_t + (Q_load - Q_rad) / (m_dot * c_p)`) rises above
    # `actuation_k`, then holds its outlet at `outlet_setpoint_k` until the inlet falls back
    # below the setpoint: `duty = clamp(m_dot * c_p * (T_ro - outlet_setpoint_k), 0,
    # capacity_w)`. Its previous value is the latch. `E-WATER-RAD` charges the water for it.
    # `dynamics` rather than `algebraic` because of that latch: a state that reads its own last
    # value needs a seeded starting one, and the plant seeds `dynamics` states and not `algebraic`.
    method: dynamics
    node: radiator_reject
    unit: W
    initial: 0.0
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 10: the evaporator's duty at the model's own MET-0
        equilibrium in passive thermal control, where the panel at `zone_radiator_t.initial`
        carries the whole collected load and the evaporator's inlet is the 280.35 K supply, below
        its 282.55 K actuation: nothing. The quiet-coast episode's hot hold starts it at
        1,651 - 505.8 = 1,145.2 W (`scenarios/quiet_coast.yaml`). Both are held to the rules'
        fixed points (`tests/test_quiet_coast_scenario.py`, `tests/test_thermal_rules.py`)
    feed_state: evaporator_feed
    vehicle: csm
    supply_state: coolant_loop_t
    load_state: loop_primary_load_w
    flow_state: coolant_flow_kg_s
    rejection_state: radiator_rejection_w
    bypass_state: radiator_bypass
    loop: loop_primary
    # The published 200 lb/hr (`coolant_flow_kg_s.rated_flow_kg_s`): below it the panel and the
    # evaporator take heat only from the share of the coolant that passes them.
    rated_flow_kg_s: 0.025199576111111112
    water_state: water_cooling_kg
    specific_heat_j_per_kg_k: 3626.1
    capacity_w: 2345
    actuation_k: 282.55
    outlet_setpoint_k: 280.35
    provenance:
      basis: historical
      source: >-
        SM2A-03 Block II Vol. 1 §2.7 ECS (AOH, ibiblio `aoh-v1-2-07-ecs.pdf`), p. 2.7-18: when the
        coolant entering the evaporator "rises to 48 to 50.5 F, the evaporator mode of cooling is
        initiated", and the steam pressure valve is then positioned for "a coolant outlet
        temperature between 38 to 45 F". `actuation_k` is 49 F = 9.4 C = 282.55 K, the figure
        `vehicle.yaml#thermal.loops.loop_primary.evaporator_actuation_c` already carries from NR
        ch. 14 ("evaporator actuating above 49 F"), inside the AOH's 48-50.5 F. `outlet_setpoint_k`
        is 45 F = 7.2 C = 280.35 K, the top of the AOH's outlet band and the loop's declared mixed
        supply (`supply_c`). `capacity_w` is `components.evaporator_csm.rejection_w` (NR, about
        8,000 Btu/hr), copied for the rule and held equal by `tests/test_thermal_rules.py`
      note: >-
        searched once for ADR 0003 (2026-10-15): the activation setpoint is sourced, not chosen
  - id: evaporator_feed
    method: discrete
    node: internal
    unit: "map[vehicle,enum[on,off]]"
    initial: {csm: "on", lm: "off"}
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator. The CSM's glycol evaporator is fed at MET 0 so it actuates when
        the radiator's outlet passes 49 F, which the quiet-coast episode's sun-on-radiator hold
        (ADR 0003 item 9) makes it do at once: there the radiator alone cannot carry the load. In
        the default vehicle's passive thermal control it is fed and idle. The launch checklist's
        evaporator switch positions were not read. The LM's sublimator is off because the LM is unpowered cargo (09 §4)
    moved_by: ["command:set_evaporator_feed"]
    command_value:
      - verb: set_evaporator_feed
        argument: state
        key: vehicle
        why: "the feed is on or off per vehicle; `evaporator_duty_w` reads the CSM's element and spends no water while it is off"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:239"
  - id: coolant_pump
    method: discrete
    node: internal
    unit: "map[pump_id,enum[on,off]]"
    initial: {pump_1: "on", pump_2: "off", pump_lm: "off"}
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator. The primary loop runs on one pump (TN D-6718 p. 11, "the primary
        loop uses a centrifugal pump to circulate 200 lb/hr") and the second pump in the package is
        its standby; the LM's pump is off with the LM. The launch checklist's pump selection was
        not read
    moved_by: ["command:set_coolant_pump"]
    command_value:
      - verb: set_coolant_pump
        argument: state
        key: pump
        why: "one element per pump; `coolant_flow_kg_s` flows the published 200 lb/hr while a primary-loop pump is on and powered, and nothing otherwise"
    provenance:
      basis: chosen
      reason: "ADR 0003 item 4: the pump's state is on or off, and the loop's flow is a fraction of the published 200 lb/hr, not a speed"
  - id: radiator_bypass
    method: discrete
    node: internal
    unit: "map[loop_id,enum[radiator,bypass]]"
    initial: {loop_primary: radiator, loop_secondary: radiator}
    initial_provenance:
      basis: chosen
      reason: "chosen, pending operator: the loops flow through their radiators at MET 0; the launch checklist's valve positions were not read"
    moved_by: ["command:set_radiator_bypass"]
    command_value:
      - verb: set_radiator_bypass
        argument: state
        key: loop
        why: "one element per loop; at `bypass` the coolant does not pass through the panel, so the loop rejects nothing through it and the panel falls to its own sink"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:239"

# --------------------------------------------------------------------------------------
# Components.
# --------------------------------------------------------------------------------------
components:

  - id: loop_primary
    kind: flow
    class: loop
    vehicle: csm
    fluid: "62.5 % ethylene glycol / 37.5 % water"
    # The three figures below are one fluid, and until this round they lived in the *relations* of
    # two states: `coolant_loop_t` worked out "25 L of 62.5/37.5 glycol-water at 1,050 kg/m3 is
    # 26.25 kg" and `loop_transport_t` worked out "25 L at the published 200 lb/hr ... gives 1,042
    # s of transit", and nothing could read either. The density is the conversion between the two
    # flow figures the source publishes, and the mass is the density applied to the volume.
    #
    # Two flow units on purpose, and each is its own source's: `flow_l_min` is apollo's own
    # operating band (1.3-1.7 L/min) and `nominal_flow_lb_per_h` is TN D-6718's published primary
    # flow. The density is what makes them one quantity — 200 lb/hr is 1.43998 L/min at 1,050
    # kg/m3, which is inside the band — and `check_thermal_bindings` holds all three together.
    fluid_density_kg_m3: 1050
    nominal_flow_lb_per_h: 200
    coolant_mass_kg: 26.25
    flow_l_min: [1.3, 1.7]
    volume_l: 25
    provenance:
      basis: historical
      source: "TN D-6718 and NR ch.14 give the 200 lb/hr primary flow and the fluid; the volume is chosen — a 1-inch line 30 m long is 15 L, and a two-panel loop with coldplates is 15-30 L, with no published total coolant mass (only a 1 gal reservoir)"
  - id: loop_secondary
    kind: flow
    class: loop
    vehicle: csm
    fluid: "62.5 % ethylene glycol / 37.5 % water"
    # The same fluid, so the same density; the mass follows from it and the chosen volume. No
    # `nominal_flow_lb_per_h`: the secondary's band is scaled from the primary's and no source
    # publishes a flow for it, so the nominal is a figure the primary has and this loop does not.
    fluid_density_kg_m3: 1050
    coolant_mass_kg: 18.9
    flow_l_min: [1.0, 1.5]
    volume_l: 18
    provenance:
      basis: chosen
      reason: "apollo_diode.md:97 names two water-glycol loops with primary and secondary pumps; the secondary's figures are scaled from the primary because no source gives them"
  - id: loop_lm
    kind: flow
    class: loop
    vehicle: lm
    fluid: "65 % water / 35 % inhibited ethylene glycol"
    flow_l_min: [1.5, 1.9]
    volume_l: 11
    coolant_mass_kg: 11.3
    provenance:
      basis: historical
      source: "TN D-6724 and NR ch.6: LM loop 222 lb/hr minimum, about 25 lb of coolant, operating +29 to +120 F"
  # The three pumps are the one place in this domain where the electrical figures belong to
  # `domains/power/components.yaml#loads` — the power domain owns the load inventory, and the pump
  # and the load are one article seen from two sides. `power_load` is that link, declared rather
  # than inferred, and it has to be declared: the names differ at *both* levels — `pump_1` against
  # `csm_coolant_pump_1`, and `rated_w` here against `demand_w` there — so no rule could join them
  # from the strings. Until round 50 the only statement of the identity was the sentence in
  # `pump_1`'s own `reason`, which nothing read and which `pump_2` did not even carry, while both
  # figures sat in both files agreeing by luck. `pump_lm` names no load because the power inventory
  # has none: its 200 W are on no bus and in no per-vehicle total, which `check_pump_loads` reports.
  - id: pump_1
    kind: flow
    class: pump
    loop: loop_primary
    power_load: csm_coolant_pump_1
    rated_w: 250
    inrush_w: 420
    provenance:
      basis: chosen
      reason: "its electrical figures are the power domain's csm_coolant_pump_1; the mechanical side is what this domain owns"
  - id: pump_2
    kind: flow
    class: pump
    loop: loop_primary
    power_load: csm_coolant_pump_2
    rated_w: 250
    inrush_w: 420
    provenance:
      basis: chosen
      reason: "the redundant pump on the primary loop"
  - id: pump_lm
    kind: flow
    class: pump
    loop: loop_lm
    rated_w: 200
    inrush_w: 340
    provenance:
      basis: chosen
      reason: "the LM's single coolant pump; it has no redundancy, which is the LM's whole character"
  - id: radiator_csm
    kind: flow
    class: radiator
    vehicle: csm
    # The link to `vehicle.yaml#thermal.radiators`, declared rather than inferred because the two
    # files name one panel from opposite ends — `csm_radiator` against `radiator_csm` — so a rule
    # guessed from the string would have to know that the vehicle's name leads with the vehicle
    # and the domain's trails it. What it buys is `check_thermal_bindings`' second half: these two
    # panels are what the linter holds the vehicle-level entry against, rather than only the
    # `radiator_model` block the entry's *arithmetic* is derived into.
    vehicle_keys: [csm_radiator]
    panels: 2
    area_m2: 9.1
    provenance:
      basis: historical
      source: "NR and TN D-6718: two panels of about 49 sq ft each, about 4,415 Btu/hr per panel = 1,294 W"
  - id: evaporator_csm
    kind: flow
    class: evaporator
    vehicle: csm
    vehicle_keys: [csm_evaporator]
    rejection_w: 2345
    fluid: water
    provenance:
      basis: historical
      source: "NR: about 8,000 Btu/hr = 2,345 W"
  - id: sublimator_lm
    kind: flow
    class: evaporator
    vehicle: lm
    vehicle_keys: [lm_sublimator]
    rejection_w: 3649
    water_consumption_kg_per_h: 5.171
    provenance:
      basis: historical
      source: >-
        `lunar_module_environmental_control_subsystem.pdf` (LM ECS subsystem specification), PDF
        p. 88, "Item 209 SUBLIMATOR", Spec. no. SVHS 2405, the Variable Conditions table. Four
        columns, each with a coolant inlet temperature, a heat load and an evaporant flow:
        Startup and Suit Integ. — 86 F, **9,500 Btu/hr**, 0.15 lb/min; Low Load — 65 F, 5,860
        Btu/hr, 0.09 lb/min; a proof condition at 38 F, 1,845 Btu/hr, 0.02 lb/min; and **Max.
        Normal Heat Load — 100 F coolant inlet, 12,450 Btu/hr, 0.19 lb/min evaporant**. Constant
        conditions on the same page: 5.5 psia coolant inlet, 3.7 gpm, 400 microns Hg evaporant
        outlet, 6.2 psia evaporant inlet to the flow limiter, 81 F evaporant inlet (130 F at max
        normal heat load). Read from the rendered page: the text layer interleaves the header rows
        and drops the decimal points out of the flow column
      note: >-
        **this entry said the LM sublimator's capacity and water consumption are "NOT published in
        any source reached (TN D-6724, NR ch.6, A11, SP4029)" and named four documents that do not
        have them, while the LM's own ECS subsystem specification has both on one line of one
        table.** The capacity is the max normal heat load: 12,450 Btu/hr at 0.29307107 W per
        Btu/hr is 3,648.7 W, rounded to **3,649 W** as the CSM's 8,000 Btu/hr was rounded to 2,345.
        The water is the same row's 0.19 lb/min: 11.4 lb/hr is **5.171 kg/h**. The pair implies an
        effective latent heat of 1,092 Btu/lb = 2.540e6 J/kg, against the 2.45e6 J/kg the vehicle's
        own water-rejection cycle carries on `E-RAD-WATER` — and the 3.7 % difference is the
        *physics* rather than an error: that page explains that the sublimator runs in evaporative,
        sublimation or **mixed** mode depending on the heat flux, and the latent heat of
        sublimation (about 1,220 Btu/lb) is higher than that of vaporisation (about 1,050). So the
        LM's own figure is the one carried here and the cycle's constant is the CSM's
  - id: heater_bank_csm
    kind: flow
    class: heater
    rated_w: 300
    provenance:
      basis: chosen
      reason: "the power domain's csm_heaters load; the thermal side owns which zones it serves and under what limits"
  - id: heater_bank_lm
    kind: flow
    class: heater
    rated_w: 200
    provenance:
      basis: chosen
      reason: "as above, for the LM"
  - id: bypass_valve
    kind: discrete
    class: valve
    loop: loop_primary
    states: [radiator, bypass]
    provenance:
      basis: apollo
      ref: "apollo_diode.md:239"
      note: "apollo lists set_radiator_bypass as an operator control; a valve that routes the loop around the radiator is the only thermal actuator with a fast, large and reversible effect"

# --------------------------------------------------------------------------------------
# The radiator's physics, derived from the published rejection rather than asserted.
# --------------------------------------------------------------------------------------
radiator_model:

  law: "Q = epsilon * sigma * A_eff * T_rad^4  -  Q_absorbed"
  csm:
    area_geometric_m2: 9.1
    emissivity: 0.85
    effectiveness: 0.89
    area_effective_m2: 8.1
    radiating_temperature_k: 285
    rejection_w: 2588
    absorbed_environment_w: UNCONFIGURED
    provenance:
      basis: derived
      relation: >-
        epsilon = 0.85 is a standard white thermal-control coating; the published rejection of
        2 x 1,294 W at a 285 K radiating surface then implies an effective area of 8.1 m2
        against a geometric 9.1 m2, i.e. 89 % effectiveness, which is what fin efficiency and
        view-factor losses give on a real panel. The three figures that are published — area,
        per-panel rejection and inlet temperature — therefore determine the fourth, and the
        derivation closes on them instead of on a guessed emissivity.
      source: "NR and TN D-6718 for the area and rejection; the coating emissivity is standard, not vehicle-specific"
  environment:

    solar_flux_w_m2: 1361
    absorptivity: 0.2
    projected_area_m2: 9.1
    solar_load_w_at_bad_attitude: 2477
    lunar_ir_w_m2: UNCONFIGURED
    albedo_load_w: UNCONFIGURED
    provenance:
      basis: derived
      relation: >-
        1361 W/m2 x 0.2 absorptivity x 9.1 m2 of radiator presented to the sun = 2,477 W —
        comparable to the radiator's own 2,588 W rejection capacity. That is the whole reason
        `apollo_diode.md:341` lists "radiator isolation / poor attitude" as a failure chain:
        attitude alone can cancel the radiator. The lunar surface terms are declared unset
        because the surface-phase geometry is not yet parameterised.
  note: >-
    This is the block that makes F-13 a physics chain rather than a scripted event, and it is
    also why the thermal domain reads `structure_config`: a staging event permanently changes
    the radiating area and its view of the sun (apollo_diode.md:343).

    # --------------------------------------------------------------------------------------
    # Zones. `thermal_diode.md:131` requires paired heat/cool thresholds with a minimum dwell for
    # any regulated zone, and `:765-772` requires that a zone at a hard limit is not commanded
    # further in the same direction.
    # --------------------------------------------------------------------------------------
zones:

  - id: csm_cabin
    vehicle: csm
    volume_m3: 5.9
    # The same four links the vehicle-level zone carries, so the zone join compares them: a zone
    # whose model is described differently in the two files is two compartments wearing one name.
    cooled_by: loop_primary
    temperature_state: zone_csm_cabin_t
    heat_state: cabin_heat_csm_w
    equilibrium_state: cabin_eq_csm_k
    # The cabin's nominal state, mirrored so that the zone join compares it. `vehicle.yaml` is the
    # authority for both — the pressure is in psia because that is the unit NR publishes it in, and
    # the two edges that differentiate the ideal-gas law convert it.
    nominal_pressure_psia: 5
    nominal_temperature_k: 295
    regulated: true
    source: heater_bank_csm
    provenance:
      basis: historical
      source: "NR: CSM cabin 210 cu ft habitable = 5.9 m3 at 5 psia"
  - id: csm_avionics_bay
    vehicle: csm
    regulated: true
    source: heater_bank_csm
    provenance:
      basis: apollo
      ref: "apollo_diode.md:105"
      note: "avionics_plate_c with a >50 C event"
  - id: csm_service_bay
    vehicle: csm
    regulated: false
    provenance:
      basis: chosen
      reason: "unregulated; it matters through the propellant and pressurant it contains"
  - id: lm_cabin
    vehicle: lm
    volume_m3: 6.7
    cooled_by: loop_lm
    temperature_state: zone_lm_cabin_t
    heat_state: cabin_heat_lm_w
    equilibrium_state: cabin_eq_lm_k
    nominal_pressure_psia: 5
    nominal_temperature_k: 295
    regulated: true
    source: heater_bank_lm
    provenance:
      basis: historical
      source: "NR: LM cabin 235 cu ft pressurised = 6.7 m3"
  - id: lm_descent_bay
    vehicle: lm
    regulated: false
    provenance:
      basis: chosen
      reason: "exposed and unregulated; the frozen-line chain lives here"
  - id: radiator_loop
    vehicle: csm
    regulated: false
    provenance:
      basis: chosen
      reason: "an observable with no command interface"

load_budget:

  note: >-
    The thermal domain's heat inputs are the power domain's loads: every watt an agent
    switches on becomes a watt this domain has to reject, and the split between what leaves
    through the radiator and what leaves through the evaporator is the vehicle's thermal
    budget. The numbers live in `domains/power/components.yaml#loads` and are not duplicated
    here, because two copies of one figure is how a vehicle changes mass between two files.
  csm_rejection_capacity_w: 4933
  lm_rejection_capacity_w: 3649
  rejection_capacity_provenance:
    basis: derived
    relation: >-
      2,588 W of radiator plus 2,345 W of evaporator for the CSM = **4,933 W**, against a 1,723 W
      CSM demand — so the CSM has a comfortable nominal margin and no margin at all if the radiator
      is sunlit and the evaporator is dry. The LM's sublimator is **3,649 W** on its own, against a
      1,007 W LM demand
    note: >-
      **this was one number, `total_rejection_capacity_w`, and it summed both vehicles.** The
      demands beside it were already split (`csm_total_demand_w` and `lm_total_demand_w`), so the
      block argued a CSM margin from a total that included the LM's sublimator the moment that
      capacity was published — a two-vehicle number under a one-vehicle sentence. The parts are now
      held to the total *of their own vehicle*, and a part that declares no `vehicle` is refused
      rather than added to whichever total is nearest

# --------------------------------------------------------------------------------------
# What this domain still owes, and the one item that blocks the cabins.
# --------------------------------------------------------------------------------------
open_debts:
  - "**The loop collects its nodes' heat, not what they hand it.** `loop_primary_load_w` sums the
    zones' raw heat rates while `zone_csm_avionics_t` and `zone_csm_service_t` each shed
    `G * f * (T - T_coolant)` into the coolant. At equilibrium the two are the same number; in a
    transient (a pump stopped or started, a load stepped, a node displaced) the difference is heat
    the loop gains that the node still holds, or loses that the node already gave up: about 490 W
    per 10 K of service-bay displacement (Codex review of PR #49). The coldplate's half predates
    PR #49. Owned by the thermal lane's space-sink follow-up, which takes the service bay off the
    loop and gives the coldplate one transfer state that both the plate and the loop read, held by
    a pump off/on energy-balance test."

  - "**The loop has no heat balance, and two published temperatures are waiting on it.** `thermal.coolant_return_c` and `thermal.radiator_inlet_c` both read `coolant_loop_t` — the *supply* state — and until round 34 both were prose rows that would have published the supply under their own names: **radiator inlet minus supply is the vehicle's heat load** in one subtraction, and a subtraction of a number from itself is zero. (This sentence said *return minus supply* until round 37, and the station it named was the wrong one: the vehicle's return is the glycol coming back from the radiator, which the study guide's p. 74 mixes up to 45 F at the evaporator inlet — not the line leaving the coldplates, which is the radiator inlet and is published 16 K higher.) The rise is `load_w / (mass_flow_kg_s * c_p_j_per_kg_k)`, the drop is `rejection_w / (mass_flow_kg_s * c_p_j_per_kg_k)`, and two of those terms are declared nowhere: the fluid is named in `vehicle.yaml#thermal.loops` (62.5 % ethylene glycol / 37.5 % water) but its specific heat is prose inside `coolant_loop_t`'s relation ('about 3,600 J/kg-K'), and the loop's own collected load **was** a sum over this domain's `heat_inputs` that nothing evaluated — `loop_primary_load_w` and `loop_lm_load_w` are those sums now, held against the zones that name each loop — and the specific heat **was** prose inside `coolant_loop_t`'s relation, which now cites the loop's own derived 3,626.1 J/kg-K (TN D-6718's published load, flow and rise over `Q = m_dot * c_p * dT`). So one of the two channels below is arithmetic — `thermal.radiator_inlet_c` is `supply + load_w / (m_dot * c_p)` and the frame publishes it — and what remains owed is the **radiator's drop**, the other half of the loop: `thermal.coolant_return_c` is `radiator_inlet_c - rejection_w / (m_dot * c_p)` and `radiator_rejection_w` is a state whose rule (epsilon x sigma x A x T^4 minus the absorbed environmental load) is still domain code. **The bands to hit are declared**, which is what makes this a debt rather than a search: `radiator_inlet_c: [22.8, 23.9]` for the loads' return and `radiator_outlet_c: [5, 15]` for the radiator's, both on `loop_primary`. What would close it: one `specific_heat_j_per_kg_k` field on the loop, and one state holding the loop's collected load — and the same two terms are what `thermal.radiator_rejection_w` needs."

  - "**The compartment each load heats WAS declared nowhere, and is now declared above.**
    `heat_inputs` gives every load a zone and the partition closes: 1,723 W of CSM load and
    1,007 W of LM load, matching `domains/power/components.yaml`'s per-vehicle totals exactly, which
    is what `check_thermal_heat_inputs` holds it to. What remains owed from that work is the
    *edges*: the mapping is data and the graph still has no heat-rate node for it to flow through,
    which is the second debt below. The original finding, kept because it is the reason the block
    exists: `load_budget` above states the
    relationship correctly — the heat inputs are `domains/power/components.yaml#loads`, and the
    numbers are not duplicated here — but a load carries `bus`, `class`, `demand_w`, `inrush_w` and
    `vehicle`, and **no field says which zone its watts warm**. There are 25 loads and 6 zones, and
    until the assignment exists there is nothing to draw a heat-input edge from. The consequence is
    not abstract: `zone_csm_cabin_t` and `zone_lm_cabin_t` are `lag` states with the same 2,880 s
    time constant `a 1 kW cabin load` produced, and **neither node has an edge into it**, so neither
    can be advanced — the cabin's temperature has no heat source anywhere in the graph while the
    crew, the equipment and the loop all warm it in the prose. `check_vehicle` now reports the
    undriven nodes by name. The check also found three nodes that looked the same and are not:
    `o2_lm`, `prop_rcs` and `pressurant_he` have no inbound edge because they are filled at the pad
    and never again, which they say in `preloaded:`, so the check exempts a declared one."

  - "**The cabin's second driver is now expressed, and not by the `lag`.** A cabin's equilibrium is
    the coolant supply plus its own heat rise, and a `lag` pulls its state toward a single driver, so
    the two inputs are combined *upstream* of the relaxation instead: `cabin_eq_csm_k` and
    `cabin_eq_lm_k` are algebraic states whose every term is declared elsewhere, and the cabins relax
    toward them. This closes the 8 K error the previous round introduced when the cabin relaxed
    toward `Q/G` absolute — the offset is back, and it is a node rather than a hoped-for method.
    These are the vehicle's first states whose rule is completely specified: nothing in either is
    owed, and `check_cabin_equilibrium` re-derives them against the four declarations they rest on."

# --------------------------------------------------------------------------------------
# Which loads heat which zone.
#
# This is the assignment `load_budget` says is missing and `open_debts` names. It lives *here*
# rather than as a `zone:` field on each power load for the reason `heater_bank_csm`'s own
# provenance already gives: the electrical figures are the power domain's and **the thermal side
# owns which zones a source serves**. Putting a zone on the load would be a second declaration of
# one fact, in the file that explicitly refuses to duplicate the numbers.
#
# The assignment is `chosen` where the corpus does not state it — it gives the equipment, never
# its compartment — and the rule is the zones' own definitions: crew-accessible equipment heats
# the crewed compartment, guidance and instrumentation heat the bay that carries the avionics
# plate, and everything on an uncrewed stage heats that stage. Apollo's own arrangement is the
# basis for the split, and the alternative considered was a single lumped vehicle heat input,
# which would have made a warm cabin and a warm service bay the same observation.
# --------------------------------------------------------------------------------------
heat_inputs:

  csm_cabin:
    # No `rate:` here any more: it existed so the check could look the heat state up by node name
    # (`cabin_heat_{rate}`), which is how it skipped four zones in silence. The zone declares
    # `heat_state` now, so the field that stood in for the link is gone with the convention.
    loads: [csm_cabin_fan, csm_suit_fan, csm_co2_scrubber, csm_lighting,
            csm_sband_transceiver, csm_sband_power_amplifier, csm_heaters]
    note: >-
      the crewed compartment, and it holds the comms transceiver and amplifier as well as the ECS
      equipment: Apollo's S-band equipment was inside the command module rather than on the stage.
      `csm_heaters` is the cabin side of a 300 W bank that serves two zones — `heater_bank_csm`'s
      `source:` on both this zone and the avionics bay is the declaration that it is shared
  csm_avionics_bay:
    loads: [csm_imu, csm_guidance_computer, csm_instrumentation]
    note: >-
      the bay whose >50 C event is the zone's whole limit. The IMU, the guidance computer and the
      instrumentation are what the avionics plate carries, and the discrepancy between their 360 W
      of demand and the plate's own temperature is the point of the zone
  csm_service_bay:
    loads: [csm_coolant_pump_1, csm_coolant_pump_2, csm_rcs_heaters, csm_comm_heaters]
    note: >-
      uncrewed, and unregulated because nothing in it has a limit — what matters is the propellant
      and pressurant it contains, which is where the frozen-line chain lives. The coolant pumps are
      the largest pair of loads on the vehicle and they sit here rather than in the cabin: the
      primary loop's pumps are on the service module
  lm_cabin:
    loads: [lm_cabin_fan, lm_suit_fan, lm_co2_scrubber, lm_lighting, lm_sband_transmitter,
            lm_sband_high_power, lm_guidance_computer, lm_instrumentation, lm_heaters]
    note: >-
      the LM's crewed compartment, and it carries more than the CSM's because the LM has no
      avionics-bay zone: the guidance computer and the instrumentation are inside the cabin the
      crew fly in, which is why the LM's cabin is the warmer of the two by design
  lm_descent_bay:
    loads: [lm_landing_radar, lm_rcs_heaters]
    note: >-
      the descent stage, exposed and unregulated. The landing radar is mounted on it and the RCS
      quads are its own, so both heat the stage the crew leave behind at staging

unheated:
  radiator_loop:
    why: >-
      the radiator is an *observable* with no command interface (simulator-design.md:158), not a
      compartment: nothing is installed in it and no load heats it. It is listed here rather than
      left out so that the check can tell "nothing heats it, deliberately" from "nothing heats it,
      nobody said"
