# domains/thermal/components.yaml — the thermal control subsystem, and the parameters nobody
# would give us.
#
# ## The debt this file exists to pay
#
# `thermal_diode.md:965` is explicit: with no standalone TCS predecessor, "prior TCS-specific
# values — temperature limits, heater ratings, radiator sizing, thermal-zone definitions,
# sensor accuracies, sampling rates, pump characteristics, valve timings, thermal-control
# algorithms and TCS command IDs — are **UNSPECIFIED**. This report does not infer them from
# the communications, propulsion, GNC, ECLSS or power specifications." `corpus-review.md` §6
# named the consequence: `thermal`'s own equation has `C_i` and `Q` terms with no way to
# populate them.
#
# So the parameters below are **derived** wherever a published geometry plus a standard
# material property determines them, and `chosen` only where a lumped value has to be picked.
# Every derivation states its relation, so the linter can re-derive it and disagree, and every
# chosen value states its reason. Two of them are worth reading because they are the whole
# reason the thermal domain is interesting:
#
#   * **The transport delay.** 25 litres of coolant at the published 200 lb/hr takes 17
#     minutes to go round the loop. That delay is what separates "the pump stalled just now"
#     from "the pump has been degrading for an hour" (`review-findings.md` #12), and a lumped
#     RC network cannot express it at all. It is modelled as a tick-indexed ring, not as a
#     chain of small nodes, so no node has a residence time below dt.
#   * **The environment is a heat source with a geometry.** At the published radiator area, a
#     solar-illuminated radiator absorbs about 2.5 kW — comparable to its own rejection
#     capacity. That is why `apollo_diode.md:341` lists "radiator isolation / poor attitude"
#     as a failure chain, and why attitude is a thermal command surface rather than only a
#     pointing one.

domain: thermal

# The fastest thermal constant here is about four minutes, so integrating at 50 Hz is 12,000
# ticks per time constant. Declared honestly as 1 Hz rather than as the rate the scheduler
# currently uses: the declaration is what makes the multi-rate optimisation a scheduler change
# rather than a rewrite (plant.md §10).
natural_rate_hz: 1

# `command_executive` is the last entry and it arrived with `E-CMD-PUMP`: the pump is commanded
# rather than driven by a voltage, and until the edge existed this domain's pump states had no path
# from the executive. `check_domain_reads` is what forced the declaration — the edge is the graph's
# half and this list is the domain's, and the two are held equal.
#
# `load_shed_state` arrived with ADR 0003: power's `load_enabled` (one position per load, moved by
# `set_load`) lives there, and the zone heat rates are sums over the loads it has on. No edge
# carries it, because a command lands at step 1 before any node walks, so the value read is this
# tick's whatever the schedule; the linter counts the read as declared-without-an-edge.
reads: [fuel_cell, bus_a, bus_b, avionics_compute, link, instrumentation, rcs_thrust,
        structure_config, water_cooling, command_executive, load_shed_state]
writes: [coolant_flow, coolant_supply_t, coldplate_t, radiator_eq, radiator_reject, loop_transport,
         cabin_zone_t, lm_cabin_zone_t, cabin_heat_csm, cabin_heat_lm, cabin_eq_csm,
         cabin_eq_lm, environment_heat, service_bay_heat, descent_bay_heat,
         service_bay_zone_t, descent_bay_zone_t]

# --------------------------------------------------------------------------------------
# State. Thermal has no conserved stocks on purpose: energy is not asserted here. A fuel cell
# has exact stoichiometric mass ratios and a float efficiency, so mass conserves exactly and
# heat gets a tolerance band and a trend, never an assertion (review-findings.md #14). A
# universal conservation assertion applied to a thermal margin is a category error
# (simulator-design.md:248).
# --------------------------------------------------------------------------------------
# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [heater_bank_duty, coolant_pump, evaporator_feed, radiator_bypass, comm_amp_t,
                 avionics_bay_heat_w, loop_primary_load_w, loop_lm_load_w]
internal_order_note: >-
  the heater is a decision and the amplifier's temperature is what the decision is about;
  nothing on this sentinel feeds the other within a tick, and the order says which is read
  first when a rule eventually reads both. The avionics bay's heat rate is here and not on a
  coupling node for the reason its own entry gives: a heat rate is the wrong thing to land on a
  lag's node, and the figure's reader is the loop's collected load rather than a temperature. The
  two loop loads are last and after the zone heat rates they sum: nothing on the sentinel feeds
  another within a tick, and the order says which is read first when a rule eventually reads both.

state:
  - id: cabin_heat_csm_w
    node: cabin_heat_csm
    method: algebraic
    unit: W
    total_w: 733
    # The rule (`domains/thermal/rules.py`) sums these over the loads `power.load_enabled` has on,
    # this tick. Each figure is the power inventory's `demand_w`, copied so the rule can read it
    # (a rule reads only its own state's declaration); `tests/test_thermal_rules.py` holds every
    # entry equal to `domains/power/components.yaml#loads.<id>.demand_w` and the key set equal to
    # `heat_inputs.csm_cabin`, so the copy cannot drift. `total_w` is the same sum with every load
    # on, which `check_thermal_heat_inputs` still holds against the inventory.
    heat_loads_w: {csm_cabin_fan: 60, csm_suit_fan: 85, csm_co2_scrubber: 80, csm_lighting: 100,
                   csm_sband_transceiver: 36, csm_sband_power_amplifier: 72, csm_heaters: 300}
    # One load is not its nameplate. The power amplifier is the heat it actually dissipates, comms' `amp_dissipation_w`: 72 W of dc in less 11.2 W of RF that leaves the
    # vehicle while the transmitter is on, and nothing while it is off (ADR 0003 item 5).
    dissipation_loads: {csm_sband_power_amplifier: amp_dissipation_w}
    provenance:
      basis: derived
      relation: >-
        the sum of the `demand_w` of the seven loads `heat_inputs.csm_cabin` assigns to this zone:
        cabin fan 60, suit fan 85, CO2 scrubber 80, lighting 100, S-band transceiver 36, S-band
        power amplifier 72, and the cabin's share of the 300 W heater bank. Algebraic rather than a
        stock because the rate follows which loads are on rather than accumulating — a load that is
        shed stops heating in the same tick
      note: >-
        the number is not invented here and is not duplicated: it is the load inventory's, summed.
        `check_thermal_heat_inputs` re-derives it against `heat_inputs` on every run, so a load
        re-rated in `domains/power/` and not here is refused rather than silently changing how warm
        the cabin gets
  - id: cabin_heat_lm_w
    node: cabin_heat_lm
    method: algebraic
    unit: W
    total_w: 827
    # As `cabin_heat_csm_w`: summed over the enabled loads.
    heat_loads_w: {lm_cabin_fan: 62, lm_suit_fan: 85, lm_co2_scrubber: 80, lm_lighting: 40,
                   lm_sband_transmitter: 20, lm_sband_high_power: 90, lm_guidance_computer: 150,
                   lm_instrumentation: 100, lm_heaters: 200}
    dissipation_loads: {}
    provenance:
      basis: derived
      relation: >-
        as the CSM's, over the nine loads `heat_inputs.lm_cabin` assigns: cabin fan 62, suit fan 85,
        CO2 scrubber 80, lighting 40, S-band transmitter 20, S-band high-power amplifier 90,
        guidance computer 150, instrumentation 100, and the cabin's share of the 200 W heater bank.
        827 W against the CSM cabin's 733, with two crew against three, because the LM has no
        avionics-bay zone and its guidance equipment is inside the compartment
  - id: cabin_eq_csm_k
    node: cabin_eq_csm
    method: algebraic
    unit: K
    total_k: 286.21
    # The rule is `coolant_loop_t + cabin_heat_csm_w / conductance_w_per_k`, this tick: the supply
    # the loop actually holds and the heat the enabled loads actually make. `total_k` stays the
    # design point (the declared 7.2 C supply, every load on) that `check_cabin_equilibrium` holds.
    # The conductance is `zone_csm_cabin_t`'s, copied for the rule; the thermal rules test holds the
    # two equal.
    heat_state: cabin_heat_csm_w
    supply_state: coolant_loop_t
    conductance_w_per_k: 125
    provenance:
      basis: derived
      relation: >-
        the equilibrium the cabin relaxes toward: the loop's mixed supply plus the rise the
        compartment's own equipment causes. Every term is declared elsewhere — the supply is
        `vehicle.yaml#thermal.loops.loop_primary.supply_c` and its own source gives 45 F = 7.2 C, the
        733 W is `cabin_heat_csm_w` summed from the power domain's load inventory, and the 125 W/K is
        `zone_csm_cabin_t`'s conductance. 7.2 C is 280.35 K and 733/125 = 5.864 K
      note: >-
        this is the vehicle's first state whose rule is **completely specified**: nothing in it is
        owed, and `check_cabin_equilibrium` re-derives it against the four declarations it rests on.
        It is algebraic rather than a stock because the equilibrium is a function of the current heat
        rate and supply, not an accumulation
  - id: cabin_eq_lm_k
    node: cabin_eq_lm
    method: algebraic
    unit: K
    total_k: 286.97
    # As `cabin_eq_csm_k`, except the supply. The LM loop has no temperature state (the LM is
    # unpowered cargo in this episode), so its supply is the loop's declared `supply_c`, 7.2 C =
    # 280.35 K (`vehicle.yaml#thermal.loops.loop_lm.supply_c`, itself `chosen`).
    heat_state: cabin_heat_lm_w
    supply_k: 280.35
    conductance_w_per_k: 125
    provenance:
      basis: derived
      relation: >-
        as the CSM's, over the LM cabin's larger heat load: 827 W over the same 125 W/K conductance is
        6.616 K above the same 280.35 K supply. The two cabins differ by 0.75 K at equilibrium, and
        the whole of that difference is the 94 W between their equipment
  - id: environment_heat_w
    node: environment_heat
    # **A declared boundary the run holds (ADR 0003 item 9, John 2026-10-15: "Hold in episode
    # only").** `dynamics` with `dX/dt = 0`: the rule returns the value it carries
    # (`domains/thermal/rules.py:_environment_hold`), so the absorbed load is whatever the run
    # started with, a checkpoint restores it whole, and no command moves it. `dynamics` rather than
    # `algebraic` for the reason `evaporator_duty_w` gives: a state that reads its own last value
    # needs a seeded starting one, and the plant seeds `dynamics` states. The default vehicle starts
    # in rotating flight (passive thermal control) at `initial`; the quiet-coast episode's
    # `scenarios/quiet_coast.yaml` replaces it with the sun-on-radiator hold, `sun_hold_w`.
    method: dynamics
    unit: W
    initial: 1086.9
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, bounded by the flown PTC coast rejection 1,170–1,470 W and radiator outlet ≤ 283 K
        (SP-368 p.525); operator decision 2026-10-15 'Hold in episode only'. The passive-thermal-
        control absorbed load was searched for once (AOH SM2A-03 §2.7 ECS, the Apollo mission
        reports, SP-368 p. 525) and not found as a figure. It is the value that puts the MET-0
        operating point at an equilibrium with the radiator alone carrying the loop: the supply at
        280.35 K (`coolant_loop_t.initial`), the collected load Q = 1,651 W
        (`loop_primary_load_w` at MET 0) and the published flow, m_dot c_p = 0.0251996 x 3,626.1 =
        91.376 W/K, put the radiator inlet at 280.35 + 1,651 / 91.376 = 298.418 K and the panel's
        mean glycol temperature, where it rejects all of Q, at T_m = 280.35 + Q / (2 m_dot c_p) =
        289.384 K. The absorbed load is then eps sigma A T_m^4 - Q = 0.85 x 5.670374419e-8 x 8.1 x
        289.384^4 - 1,651 = 1,086.88 W, rounded to 1,086.9 W. The radiator's outlet is then the
        280.35 K supply (7.2 C), inside Apollo's 5–15 C `radiator_outlet_c` band and under the
        283 K ceiling, and the evaporator's inlet sits below its 282.55 K actuation, so it spends no
        water in coast, as flown. The panel's 1,651 W is above the flown 1,170–1,470 W because the
        model's collected load is (the load inventory's, not the environment's); the absorbed load
        is 44 % of the hot hold, the share a rolling vehicle presents against a panel held normal to
        the sun. `tests/test_quiet_coast_scenario.py` holds this derivation and the outlet band
    initial_note: >-
      what would replace the choice: a published passive-thermal-control absorbed (or net) radiator
      load for the CSM in translunar coast — TN D-6718's radiator analysis is the first place to look
    sun_hold_w: 2477.0
    provenance:
      basis: derived
      computes: sun_hold_w
      derivation:
        expression: "solar_flux_w_m2 * absorptivity * projected_area_m2"
        inputs:
          solar_flux_w_m2: domains/thermal/components.yaml:radiator_model.environment.solar_flux_w_m2
          absorptivity: domains/thermal/components.yaml:radiator_model.environment.absorptivity
          projected_area_m2: domains/thermal/components.yaml:radiator_model.environment.projected_area_m2
      relation: >-
        the absorbed solar load at a bad attitude, the quiet-coast episode's declared hot hold
        (`scenarios/quiet_coast.yaml`, ADR 0003 item 9): 1361 W/m2 of flux, 0.2 absorptivity on a
        white thermal-control coating, and 9.1 m2 of radiator presented to the sun. 1,361 x 0.2 x 9.1
        = **2,477 W**, against the radiator's own 2,588 W of rejection capacity. It is the *first*
        term of the thermal balance, which is why its absence left the radiator's temperature a
        function of nothing
      note: >-
        the lunar surface terms — `lunar_ir_w_m2` and `albedo_load_w` — are still `UNCONFIGURED` in
        `radiator_model.environment`, and they are owed *here* now: the node exists, so a value that
        lands there has an edge to travel down rather than a block no tool reads
  - id: service_bay_heat_w
    node: service_bay_heat
    method: algebraic
    unit: W
    total_w: 630.0
    # As `cabin_heat_csm_w`: summed over the enabled loads.
    heat_loads_w: {csm_coolant_pump_1: 250, csm_coolant_pump_2: 250, csm_rcs_heaters: 80,
                   csm_comm_heaters: 50}
    dissipation_loads: {}
    provenance:
      basis: derived
      relation: >-
        the sum of the `demand_w` of the four loads `heat_inputs.csm_service_bay` assigns: coolant
        pump 1 at 250, pump 2 at 250, the RCS heaters at 80 and the comm heaters at 50. Algebraic
        because the rate follows which loads are on rather than accumulating
  - id: descent_bay_heat_w
    node: descent_bay_heat
    method: algebraic
    unit: W
    total_w: 180.0
    # As `cabin_heat_csm_w`: summed over the enabled loads.
    heat_loads_w: {lm_landing_radar: 120, lm_rcs_heaters: 60}
    dissipation_loads: {}
    provenance:
      basis: derived
      relation: "the landing radar at 120 W and the descent stage's RCS heaters at 60, which is all `heat_inputs.lm_descent_bay` assigns"
  - id: avionics_bay_heat_w
    node: internal
    method: algebraic
    unit: W
    total_w: 360
    # As `cabin_heat_csm_w`: summed over the enabled loads.
    heat_loads_w: {csm_imu: 90, csm_guidance_computer: 150, csm_instrumentation: 120}
    dissipation_loads: {}
    provenance:
      basis: derived
      relation: >-
        the sum of the `demand_w` of the three loads `heat_inputs.csm_avionics_bay` assigns: the IMU,
        the guidance computer and the instrumentation, 360 W. Algebraic because the rate follows
        which loads are on rather than accumulating — a load that is shed stops heating in the same
        tick
      note: >-
        **the fifth heat rate, and the one the zone's own debt named.** `csm_avionics_bay` was the
        only heated zone with no state carrying its load, which left the loop's collected load —
        a sum over `heat_inputs` — short its avionics term, and left `E-PLATE-CRITICAL`'s 360 W
        somewhere in the prose of four files.

        **On the sentinel rather than a coupling node, and that is a decision rather than a
        shortcut.** The bay's temperature is `zone_csm_avionics_t`, whose node is `coldplate_t` and
        whose driver is `E-STRUCT-PLATE` — a temperature per configuration. A heat-rate edge landing
        on that node would have to be denominated in K per W to be integrable, and the plant's
        canonical-driver rule (first contributor by id, `plant.md` §6) would make it the lag's
        driver, relaxing a kelvin state toward a watt. The cabins' idiom — an equilibrium state
        between the heat and the sink — is the shape that would avoid it, and the sink here is the
        *configuration's* plate temperature, which arrives as an edge sensitivity rather than as a
        state, so the equilibrium cannot be derived until that lookup lands. Until then this state's
        reader is the loop's collected load, and putting it on the sentinel says so: no edge can
        reach the sentinel, so nothing here is pretending to drive a temperature.
  - id: loop_primary_load_w
    node: internal
    method: algebraic
    unit: W
    total_w: 1723
    # The rule sums these zone heat rates *this tick*; `total_w` is the same sum with every load
    # on, which `check_thermal_heat_inputs` holds against the zones that name `loop_primary`.
    zone_heat_states: [cabin_heat_csm_w, service_bay_heat_w, avionics_bay_heat_w]
    provenance:
      basis: derived
      relation: >-
        **the loop's collected load, which the domain's own debt said was "a sum over `heat_inputs`
        that nothing evaluates".** It is the sum of the three zone heat rates whose zones name
        `loop_primary` in `vehicle.yaml#thermal.zones[*].cooled_by` — the cabin's 733 W, the service
        bay's 630 and the avionics bay's 360 — which is the CSM's whole declared demand, 1,723 W,
        because on this vehicle the three CSM zones are all served by the one loop. The zones are
        the declaration rather than the list: `check_thermal_heat_inputs` re-derives this sum from
        `cooled_by`, so a zone moved to another loop moves this figure rather than disagreeing with
        it
      note: >-
        **the numerator the heat balance was missing.** `radiator_inlet_c - supply_c` is the
        vehicle's heat load in one subtraction and `load_w / (mass_flow_kg_s * c_p)` is the rise;
        the flow is a published reading and this is the load, so what remains owed for the two
        coolant temperature channels is one specific heat — see `open_debts`
  - id: zone_csm_cabin_t
    method: lag
    node: cabin_zone_t
    unit: K
    initial: 295
    initial_source: vehicle.yaml:thermal.zones.csm_cabin.nominal_temperature_k
    tau_s: 2880
    lumped_mass_kg: 400
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 125
    provenance:
      basis: derived
      computes: tau_s
      derivation:
        expression: lumped_mass_kg * specific_heat_j_per_kg_k / conductance_w_per_k
        inputs:
          lumped_mass_kg: domains/thermal/components.yaml:state.zone_csm_cabin_t.lumped_mass_kg
          specific_heat_j_per_kg_k: domains/thermal/components.yaml:state.zone_csm_cabin_t.specific_heat_j_per_kg_k
          conductance_w_per_k: domains/thermal/components.yaml:state.zone_csm_cabin_t.conductance_w_per_k
      relation: >-
        C/G, and every term of it is a field on this state now. C = 400 kg aluminium-equivalent x
        900 J/kg-K = 360,000 J/K; G = 125 W/K, sized so a 1 kW cabin load sits about 8 K above the
        coolant supply, which is the order apollo's cabin-to-coolant difference implies.
        360,000/125 = 2,880 s
      note: "the cabin air alone is 2.4 kg (5.9 m3 at 5 psia and 295 K) and would have a thermal mass of 1,724 J/K, 0.5 % of the lumped value — which is why a bare-air cabin model has a time constant of seconds and is wrong. The structure, the equipment and the ECS water are the mass."
  - id: zone_csm_avionics_t
    # **A heat balance rather than a lag (ADR 0003 items 10-11).** The plate has two inputs, the
    # avionics bay's heat and the coolant reaching it, and a `lag` relaxes toward one driver; its
    # rule is `C dT/dt = Q_bay - G * f * (T - T_coolant)`, explicit, where `f` is the loop's flow as
    # a fraction of the published 200 lb/hr (no flow, no coolant through the plate) and
    # `T_coolant` is `loop_transport_t`, the coolant `E-TRANSPORT-PLATE` already carries here.
    method: dynamics
    node: coldplate_t
    unit: K
    initial: 283.35
    initial_provenance:
      basis: derived
      relation: >-
        the plate's own equilibrium at MET 0 (ADR 0003 item 10, the `zone_radiator_t` idiom): the
        coolant at 280.35 K (`loop_transport_t.initial`) plus the 360 W of the three avionics-bay
        loads, all on at MET 0, over the chosen 120 W/K: 280.35 + 360/120 = 283.35 K (10.2 C).
        `tests/test_thermal_rules.py` holds it as the rule's fixed point. No source gives a
        launch-day coldplate temperature (`docs/evidence/wp02-thermal-eclss-consumables.md` T1)
    heat_state: avionics_bay_heat_w
    coolant_state: loop_transport_t
    flow_state: coolant_flow_kg_s
    rated_flow_kg_s: 0.025199576111111112
    lumped_mass_kg: 60
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 120
    provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11. No source reached gives a coldplate node capacity or a plate-to-coolant
        conductance (T1). C = 60 kg aluminium-equivalent x 900 J/kg-K = 54,000 J/K is the capacity
        this state already carried, kept. G = 120 W/K replaces the 133 W/K it carried: at 133 the
        plate sat 360/133 = 2.7 K above 7.2 C coolant, at 9.9 C, outside the apollo band
        `thermal.avionics_plate_c` declares ([10, 45] C, `range_kind: band`), so the band bounds G
        at 360/2.8 = 128.6 W/K and 120 is a round value under it (plate 10.2 C at MET 0). The
        constraint ADR 0003 item 11 sets is the flown coast rejection of 1,170-1,470 W (SP-368 p.
        525). The steady rejection equals the collected load whatever C and G are, so the aggregate
        cannot move them; what bounds them is the temperature they imply, inside the band and far
        under the 50 C alarm (`avionics_plate_high`). C/G = 450 s is the time constant (the episode
        design, 09 §2, was sized on about 400 s). The candidate source is the one
        `zone_csm_service_t` audits (TIR 580-S-7159, index only): the coldplate node capacity and
        plate-to-coolant conductance are what it would have to supply
      bound: "G in (0, 128.6] W/K: the steady plate rise Q_bay/G must hold the plate inside the [10, 45] C band over 7.2 C coolant; C/G = 450 s; only the transient depends on C"
    rated_flow_provenance:
      basis: derived
      relation: "200 lb/hr x 0.45359237 / 3600 = 0.0252 kg/s, `vehicle.yaml#thermal.loops.loop_primary.nominal_flow_lb_per_h`; the same figure `coolant_flow_kg_s.initial` derives"
    note: "apollo_diode.md:97: electronics were directly cooled by coldplates, so the coldplate and its boxes are one lump"
  - id: zone_csm_service_t
    # **A heat balance on the loop, as the coldplate (ADR 0003 items 10-11).** It was a `lag` driven
    # by `E-BAY-HEAT-CSM` in K per W, which relaxes toward `Q x tau / (m x c_p)` measured from 0 K:
    # with the tonnes of propellant and structure its old reason named, 630 W put the bay near 1 K,
    # and only a mass of about 17 kg would have put it inside its own band. The bay's heat is part
    # of `loop_primary_load_w` (it names `loop_primary` in `cooled_by`), so its sink is the coolant:
    # `C dT/dt = Q_bay - G * f * (T - T_coolant)`, with `f` the loop's flow as a fraction of the
    # published 200 lb/hr and `T_coolant` the loop's supply, `coolant_loop_t`. The supply is read as
    # the schedule leaves it (this tick's or the last), an explicit Euler step like the loop's own.
    method: dynamics
    node: service_bay_zone_t
    unit: K
    initial: 293.15
    initial_provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11: the middle of the bay's declared [-20, 60] C
        limits (`vehicle.yaml#thermal.zones.csm_service_bay.limit_c`), 20 C = 293.15 K, the one
        point the band alone singles out. No source gives a MET-0 service-bay temperature (T1). It
        is the rule's own fixed point at MET 0 by construction, because `conductance_w_per_k` is
        derived from it, and `tests/test_thermal_rules.py` holds it there
    heat_state: service_bay_heat_w
    coolant_state: coolant_loop_t
    flow_state: coolant_flow_kg_s
    rated_flow_kg_s: 0.025199576111111112
    lumped_mass_kg: 393.75
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 49.21875
    provenance:
      basis: chosen
      reason: >-
        chosen, pending operator, ADR 0003 item 11. No source reached gives the bay's node capacity
        or its conductance to the loop (T1). G is the bay's MET-0 heat over its rise above the
        supply at the chosen start: 630 W / (293.15 - 280.35) K = 49.21875 W/K. C is G times the
        7,200 s time constant this zone carried as a lag (chosen: twice the cabin's, because the
        propellant is the mass and the tank wall is the path), 354,375 J/K, which is 393.75 kg at
        the domain's 900 J/kg-K. The steady rejection equals the collected load whatever C and G
        are, so the flown coast rejection of 1,170-1,470 W (SP-368 p. 525) cannot move them; what
        bounds G is the temperature it implies, inside the band
      bound: "G >= 630 / (333.15 - 280.35) = 11.93 W/K: the steady bay rise Q_bay/G over 7.2 C coolant must hold the bay under its 60 C limit; C/G = 7,200 s; only the transient depends on C"
      note: >-
        the chosen time constant and specific heat do not establish a historical CSM bay mass or
        heat-transfer conductance. The archive index lists TIR 580-S-7159, "Apollo Service Module
        Thermal Model Handbook (Block 2)", dated 5 October 1967. Only the catalog entry was
        examined; the handbook's scan and applicability to the Apollo 11 CSM configuration
        have not been verified. A usable value needs the CSM node
        capacities, connection conductances and an explicit reduction to this service-bay zone.
        Searched again 2026-10-17 (web search for the handbook and its number): nothing new
      source_audit:
        modeled_vehicle: CSM
        candidate_document: TIR 580-S-7159
        catalog_url: https://www.ibiblio.org/apollo/NARASWoverflow/CorporateIndexSupplement.pdf
        candidate_effectivity: Block 2 CSM; Apollo 11 applicability unverified
        evidence_status: index_only
        missing: CSM node capacities and connection conductances mapped to the service-bay zone
    rated_flow_provenance:
      basis: derived
      relation: "200 lb/hr x 0.45359237 / 3600 = 0.0252 kg/s, `vehicle.yaml#thermal.loops.loop_primary.nominal_flow_lb_per_h`; the same figure `coolant_flow_kg_s.initial` derives"
  - id: zone_lm_cabin_t
    method: lag
    node: lm_cabin_zone_t
    unit: K
    initial: 295
    initial_source: vehicle.yaml:thermal.zones.lm_cabin.nominal_temperature_k
    tau_s: 2880
    lumped_mass_kg: 400
    specific_heat_j_per_kg_k: 900
    conductance_w_per_k: 125
    provenance:
      basis: derived
      computes: tau_s
      derivation:
        expression: lumped_mass_kg * specific_heat_j_per_kg_k / conductance_w_per_k
        inputs:
