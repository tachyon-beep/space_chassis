# domains/rcs/components.yaml — reaction control as an attitude-and-wrench *service*.
#
# ## What this domain is, and what the corpus wanted it to be
#
# `rcs_diode.md` is the strongest engineering document in the corpus, and its central claim is
# architectural rather than numerical (`:9`): **expose RCS/ACS as a trusted
# attitude-and-wrench execution service, not as a remote thruster-firing bus.** The mission
# layer requests effects — hold this attitude, translate by this much, enter safe hold, inhibit
# this group — and the service owns the estimator, the controller, the allocator, the pulse
# modulator and the valve drivers. `apollo_diode.md:147-153` supplies the seven channels that
# say what the thrusters are doing; this document supplies the reason there is anything between
# the request and the thruster.
#
# ## The prunings, which are as load-bearing as the additions
#
# Conflict C-15: **attitude is RCS only.** `apollo_diode.md:52` has no reaction wheels, no CMGs
# and no magnetorquers, and `rcs_diode.md` assumes all three. So the whole momentum-management
# apparatus goes: `REQUEST_MOMENTUM_DUMP`, the dump controller `τ = -K_H(H_w - H_target)`
# (`:783`), the 80/90/95 % wheel thresholds (`:794-798`), the `HYBRID_WHEEL_RCS` control profile
# (`:663`) and the two wheel faults in its FDIR table. A vehicle with no wheels has no momentum
# to dump, and a wheel-saturation alarm on this spacecraft would be an alarm about hardware that
# is not there.
#
# Also pruned: `rcs.feed.<id>.pressure_abs` in Pa (vocabulary §3 maps it back to apollo's
# `rcs.quad_[a-d]_feed_pressure_pct`, C-17) and `rcs.power.bus_voltage` / `rcs.thermal.<id>` as
# *RCS* channels, because the vehicle already publishes the bus and the zones and a second copy
# of a measurement is a second truth.
#
# ## The alignment this domain had to make: 100 Hz inside a 50 Hz tick
#
# `rcs_diode.md:836` budgets a 100 Hz control frame with a 10 ms deadline table, and the plant
# runs at 50 Hz (C-07). The plant does **not** get re-rated. What makes the control frame real
# is the sub-tick integer-microsecond event queue of `plant.md` §5: a pulse is scheduled at a
# microsecond offset inside the 20 ms tick, so a 4 ms firing is four milliseconds of thrust
# rather than a whole tick of it. This is not a convenience — it is the difference between a
# minimum impulse bit and a minimum *tick*, and with a 20 ms tick the smallest commandable
# firing would be five times the size of the real one. Declared rate is therefore 50, and the
# 100 Hz frame is a sub-step.
#
# ## The unpublished constant, and why it is bounded rather than fatal
#
# `vehicle.yaml#propulsion` declares the minimum impulse bit of the SM and LM systems
# UNCONFIGURED: no mission report, summary report or news reference reached contains any
# impulse-bit or minimum-firing figure. `rcs_diode.md:800-825` supplies the mechanism that makes
# that survivable — the residual accumulator `r_i`:
#
#     I_acc = I* + r_i        ; if I_acc is below the qualified threshold it stays in r_i
#     t_i   = quantize(I_acc / F_eff, dt_q)   ; subject to t_i >= t_min_on
#     r_i  <- I_acc - I_hat(t_i)
#
# The average delivered impulse is therefore preserved **whatever** `t_min_on` is: the residual
# absorbs the difference. What is *not* preserved is *when* the impulse arrives. So an unknown
# minimum firing time costs zero mean error and unbounded phase error — a slow limit cycle
# instead of a fast one — which is a bounded, describable degradation rather than a silent one.
# The debt stays open and the mechanism bounds it; that is the honest engineering answer to a
# number nobody published.
#
# The one consequence that is *not* benign is RCS-11 in `fault_policy.yaml`: if `t_min_on` is
# larger than the widths the controller keeps requesting, the accumulator grows, every pulse is
# refused as illegally short, and the thruster never fires. That failure has no valve fault, no
# switch disagreement, and no health conclusion. Its only evidence is
# `rcs.thruster_[n]_residual_ns` climbing while `rcs.thruster_[n]_valve` never asserts.

domain: rcs

# 50, not rcs_dode.md:836's 100: C-07 keeps the plant's rate and the control frame is a
# sub-step in the event queue. See the header.
natural_rate_hz: 50

# Every node here has an edge into an RCS node in coupling.yaml, and the five are exactly the
# ones that do. Two quantities the FDIR needs arrive as *published channels* rather than as
# coupling edges — `structure.accel_xyz_g` for the stuck-on corroboration and
# `thermal.coolant_supply_c` for the feed readiness check — and `controls.switches` is how a
# crew member flies the vehicle in `manual` mode. None of them is a node this domain advances
# or a graph edge it sits on, so none of them is declared here.
#
# `guidance` is the fifth and it was missing, which is worth a line because this comment claimed
# the list was complete: *"the four are exactly the ones that do"*. `E-GNC-RCS` carries it into
# `rcs_valves` — the last step of the control chain apollo_diode.md:792-796 describes, where the
# allocator's commanded valve set arrives — so the claim was false in the one way a claim with no
# reader can be, and it read as a statement of fact for as long as nobody counted.
# `vehicle_dynamics` is the sixth, and it is read rather than edged: the slew law samples the attitude
# and the rate the dynamics left last tick and fires against them (`rules.py`), which is the DAP
# reading its IMU. `E-RCS-DYN` is the edge back. It is the truth, not the estimate, until
# `gnc.nav_solution` lands, and that is an `open_debts` entry: the estimate is where a drifting
# platform makes the service hold the wrong attitude while reporting the right one.
reads: [prop_rcs, nav_state, bus_a, command_executive, guidance, vehicle_dynamics]
writes: [rcs_valves, rcs_thrust]

# --------------------------------------------------------------------------------------
# Capability. Four derived figures, and each one is checkable arithmetic rather than a
# remembered number.
# --------------------------------------------------------------------------------------
capability:

  # The link between impulse and propellant, and the reason E-RCSP-RCS is no longer
  # UNCONFIGURED. Thrust and Isp are published (vehicle.yaml#propulsion.rcs_*, from the
  # Apollo 11 tables); g0 is a definition.
  mass_flow_per_thruster:
    value: 0.16335
    unit: kg/s
    provenance:
      basis: derived
      relation: "mdot = F / (Isp * g0) = 445 / (277.8 * 9.80665) = 0.16335 kg/s per thruster"
      note: >-
        all three systems share the 100 lbf thruster and the same 277.8 s, so one figure serves
        them all. The inverse is the edge sensitivity: 277.8 * 9.80665 = 2724.3 N per kg/s.
        **This is the number C-26 moved, and it is now the guide's own measurement reproduced**:
        `lm_propulsion_rcs_study_guide.pdf` PDF p. 90 gives the flow as 0.24 + 0.12 lb/s =
        0.163293 kg/s at 100 lbf, and 0.163345 is 0.03 % from it — where the 290 s this replaces
        was 4.3 % away and sourced to nothing
  quantum_impulse:
    value: 0.000445
    unit: N*s
    provenance:
      basis: derived
      relation: "F * dt_min = 445 N * 1e-6 s = 4.45e-4 N*s"
      note: >-
        `dt_min` is the plant's event-queue resolution (plant.md §5, integer microseconds),
        not a hardware figure — so this is the smallest *representable* impulse, and it is
        three orders of magnitude below any physical minimum firing. It is the accumulator's
        arithmetic quantum, which is why it can be exact while t_min_on stays unknown
  impulse_capacity:
    unit: N*s
    values:
      rcs_sm: 1656367
      rcs_cm: 298750
      rcs_lm: 784595
    provenance:
      basis: derived
      relation: "load * Isp * g0, loads from vehicle.yaml#propulsion.rcs_* (A11 Tbl 8-XI, 9-XV)"
      note: >-
        the total impulse each load can produce if every kilogram is burned through its own
        thrusters — 1.656e6 N*s for the service module and 7.846e5 for the LM at C-26's 277.8 s,
        and 2.987e5 for the command module at its own engine's 272.0 s (it was 3.051e5 while the
        CM engine was taken to be the SM article) (they were 1.729e6 / 3.185e5 / 8.191e5 at the unsourced
        290 s: **the same tanks now price 4.2 % less impulse**, which is the direction the
        decision moves the tightest load in the mission). It is an upper bound and the ceiling of `rcs.total_impulse_ns`, which is
        what makes the published total impulse checkable against the published load: a total
        impulse above this figure is not a thruster that has been busy, it is a spent tank. Most
        of it will be attitude control rather than translation, so the figure prices an
        emergency translation, not an available budget
  minimum_command_on_s:
    rcs_sm:
      value: 0.012
      path: automatic_controller
      provenance:
        basis: historical
        source: >-
          Apollo Operations Handbook, SM2A-03-BLOCK II-(1), Vol. 1, subsection 2.5,
          PDF p. 17, printed p. 2.5-18, Figure 2.5-9 discussion:
          https://www.ibiblio.org/apollo/ApolloProjectOnline/Documents/SMA2A-03-BLOCK%20II%20Volume%201%2019691015/aoh-v1-2-05-rcs.pdf
          The SM controller reaction jet ON-OFF assembly takes 12–18 ms before it can send OFF
          to the automatic injector coils; 12 ms is the earliest electrical OFF signal.
        note: >-
          This is the earliest SM automatic-controller OFF command, not a qualified engine
          minimum, a direct-manual-coil limit, or delivered impulse. Figure 2.5-9 continues
          thrust after electrical OFF and the handbook requires integrating the full curve.
    rcs_cm:
      value: UNCONFIGURED
      path: automatic_controller
      provenance:
        basis: UNCONFIGURED
        source: >-
          Apollo Operations Handbook, SM2A-03-BLOCK II-(1), Vol. 1, subsection 2.5,
          PDF pp. 31–32, CM RCS valve discussion and Figure 2.5-12:
          https://www.ibiblio.org/apollo/ApolloProjectOnline/Documents/SMA2A-03-BLOCK%20II%20Volume%201%2019691015/aoh-v1-2-05-rcs.pdf
          R-577 Section 6 Rev. 1 PDF p. 58 gives 14 ms for a CM simulator, not CM hardware:
          https://www.ibiblio.org/apollo/NARA-SW/R-577-sec6-rev1.pdf
        note: >-
          The handbook calls CM pulse operation similar to SM and gives valve response times,
          but no CM automatic-controller minimum electrical ON duration. A simulator constant
          cannot qualify the flight hardware; leave this value owed.
    rcs_lm:
      value: 0.01
      path: engine_pulse_mode
      provenance:
        basis: historical
        source: >-
          LM Propulsion/RCS Study Guide, PDF p. 89, printed p. 77, pulse-mode operation:
          https://www.ibiblio.org/apollo/Documents/lm_propulsion_rcs_study_guide.pdf
          the total command ON time may be as low as 10 ms.
        note: >-
          This is the LM engine's pulse-mode command ON duration. It is not a bound on
          delivered impulse: thrust starts late and continues after the electrical OFF command.

  engine_life:
    steady_s: 500
    pulse_s: 500
    total_s: 1000
    restarts: 10000
    unit: "s, s, s, count"
    provenance:
      basis: historical
      source: >-
        `lm_propulsion_rcs_study_guide.pdf`, PDF p. 90, "Design and Performance Characteristics":
        "Engine life (steady state) 500 seconds / Engine life (pulse mode) 500 seconds / Engine life
        (total) 1000 seconds / Restart capability 10,000 times". The same block gives thrust 100
        pounds, O/F 2.0:1, specific impulse 275 seconds (approx), chamber pressure 95 psi, oxidiser
        0.24 lb/s and fuel 0.12 lb/s, expansion ratio 40:1 and weight 6 lb
      note: >-
        declared here rather than in `domains/propulsion/` because these are the *thruster's*
        qualifications. They are the SM and LM article's (`thruster_100lbf`); the CM engine
        (`thruster_cm`) is a different engine whose life limits are not declared here. The two life limits are separate
        numbers rather than one: 500 s of steady-state operation and 500 s of pulse-mode operation
        are different duty, and a total of 1,000 s is their sum rather than a third allowance. What
        spends them is the mission's own firing time, which is not declared yet — the RCS budget is
        an open debt in this file — so this block is a rating with no counter today and says so
        rather than pretending to be checked. The Isp in the block is **275 s (approx)** and the
        thruster now declares **277.8 s**: the page's two numbers — that Isp and the 0.36 lb/s flow
        at 100 lbf — agree on 277.78 s, and C-26 was put to the operator and closed on the guide's
        side rather than on this domain's unsourced 290 s

# --------------------------------------------------------------------------------------
# Geometry. Where each jet is and which way it pushes, for the SM and LM systems; the CM's
# is still owed. The research record is `docs/evidence/wp03-rcs-geometry.md`; this block is
# the canonical home of every value it lands, and `check_rcs_geometry` holds it together.
# --------------------------------------------------------------------------------------
geometry:

  # The SM's sixteen jets, as the CSM digital autopilot selects them. Positions are the
  # GSOP simulator's averaged model (all four jets of a quad act at one centreline
  # intersection); each figure it uses is corroborated by a flight-hardware document, which
  # is what lets a verification-simulator number stand here (see the evidence record, G-1).
  rcs_sm:
    frame: APOLLO_XA
    quad_station_xa_in: 958.97
    pitch_yaw_radius_in: 82.36
    roll_radius_in: 83.00
    quad_offset_deg: -7.25
    cant_deg: 10.0
    provenance:
      basis: historical
      source: >-
        SNA-8-D-027(I) Rev 3 Figure 4.3-2 (printed p. 4.3-31) and SNA-8-D-027(III) Rev 2 Figure
        2-5 (printed p. 2-6), "Service Module RCS Thrust Chamber Locations", rendered: pitch and
        yaw thrust line intersection at X_A 958.97, radius 82.36 in; roll thrust line
        intersection radius 83.00 in; "10 deg (TYP)"; "7 deg 15' (TYP) (4 PLACES)":
        https://www.ibiblio.org/apollo/Documents/HSI-41539.pdf
        GSOP R-577 s. 6.4.1.3 states the same station, the offset "by a negative rotation about
        the +X axis", CANT 10.0 deg with the exhaust "directed away from the spacecraft surface",
        and RCRAD 82.68 in, the mean of the two radii:
        https://www.ibiblio.org/apollo/NARA-SW/R-577-sec6-rev1.pdf
        AOH SM2A-03-BLOCK II-(1) s. 2.5, printed p. 2.5-1: "offset from the S/C Y and Z axis by
        7 degrees 15 minutes", "canted approximately 10 degrees away from the panel structure"
      note: >-
        Block II CSM. On the one quad the drawing details, each roll thrust line also sits 0.94 in
        fore or aft of X_A 958.97; that moves each roll firing's cross-axis torque by about 1 %
        and adds no decision, so it is a documented approximation (G-5). The 3.125 in and 6.750 in
        dimensions lie along lines of action and change no torque
    # Control axes are the APOLLO_XA axes rotated by `quad_offset_deg` about +X: quad B on
    # +Y_c, C on +Z_c, D on -Y_c, A on -Z_c. `axis` is the jet's nominal thrust direction in
    # control axes before the cant; the cant tilts it by `cant_deg` towards the X axis (the
    # exhaust leans outward, so the thrust leans inward). `torque` and `translation` are the
    # DAP tables' own entries, so the linter can re-derive each from r x F and refuse a jet
    # whose geometry would fire the wrong way.
    jets:
      - {id: 1,  quad: C, axis: "+X", torque: "+pitch", translation: "+X", aoh_name: C3}
      - {id: 2,  quad: A, axis: "+X", torque: "-pitch", translation: "+X", aoh_name: A4}
      - {id: 3,  quad: A, axis: "-X", torque: "+pitch", translation: "-X", aoh_name: A3}
      - {id: 4,  quad: C, axis: "-X", torque: "-pitch", translation: "-X", aoh_name: C4}
      - {id: 5,  quad: D, axis: "+X", torque: "+yaw",   translation: "+X", aoh_name: D3}
      - {id: 6,  quad: B, axis: "+X", torque: "-yaw",   translation: "+X", aoh_name: B4}
      - {id: 7,  quad: B, axis: "-X", torque: "+yaw",   translation: "-X", aoh_name: B3}
      - {id: 8,  quad: D, axis: "-X", torque: "-yaw",   translation: "-X", aoh_name: D4}
      - {id: 9,  quad: B, axis: "+Z", torque: "+roll",  translation: "+Z", aoh_name: B1}
      - {id: 10, quad: D, axis: "+Z", torque: "-roll",  translation: "+Z", aoh_name: D2}
      - {id: 11, quad: D, axis: "-Z", torque: "+roll",  translation: "-Z", aoh_name: D1}
      - {id: 12, quad: B, axis: "-Z", torque: "-roll",  translation: "-Z", aoh_name: B2}
      - {id: 13, quad: A, axis: "+Y", torque: "+roll",  translation: "+Y", aoh_name: A1}
      - {id: 14, quad: C, axis: "+Y", torque: "-roll",  translation: "+Y", aoh_name: C2}
      - {id: 15, quad: C, axis: "-Y", torque: "+roll",  translation: "-Y", aoh_name: C1}
      - {id: 16, quad: A, axis: "-Y", torque: "-roll",  translation: "-Y", aoh_name: A2}
    jets_provenance:
      basis: derived
      source: >-
        GSOP R-577 Section 3 (Digital Autopilots) Rev. 3, Dec 1968, COLOSSUS 1/1A, Tables
        3.2-III to 3.2-X, printed pp. 3.2-33 to 3.2-35 (jet selection for pitch, yaw, roll AC,
        roll BD and X, Y, Z translation, each with quad-fail rows), and p. 3.2-28 / footnote p.
        3.2-1 ("Quads A and C are aligned with the yaw-control (Z) axis", "Quads B and D ... the
        pitch-control (Y) axis", control axes rotated -7.25 deg from the navigation base axes):
        https://ibiblio.org/apollo/NARA-SW/R-577-sec3-rev3.pdf
      relation: >-
        quad membership from the quad-fail rows (a jet still selected with quad A failed is not
        on A); force sign from the translation tables; which end of each axis a quad sits on
        from the torque sign, by tau = r x F with right-handed pitch, yaw and roll about the
        control Y, Z and X axes. The result (A on -Z_c, B on +Y_c, C on +Z_c, D on -Y_c) is the
        one assignment under which all eight tables agree
      note: >-
        flight software, not a simulator: the DAP that flew from Apollo 8. Jet numbers are the
        DAP's; `aoh_name` is the engine name SNA-8-D-027(I) Rev 3 Table 4.3-12 "Service Module RCS
        Control Definitions" (printed p. 4.3-28, rendered) lists in the same order with quad,
        translation and rotation, matching this table on every jet. AOH Figure 2.5-1 "CM-SM Engine
        Locations" draws quad A on -Z, B on +Y, C on +Z and D on -Y, the placement the DAP tables
        above give independently, and AOH Figure 2.3-14 "SM Jet Functions" repeats the map (G-2)

  # The CM's twelve jets by the AOH's engine numbers: subsystem, function, where the thrust line
  # meets the outer mould line (the roll pairs at their centrelines' intersection), and the unit
  # thrust in CM axes. `check_rcs_geometry` rebuilds every vector from the drawing's angles and
  # refuses one that disagrees, or whose torque about `torque_check_point_in` turns the CM the
  # wrong way. Thrust and Isp are the CM article's, `thruster_cm` (G-7).
  rcs_cm:
    frame: CM_XC
    aft_engine_angle_deg: 47.0
    roll_alpha_deg: 46.402778
    roll_beta_deg: 56.374444
    roll_point_theta_deg: {H: 315.916667, G: 224.083333}
    torque_check_point_in: [41.7, -0.4, 5.6]
    jets:
      - {id: 11, subsystem: 1, torque: "+roll",  point: H, position_in: [32.3000,  51.9826, -50.3454], thrust_unit: [0.0,  0.1815,  0.9834]}
      - {id: 12, subsystem: 1, torque: "-roll",  point: H, position_in: [32.3000,  51.9826, -50.3454], thrust_unit: [0.0, -0.9992, -0.0405]}
      - {id: 13, subsystem: 1, torque: "+pitch", point: F, position_in: [27.6750,   4.4211, -72.2846], thrust_unit: [-0.7314, -0.0416,  0.6807]}
      - {id: 14, subsystem: 1, torque: "-pitch", point: N, position_in: [85.1200,   3.929,  -35.5743], thrust_unit: [0.0, 0.0, 1.0]}
      - {id: 15, subsystem: 1, torque: "+yaw",   point: A, position_in: [27.6750,  72.2846,  -4.4211], thrust_unit: [-0.7314, -0.6807,  0.0416]}
      - {id: 16, subsystem: 1, torque: "-yaw",   point: C, position_in: [27.6750, -72.2846,   4.4211], thrust_unit: [-0.7314,  0.6807, -0.0416]}
      - {id: 21, subsystem: 2, torque: "+roll",  point: G, position_in: [32.3000, -51.9826, -50.3454], thrust_unit: [0.0,  0.9992, -0.0405]}
      - {id: 22, subsystem: 2, torque: "-roll",  point: G, position_in: [32.3000, -51.9826, -50.3454], thrust_unit: [0.0, -0.1815,  0.9834]}
      - {id: 23, subsystem: 2, torque: "+pitch", point: E, position_in: [27.6750,  -4.4211, -72.2846], thrust_unit: [-0.7314,  0.0416,  0.6807]}
      - {id: 24, subsystem: 2, torque: "-pitch", point: M, position_in: [85.1200,  -3.929,  -35.5743], thrust_unit: [0.0, 0.0, 1.0]}
      - {id: 25, subsystem: 2, torque: "+yaw",   point: B, position_in: [27.6750,  72.2846,   4.4211], thrust_unit: [-0.7314, -0.6807, -0.0416]}
      - {id: 26, subsystem: 2, torque: "-yaw",   point: D, position_in: [27.6750, -72.2846,  -4.4211], thrust_unit: [-0.7314,  0.6807,  0.0416]}
    provenance:
      basis: historical
      source: >-
        CSM/LM Spacecraft Operational Data Book Vol. I, SNA-8-D-027(I) Rev 3, Figure 4.4-2
        "Command Module RCS Thrust Chamber Locations", printed p. 4.4-15, CSM 101 and subs,
        rendered (`/mnt/project-files/sources/rcs/`): the thrust-exit-plane points A-N with RCS
        system A/B, note (1) "intersection point of roll engine centerline", Section M-M "47 deg
        TRUE" for the yaw and aft pitch engines, alpha 46 24' 10" and beta 56 22' 28" for the roll
        engines at H (theta_c 315 55') and G (224 05'):
        https://www.ibiblio.org/apollo/Documents/HSI-41539.pdf
        Functions and subsystems from AOH s. 2.5 Figure 2.5-1 and s. 2.3 Figure 2.3-14 (+pitch
        13/23, -pitch 14/24, +yaw 15/25, -yaw 16/26, +roll 11/21, -roll 12/22), corroborated by
        AOH p. 2.3-32 (direct coils on all CM engines "except 13 and 23"). The same twelve
        positions are R-577 s. 6.5.1.2's (printed pp. 6-42, 6-43), rendered
      thrust_unit_relation: >-
        thrust = -exhaust. Yaw and aft pitch: exhaust = sin 47 X + cos 47 r_hat(point). Forward
        pitch (14, 24): exhaust -Z, drawn perpendicular to X, with an in-plane tilt the drawing
        does not dimension and that is taken as zero. Roll: exhaust in the X_C 32.3 plane at
        theta_H + alpha (12), theta_H - beta (11), theta_G - alpha (21), theta_G + beta (22). The
        vectors reproduce R-577 s. 6.11.2's hybrid-simulator moment arms to 0.05 ft on ten of
        twelve jets; the two rows that differ disagree with their own mirrors, and the
        flight-hardware drawing wins
      note: >-
        `torque_check_point_in` is R-577 s. 6.5.2's simulator CM centre of gravity, used only to
        check torque signs, never as a mass property. The nozzle extensions' alignment angles
        (SNA-8-D-027(I) Table 4.4-3, 0.74-8.23 deg in vacuum) are not modelled. Every pitch and
        yaw jet also turns the CM a little about the other two axes, and the two subsystems'
        couplings cancel only when both fire: the confounder a single-subsystem entry shows (G-6)

  # The LM's sixteen jets, from the LUMINARY simulator's control data, whose three printed
  # dimensions the Operational Data Book's flight-hardware figure states independently.
  rcs_lm:
    frame: LM_XE
    unit: "m, N"
    thrust_n: 444.82
    jets:
      - {id: 1,  name: IV-U,  position_m: [6.57352,  1.67894,  1.67894], force_axis: "-X"}
      - {id: 2,  name: IV-D,  position_m: [6.31698,  1.67894,  1.67894], force_axis: "+X"}
      - {id: 3,  name: IV-F,  position_m: [6.4516,   1.5621,   1.68529], force_axis: "-Z"}
      - {id: 4,  name: IV-S,  position_m: [6.4516,   1.68529,  1.5621],  force_axis: "-Y"}
      - {id: 5,  name: III-U, position_m: [6.57352,  1.67894, -1.67894], force_axis: "-X"}
      - {id: 6,  name: III-D, position_m: [6.31698,  1.67894, -1.67894], force_axis: "+X"}
      - {id: 7,  name: III-F, position_m: [6.4516,   1.5621,  -1.68529], force_axis: "+Z"}
      - {id: 8,  name: III-S, position_m: [6.4516,   1.68529, -1.5621],  force_axis: "-Y"}
      - {id: 9,  name: II-U,  position_m: [6.57352, -1.67894, -1.67894], force_axis: "-X"}
      - {id: 10, name: II-D,  position_m: [6.31698, -1.67894, -1.67894], force_axis: "+X"}
      - {id: 11, name: II-F,  position_m: [6.4516,  -1.5621,  -1.68529], force_axis: "+Z"}
      - {id: 12, name: II-S,  position_m: [6.4516,  -1.68529, -1.5621],  force_axis: "+Y"}
      - {id: 13, name: I-U,   position_m: [6.57352, -1.67894,  1.67894], force_axis: "-X"}
      - {id: 14, name: I-D,   position_m: [6.31698, -1.67894,  1.67894], force_axis: "+X"}
      - {id: 15, name: I-F,   position_m: [6.4516,  -1.5621,   1.68529], force_axis: "-Z"}
      - {id: 16, name: I-S,   position_m: [6.4516,  -1.68529,  1.5621],  force_axis: "+Y"}
    odb_check_in:
      cluster_plane_xe: 254.0
      up_down_arm: 66.1
      fore_side_arm: 61.5
    provenance:
      basis: historical
      source: >-
        GSOP R-567 Section 6 (Control Data), Nov 1968, LUMINARY, LM-6 digital simulator,
        s. 6.4.1 (origin "254 inches (6.4516 meters) below the RCS reference plane"), s. 6.4.1.4
        jet positions, s. 6.4.5.2 force vectors (printed pp. 6-22, 6-23, 444.82 N each):
        https://ibiblio.org/apollo/NARA-SW/R-567-sec6.pdf
        Corroborated by SNA-8-D-027(III) Rev 2, Figure 2-12 (printed p. 2-13), "RCS PITCH AND
        ROLL JETS ZE AND YE = +/-66.1" and "RCS YAW JETS ZE AND YE = +/-61.5" (effective
        geometric moment arms), and Figure 2-13 (printed p. 2-14), "XE = 254.0"
      note: >-
        `odb_check_in` holds the flight-hardware figure's three dimensions, which
        `check_rcs_geometry` requires the simulator positions to reproduce to their printed
        precision. All sixteen force vectors were read from the rendered pages 6-22 and 6-23
        (`/mnt/project-files/sources/rcs/`): jet 4 prints "-444.82" on Y and jets 1 and 13
        "-444.82" on X. The text layer had lost those minus signs; the rule that a jet exhausts
        away from its own cluster, which `check_rcs_geometry` enforces, had predicted all three

# --------------------------------------------------------------------------------------
# State. Twelve, of which only two advance a coupling node — the rest are the service.
# --------------------------------------------------------------------------------------
# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [mode, attitude_target, target_frame, slew_rate_limit, roll_rate_command, control_profile, deadband_deg, held_target, safety_state, authority_margin, attitude_error, deadband_latch, allocation_status, pulse_width, pulse_residual, impulse_total, propellant_estimate, feed_pressure]
internal_order_note: >-
  the control chain: the mode selects the authority, the authority bounds what the error may
  be, the error against the deadband decides whether a pulse is owed, the allocation decides
  which jets, the pulse width what they fire, and the residual and totals book what was
  delivered. **The totals now come before the estimate that reads them** — `propellant_estimate`
  is `100 * (1 - impulse_total / capacity)`, so the stock has to have advanced in this tick before
  the percentage is computed from it. It was the other way round until the linter learned to ask
  a derivation which tick its readings come from: the sentinel has no edges, so nothing but this
  list could ever have caught it, and the state would have reported last tick's impulse wearing
  this tick's name. The target comes before the error that is measured against it: the commanded
  text, frame, rate and deadband are the effect path's, and `held_target` resolves them once per
  change before anything reads it.

state:

  # ------------------------------------------------------------------------------------
  # The slew law (ADR 0005). The commanded target, frame, rate and deadband are the effect
  # path's; `held_target` resolves them; `control_torque` is the law; `thruster_thrust` and
  # `thrust_total_n` are what it costs.
  # ------------------------------------------------------------------------------------

  - id: attitude_target
    node: internal
    method: discrete
    unit: "text: a unit quaternion [w,x,y,z] as the command carried it, or `current`"
    initial: "current"
    initial_provenance:
      basis: chosen
      reason: >-
        hold where the vehicle is: `held_target.initial` is the attitude `gnc.attitude.initial`
        names, and `current` is the text that means that attitude. No source says what the DAP was
        last asked to hold at the cut
    moved_by:
      - "command:set_attitude_target"
      - "command:set_ptc_roll"
      - "command:abort_rcs_activity"
    command_value:
      - verb: set_attitude_target
        # `frame`, the enum half of the request, because an entry names an argument with a
        # vocabulary; the quaternion is the half this state holds once it can be carried.
        argument: frame
        computed: >-
          the target is the quaternion, carried as the text the window sent. `held_target` reads it
          once, when it changes, and refuses a text that is not four numbers within 1 % of unit
          length by keeping the target it had (`status: unreadable`)
        why: >-
          declared and not yet carried: an array argument has no vocabulary to map and the engine
          carries only numbers so far. The fault-injection lane carries arrays after #47
          (`quaternion=0.7071,0,-0.7071,0`), and this entry becomes the carried argument then.
          Until it does, a target reaches this state only through a scenario's initial value
        selects: target_frame
        note: >-
          what the verb assigns today is the frame (`target_frame`) and the rate
          (`slew_rate_limit`); the quaternion lands here once the window's array is carried, and
          the entry then names `quaternion` and drops `computed` and `selects`
      - verb: set_ptc_roll
        argument: rate_deg_s
        constant: "current"
        why: >-
          the roll starts and ends where the vehicle is: spinning up holds +X where it points now,
          and spinning down holds the attitude the roll has reached rather than turning back
          through it
      - verb: abort_rcs_activity
        argument: scope
        constant: "current"
        why: >-
          a stopped slew holds where the vehicle is now. `scope` is not read: a translation is not
          modelled yet, so stopping one changes no target, and stopping `slew` or `all` both mean
          hold here
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: >-
          a target is a request, not a mechanism, and `abort_rcs_activity` must reach it at once.
          The DAP's own pacing is the slew rate, which is the law's, not a hold on the request
    provenance:
      basis: historical
      source: "rcs_dode.md:365 and :96 — SET_ATTITUDE_TARGET(frame, quaternion, optional rate, tolerance profile)"
      note: >-
        the request half of the slew law. It is text because the window carries arguments as text
        and a quaternion is four numbers; the effect path writes it whole and the rule parses it

  - id: target_frame
    node: internal
    method: discrete
    unit: "enum[BODY,LVLH,EARTH_J2000,MOON_J2000]"
    initial: EARTH_J2000
    initial_provenance:
      basis: chosen
      reason: "the frame `attitude.initial` is written in; with `attitude_target: current` the frame is not read"
    moved_by:
      - "command:set_attitude_target"
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: "as `attitude_target`: one request, written in two states"
    provenance:
      basis: historical
      source: "rcs_dode.md:365; the frame ids are `vehicle.yaml#frames`"
      note: >-
        which frame the target quaternion is in. EARTH_J2000 and MOON_J2000 share axes, so both are
        inertial targets; BODY is relative to the attitude when the target is set; LVLH is owed
        with the orbit-referenced frame (`open_debts`)

  - id: slew_rate_limit
    node: internal
    method: discrete
    unit: "deg/s"
    initial: 0.5
    initial_provenance:
      basis: chosen
      reason: >-
        a mid DAP rate; the cut does not record the last V48 load. A11 flew docked closing at the
        2-deg/sec rate (Mission Report printed p. 4-3), which is a choice for a different task
    moved_by:
      - "command:set_attitude_target"
    command_value:
      - verb: set_attitude_target
        argument: rate_limit_deg_s
        maps:
          "0.05": 0.05
          "0.2": 0.2
          "0.5": 0.5
          "2.0": 2.0
        why: "the maneuver rate is the rate the slew is flown at, one for one: the DAP's selections, read as the number they name"
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: "as `attitude_target`"
    provenance:
      basis: historical
      source: >-
        GSOP R-577 Section 3 (Digital Autopilots) Rev. 3, s. 3.2.2.1, printed p. 3.2-6, Noun 46
        "RATE: Rate Specification for RHC in HOLD or AUTO Mode and for KALCMANU-supervised Automatic
        Maneuvers: 0 -- 0.05 deg/sec, 1 -- 0.2 deg/sec, 2 -- 0.5 deg/sec, 3 -- 4.0 deg/sec":
        https://ibiblio.org/apollo/NARA-SW/R-577-sec3-rev3.pdf ; and Apollo 11 Mission Report,
        printed p. 4-3, "using a 2-deg/sec rate and 0.5-degree deadband"
      note: >-
        the DAP's four rates, and the top one is the flown software's: COLOSSUS 1/1A (R-577 Rev. 3)
        offered 4.0 deg/s and Apollo 11 flew 2 deg/s, so the vehicle offers 2.0 and records the
        difference here. The rate is the slew's whole trade: the propellant a slew costs is
        proportional to it (spin up, spin down) and the time is inversely so

  - id: roll_rate_command
    node: internal
    method: discrete
    unit: deg/s
    initial: 0.0
    initial_provenance:
      basis: chosen
      reason: >-
        the vehicle starts at rest in the PTC attitude (`gnc.attitude.initial`), holding: the roll
        is the fleet's to start, and whether to start it is the first trade the coast offers
    moved_by:
      - "command:set_ptc_roll"
      - "command:set_attitude_target"
      - "command:abort_rcs_activity"
    command_value:
      - verb: set_ptc_roll
        argument: rate_deg_s
        maps:
          "0.0": 0.0
          "0.3": 0.3
        why: "the roll rate the service spins the vehicle up to about +X, read as the number it names"
      - verb: set_attitude_target
        argument: frame
        constant: 0.0
        why: >-
          a new target ends the roll: the service steers to the target and stops the spin on the
          way, which is what leaving PTC for a burn attitude costs
      - verb: abort_rcs_activity
        argument: scope
        constant: 0.0
        why: "a stopped slew stops the roll too; `scope` is not read, as for `attitude_target`"
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: "as `attitude_target`: a request, paced by the law and not by a hold on the request"
    provenance:
      basis: historical
      source: >-
        Apollo 11 Mission Report (MSC-00171), passive thermal control: a 0.3 deg/s roll about +X
        with +X toward the ecliptic north pole in translunar coast (south in transearth), after
        which all sixteen SM auto RCS switches were turned off:
        https://www.nasa.gov/wp-content/uploads/static/apollo50th/pdf/A11_MissionReport.pdf
      note: >-
        the thermal roll's half of the pointing modes. It is a rate, not a mode, because Apollo's
        PTC was the autopilot flying a rate about one axis and then nobody flying at all: the
        spin-up costs propellant, the free drift costs none and cones, and leaving it for a burn
        or a comms hold costs the spin-down. The fleet chooses when each of those happens

  - id: control_profile
    node: internal
    method: discrete
    unit: "enum[conservative,nominal,tight,safe_vector]"
    initial: nominal
    initial_provenance:
      basis: chosen
      reason: >-
        the narrow deadband, which the Apollo 11 crew flew the docked maneuvers in (Mission Report
        printed p. 4-3). The cut does not record the last V48 load
    moved_by:
      - "command:set_deadband"
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: "a DAP load takes effect at once; R-577 s. 3.2.2.3 has the programs zero the error before collapsing the deadband, which the law's own hold does"
    provenance:
      basis: historical
      source: "rcs_dode.md:377 SET_CONTROL_PROFILE; the four profiles are `domains/rcs/profiles.yaml#profile_selection`"
      note: >-
        the profile the fleet selected, which is a choice and not a number: `tight` and `nominal`
        hold the same deadband and differ in their threshold factors, so the state that records
        the choice is the profile, and `deadband_deg` is what the profile means to the controller

  - id: deadband_deg
    node: internal
    method: algebraic
    unit: deg
    # What each profile means to the DAP. Its deadband is a V48 load with two settings, so every
    # profile lands on one of the two.
    by_profile_deg:
      conservative: 5.0
      nominal: 0.5
      tight: 0.5
      safe_vector: 5.0
    by_profile_provenance:
      basis: chosen
      reason: >-
        the DAP offers two angular deadbands and the verb four profiles. `conservative` is the
        wide one and `nominal` the narrow one. `tight` is the narrow one too, because the flight
        software had nothing narrower and the vehicle cannot hold less with a 14 ms minimum pulse;
        what makes it a different choice from `nominal` is its threshold factors
        (domains/rcs/profiles.yaml, 0.6 on a ceiling), so it buys earlier warnings and not finer
        pointing. `safe_vector` is the wide one: the safe-hold rung is the posture that has
        stopped spending propellant on pointing, and the minimum-impulse limit cycle costs a
        tenth as much at 5 deg. No Apollo document ties a deadband to a profile name
    provenance:
      basis: historical
      source: >-
        GSOP R-577 Section 3 Rev. 3, s. 3.2.2.1, printed p. 3.2-6: "DB: Angular Deadband for
        Attitude Hold and Automatic Maneuvers 0 -- +/- 0.5 deg, 1 -- +/- 5.0 deg"; s. 3.2.3, printed
        p. 3.2-27, the minimum-impulse limit cycle: https://ibiblio.org/apollo/NARA-SW/R-577-sec3-rev3.pdf
      note: >-
        the half-width the hold is allowed to wander in, and the hold's whole price: the
        minimum-impulse limit cycle pulses once per crossing of the band, so the wide deadband
        costs a tenth of the narrow one. That is the decision this state carries: propellant held
        against pointing held

  - id: held_target
    node: internal
    method: dynamics
    unit: "record{source,frame,roll,q,status}"
    initial:
      source: "current"
      frame: EARTH_J2000
      roll: 0.0
      q: [0.7071067811865476, 0.0, -0.6487577877061355, -0.2812709243605549]
      status: held
    initial_provenance:
      basis: derived
      relation: "the target is the attitude the vehicle starts at (`gnc.attitude.initial`), held"
      source: domains/gnc/components.yaml:state.attitude.initial
    inertial_frames: [EARTH_J2000, MOON_J2000]
    provenance:
      basis: derived
      relation: >-
        `rules.py`: resolves `attitude_target` in `target_frame` into an EARTH_J2000 quaternion when
        either changes. EARTH_J2000 and MOON_J2000 are the commanded quaternion; BODY is the
        attitude at the change times the commanded rotation; `current` is the attitude at the
        change; LVLH is recorded as `frame_owed` and the target is not moved
      note: >-
        a state with memory because a BODY target is relative to the moment it was asked for: read
        every tick it would turn with the vehicle and never be reached

  - id: control_torque
    node: rcs_thrust
    method: algebraic
    unit: "N*m"
    # The DAP's couple geometry, held to `geometry.rcs_sm` by `same_as`.
    pitch_yaw_radius_in: 82.36
    roll_radius_in: 83.0
    cant_deg: 10.0
    quad_offset_deg: -7.25
    thrust_n: 445
    ixx_kg_m2: 80081.1
    iyy_kg_m2: 760263.3
    izz_kg_m2: 767311.8
    pxy_kg_m2: -14932.2
    pxz_kg_m2: -6371.9
    pyz_kg_m2: 1638.5
    same_as:
      pitch_yaw_radius_in: "domains/rcs/components.yaml:geometry.rcs_sm.pitch_yaw_radius_in"
      roll_radius_in: "domains/rcs/components.yaml:geometry.rcs_sm.roll_radius_in"
      cant_deg: "domains/rcs/components.yaml:geometry.rcs_sm.cant_deg"
      quad_offset_deg: "domains/rcs/components.yaml:geometry.rcs_sm.quad_offset_deg"
      thrust_n: "domains/rcs/components.yaml:components.thruster_100lbf.thrust_n"
      ixx_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.ixx.value"
      iyy_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.iyy.value"
      izz_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.izz.value"
      pxy_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.pxy.value"
      pxz_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.pxz.value"
      pyz_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.pyz.value"
    geometry_provenance:
      basis: historical
      source: >-
        CSM/LM Spacecraft Operational Data Book Vol. III, SNA-8-D-027(III) Rev 2, Figure 2-5
        (printed p. 2-6): pitch and yaw thrust lines meet at 82.36 in from the X axis and the roll
        thrust lines at 83.00 in, every engine canted 10 deg; read from the rendered drawing by the
        research thread (`/mnt/project-files/sources/rcs.md` Q2). GSOP R-577 Section 6 Rev. 1, s.
        6.4.1.3, OFFSET 7.25 deg "by a negative rotation about the +X axis" and CANT 10.0 deg:
        https://www.ibiblio.org/apollo/NARA-SW/R-577-sec6-rev1.pdf
      note: >-
        each couple's own radius rather than the GSOP's averaged 82.68 in. The roll jets' +/-0.94
        in axial offsets give each roll firing a pitch or yaw torque of about 1 % of its roll
        torque and are left out (G-5)
    rate_floor_deg_s: 0.0013
    rate_floor_provenance:
      basis: derived
      relation: >-
        the rate one minimum-impulse couple pulse gives the stiffest axis: 2 x 4.2 N s x 83.00 in x
        0.0254 x cos 10 deg / 760,263.3 kg m2 (pitch) = 2.29e-5 rad/s = 0.0013 deg/s. Below it the
        DAP cannot correct a rate, so inside the deadband it does not try
    provenance:
      basis: derived
      relation: >-
        `rules.py`: the eigenaxis rotation to `held_target`, flown at the smaller of the loaded rate
        and `sqrt(2 alpha theta)`, with the torque that closes the rate error in one tick plus the
        gyroscopic term `w x I w`, scaled until no control axis exceeds its couple, `2 F r cos(cant)`
      note: >-
        the slew law the arc review asked for (decision 5), built behind `set_attitude_target`
        rather than as a mode enum: a mode is which target is held. Averaged over the tick, so the
        allocator's per-pulse widths, the 100 Hz frame and the deadband wander are not here; they
        are 6-DOF's, and what a fleet can act on is the slew's time, its propellant and its axis

  - id: thrust_total_n
    node: rcs_thrust
    method: algebraic
    unit: N
    isp_s: 277.8
    g0_m_s2: 9.80665
    pulse_impulse_ns: 4.2
    pulse_propellant_kg: 0.002472
    same_as:
      isp_s: "domains/rcs/components.yaml:components.thruster_100lbf.isp_s"
      pulse_impulse_ns: "domains/rcs/components.yaml:state.thruster_thrust.pulse_impulse_ns"
      pulse_propellant_kg: "domains/rcs/components.yaml:state.thruster_thrust.pulse_propellant_kg"
    provenance:
      basis: derived
      relation: >-
        the sum of `thruster_thrust`, and in the hold that sum times the pulse's propellant price
        relative to steady firing, 0.002472 kg x 277.8 s x 9.80665 / 4.2 N s = 1.603: what
        `E-RCSP-RCS` multiplies by 1/(Isp g0) to drain `consumables.prop_rcs_kg`
      note: >-
        the scalar the tank's drain reads, because a drain multiplies a number and the per-jet map is
        not one. It is the propellant's thrust, not the impulse's: `impulse_total` books what the
        jets delivered and this books what they burned, and the two part company only in the hold

  - id: thruster_valve
    node: rcs_valves
    method: discrete
    unit: "map[thruster_id,bool]"
    moved_by:
      - "logic:the allocator commands each valve from the requested wrench"
      - "command:set_rcs_quad"
      - "command:isolate_rcs_manifold"
    command_value:
      - verb: set_rcs_quad
        argument: state
        key: group
        maps:
          enable: true
          inhibit: false
        why: >-
          the map is a boolean per thruster and the command speaks in `enable`/`inhibit`: two values
          onto two values, and the pairing is readable off neither side, so it is written. This is
          the whole of what a two-valued command against a `bool` needs
      - verb: isolate_rcs_manifold
        argument: branch
        key: branch
        constant: false
        why: >-
          closing a feed branch is a topology action rather than a valve command: `branch` selects
          *which* thrusters lose their feed and the value is the same one for all of them. The
          thrusters on an isolated branch are not commanded closed — they are unfeedable, and the
          valve map says so for each of them
    dwell:
      min_on_s: 0
      min_off_s: 0
      provenance:
        basis: chosen
        reason: >-
          `set_rcs_quad` changes group enable/inhibit preference, not an injector-coil pulse.
          Its help promises inhibit is always allowed and permits re-enabling a latched group;
          no source qualifies a minimum group-command hold or cooldown. Both directions use
          zero policy dwell so a safety inhibit and a deliberate recovery can take effect
          immediately. Pulse timing remains owed on `state.pulse_width`.
    provenance:
      basis: apollo
      ref: "apollo_diode.md:149"
      note: >-
        `rcs.thruster_[n]_valve` is apollo's, and it is a *commanded* state — which is why the
        protection is a dwell rather than a hysteresis band. This state is moved by
        `set_rcs_quad`, so the dwell guards group enable/inhibit rather than an injector-coil
        pulse. `set_rcs_quad` promises that inhibiting is always allowed and a latched group
        may be deliberately re-enabled. Its group policy dwell is zero in both directions;
        that is not a claim that an injector can produce a zero-duration pulse.

  - id: thruster_thrust
    node: rcs_thrust
    method: dynamics
    unit: "map[thruster_id,N]"
    # The rule is `domains/rcs/rules.py` (ADR 0005): each SM jet's thrust averaged over the tick,
    # from the couple the slew law fires per control axis, or from the hold's limit cycle. The rise
    # and tailoff constants below are not applied: averaged over a tick they move a slew's impulse by
    # under a per cent, and the pulse's own shape is what `pulse_impulse_ns` prices.
    tau_rise_s: 0.04
    tau_fall_s: 0.05
    thrust_n: 445
    isp_s: 277.8
    same_as:
      thrust_n: "domains/rcs/components.yaml:components.thruster_100lbf.thrust_n"
      isp_s: "domains/rcs/components.yaml:components.thruster_100lbf.isp_s"
      pitch_yaw_radius_in: "domains/rcs/components.yaml:state.control_torque.pitch_yaw_radius_in"
      roll_radius_in: "domains/rcs/components.yaml:state.control_torque.roll_radius_in"
      cant_deg: "domains/rcs/components.yaml:state.control_torque.cant_deg"
      quad_offset_deg: "domains/rcs/components.yaml:state.control_torque.quad_offset_deg"
      ixx_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.ixx.value"
      iyy_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.iyy.value"
      izz_kg_m2: "vehicle.yaml:mass_properties.configurations.csm_lm_docked.inertia_kg_m2.izz.value"
    pitch_yaw_radius_in: 82.36
    roll_radius_in: 83.0
    cant_deg: 10.0
    quad_offset_deg: -7.25
    ixx_kg_m2: 80081.1
    iyy_kg_m2: 760263.3
    izz_kg_m2: 767311.8
    # The DAP's two-jet couples per control axis and sign (R-577 s. 3, Tables 3.2-III to 3.2-X, the
    # rows with every quad up). Roll is flown on the AC roll jets, 13-16: `couples_note`.
    couples:
      "+pitch": [1, 3]
      "-pitch": [2, 4]
      "+yaw": [5, 7]
      "-yaw": [6, 8]
      "+roll": [13, 15]
      "-roll": [14, 16]
    couples_note: >-
      which roll pair the DAP uses is a crew choice (Noun 46 register 2, "AC Roll: 1 -- Use AC Roll,
      0 -- Use BD Roll", R-577 s. 3.2.2.1, printed p. 3.2-6), and the cut does not record it: AC is
      chosen until the roll selection is a command. Both pairs have the same arm, so the choice moves
      which jets age and which quad's propellant goes, and nothing about the torque. The jet
      numbers are the DAP's (WP03 G-2, `geometry.rcs_sm.jets` on PR #44): +pitch is jets 1 (quad C,
      +X) and 3 (quad A, -X), and so on, each pair a pure couple
    # The minimum-impulse pulse the hold's limit cycle is made of.
    pulse_impulse_ns: 4.2
    pulse_propellant_kg: 0.002472
    pulse_provenance:
      basis: historical
      source: >-
        CSM/LM Spacecraft Operational Data Book Vol. I, SNA-8-D-027(I) Rev 3: Figure 4.3-3 "Service
        Module RCS Engine Vacuum Total Impulse Versus Electrical ON Time", printed p. 4.3-32, read at
        15 ms as 0.95 lbf s nominal (0.81-1.12), 4.2 N s; and s. 4.3.4.1, printed p. 4.3-4:
        "Service module RCS propellant consumption is at the rate of 0.00545 pound per pulse for
        PGNCS minimum impulse control (pulse width = 14 ms)", 0.00545 x 0.45359237 = 0.002472 kg.
        Read from rendered pages by the research thread, `/mnt/project-files/sources/rcs.md` Q3:
        https://www.ibiblio.org/apollo/Documents/HSI-41539.pdf
      note: >-
        two figures for one pulse, and their ratio is the point: 4.2 N s from 2.472 g is an
        effective 173 s, against 277.8 s steady. A hold made of minimum pulses spends propellant 1.6
        times faster than its delivered impulse says, so the impulse-derived gauge
        (`propellant_estimate`) reads high against the ledger for as long as the vehicle holds. That
        is a real Apollo disagreement between two gauges, and a fleet that reads it as a leak has
        read a true observation wrongly. The 14 ms is the PGNCS's own floor (R-577 s. 3.2.3,
        printed p. 3.2-27: "the firing time can never be less than 14 ms")
    provenance:
      basis: historical
      source: >-
        `lm_propulsion_rcs_study_guide.pdf`, PDF p. 89, printed p. 77. Build-up: the propellant
        valves take "about 7 milliseconds to reach full opening", propellants "reach the chamber
        about 12 milliseconds after the 'open' command", and "combustion build-up to stable burning
        is achieved at about 40 milliseconds". Tailoff: on shutdown the valves reach "the full
        closed position 5 milliseconds later", flow "starts decreasing about 4 milliseconds
        following the shutdown command and is zero about 9 milliseconds later", the trapped head
        volume makes the "total thrust tail off lasting about 50 milliseconds", and "thrust drops
        from 100 lbs. to 20 lbs. in the first 10 milliseconds ... the remaining decay from 20 lbs.
        to 0 lbs. takes 40 milliseconds"
      relation: "F(t) = 445 N * rise(t; tau_rise) falling with tau_fall; amplitudes from vehicle.yaml#propulsion.rcs_*.thrust_n"
      note: >-
        rcs_dode.md:869 is explicit that "physical valve opening and thrust buildup are separate
        hardware-configured quantities and must appear in the timing model", and they are in it
        now. **The two numbers are the published stage times read as the time constants of the
        first-order model this state declares**, and the difference matters: the guide describes a
        build-up that is *zero* until about 12 ms and stable at about 40 ms, which is a dead time
        followed by a rise, and one exponential cannot express a dead time. So tau_rise = 40 ms is
        the published build-up time standing in for a curve this model does not have, and the 12 ms
        transport delay is **not represented** — recorded here rather than folded into the constant,
        because a curve fit would be a number no source gives. The asymmetry rcs_dode.md asks for is
        intact: 40 ms rising and 50 ms falling is what makes a minimum-width pulse deliver less
        impulse than its width times full thrust. Both are on the same state on purpose, and the
        7/12/40 and 5/4/10/50 millisecond stages are in the source string above so that a later
        round can replace the first-order reading without re-opening the document

  - id: pulse_residual
    node: internal
    method: stock
    unit: "map[thruster_id,N*s]"
    initial: 0
    initial_provenance:
      basis: chosen
      reason: "the accumulator starts empty and nothing in the mission pre-loads it. It is the *residue* of a fixed-point integration rather than an inventory, so its only honest starting value is zero — and saying so is what separates it from the tanks, whose initial amount is a fact about the pad"
    quantum: 0.000445
    provenance:
      basis: derived
      relation: "r_i <- I_acc - I_hat(t_i), with I_acc = I* + r_i (rcs_dode.md:807-825); quantum = F * dt_q from capability.quantum_impulse"
      note: >-
        the residual accumulator, and the vehicle's clearest example of why plant.md §4 insists
        on a Bresenham accumulator for fixed-point stocks. The conservation is exact by
        construction: every newton-second requested is either delivered or held, and the
        quantity that crosses the boundary is one integer number of quanta applied once. A
        float accumulator would lose the last bit on every pulse, and over the LM's thousands
        of short firings (apollo_diode.md:143) that is a propellant gauge that drifts against a
        ledger for no physical reason — which is precisely the signature the consumables domain
        models as a *fault* (CNS-11). Getting the arithmetic wrong here would manufacture a
        false positive of a real failure mode

  - id: pulse_width
    node: internal
    method: algebraic
    unit: "map[thruster_id,us]"
    t_min_on_s: UNCONFIGURED
    provenance:
      basis: derived
      relation: "t_i = quantize(I_acc / F_eff, dt_q), subject to t_i >= t_min_on (rcs_dode.md:816-820)"
      note: >-
        the last width the pulse generator committed to, published per pulse so that "the valve
        was commanded" becomes "the valve was commanded *for this long*". The quantization
        step is derived (the plant's microsecond grid). The per-thruster command floor stays owed
        until a thruster-to-system map and the applicable automatic or pulse-mode command path
        select the scoped capability value. A width below its eventual floor must be refused
        rather than truncated, because the delivered impulse of a truncated pulse is unknown

  - id: impulse_total
    node: internal
    # A sum the rule keeps (`rules.py`), not a stock the plant integrates: a stock is driven by
    # edges, and the sentinel has none, so as a stock this state could never have moved (ADR 0005).
    method: dynamics
    unit: N*s
    initial: 0
    initial_provenance:
      basis: chosen
      reason: "the accumulator starts empty and nothing in the mission pre-loads it. It is the *residue* of a fixed-point integration rather than an inventory, so its only honest starting value is zero — and saying so is what separates it from the tanks, whose initial amount is a fact about the pad"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:152"
      note: >-
        `rcs.total_impulse_ns`, "monotonically rising", with an "excessive use rate" event.
        Accumulated as a quantized stock for the same reason as the residual. This is the
        channel that prices F-04's secondary effect — a stuck-on thruster's first unmistakable
        trace is not the valve, which reads as commanded, but a total impulse climbing when
        nothing was asked for

  - id: propellant_estimate
    node: internal
    method: algebraic
    unit: "%"
    # The field the arithmetic produces, named by the state's own id — the second state in the
    # corpus to use that spelling, after round 47's two cabin pressures: what this state *is* is
    # what its relation says, so there is no parameter of it to name instead.
    propellant_estimate: 100
    provenance:
      basis: derived
      computes: propellant_estimate
      derivation:
        # **The relation was a sentence and every ingredient was declared.** `impulse_total` is the
        # stock this domain already integrates, and `capability.impulse_capacity` is the
        # load x Isp x g0 product the file derives for each of the three systems. One of them has to
        # be chosen, and `rcs_sm` is the right one: the channel's own events and the consumables
        # ledger's `rcs_firings` consumer are the service module's, and the other two are the same
        # article with their own loads.
        expression: "100 * (1 - impulse_used / capacity)"
        inputs:
          impulse_used: impulse_total
          capacity: domains/rcs/components.yaml:capability.impulse_capacity.values.rcs_sm
      relation: "100 * (1 - impulse_total / (load * Isp * g0)), with load and Isp from vehicle.yaml#propulsion.rcs_*"
      note: >-
        `rcs.propellant_remaining_pct` is apollo's (:151, with 25 % and 10 % events) and it is
        an *estimate*, so this is the model that produces it: propellant inferred from
        integrated impulse rather than measured. That makes it the second of two answers to one
        question — the consumables domain keeps the ledger, as a conserved mass depleted by the
        actual flow — and the difference between them is diagnostic. It is also composite:
        a leak (mass gone without thrust) and a wrong Isp (thrust for the mass that did burn)
        push it the same way, so the pair cannot separate them without a third source. Saying so
        is the point; a fleet that reads the disagreement as a leak has learned something false
        from a true observation

  - id: feed_pressure
    node: internal
    method: algebraic
    unit: "% nominal"
    tank_volume_m3: UNCONFIGURED
    provenance:
      basis: derived
      relation: "regulated helium blowdown: p = (n_He + n_vapour) R T / (V_tank - V_propellant); inputs prop_rcs and pressurant_he (coupling.yaml)"
      note: >-
        the producer of apollo's `rcs.quad_[a-d]_feed_pressure_pct` and its <90 % event, and a
        *derived* quantity rather than a measured one because there is no feed-pressure state
        anywhere else on the vehicle: the consumables domain keeps the masses and this is what
        they imply. One value is owed and it is the tank volume, so the channel exists, its
        events exist, and the constraint on it is named rather than filled in. It is also the
        channel RCS-07 and RCS-08 move, which is why leaving it unproduced would have been a
        hole rather than an omission.

  - id: attitude_error
    node: internal
    method: algebraic
    unit: deg
    # The rule is `rules.py`: the angle between the attitude and `held_target`. It reads the truth
    # until `gnc.nav_solution` lands (`reads:` above).
    provenance:
      basis: derived
      relation: "q_e = q_target^-1 (x) q_est; e_theta = 2*sign(q_e,w)*q_e,v (rcs_dode.md:625-631), reduced to the rotation angle"
      note: >-
        the scalar the phase-plane latch switches on and the evidence that a target was
        actually acquired. `rcs_dode.md:726` requires the allocator to let the mission layer
        distinguish "target not reached because guidance changed" from "target is physically
        unachievable", and the error alone cannot do it — but neither can anything else without
        it, because a target is a request and this is the only measurement of whether the
        request was granted

  - id: deadband_latch
    node: internal
    method: discrete
    unit: bool
    moved_by:
      - "logic:the comparator latch that decides whether to request corrective torque"
    hysteresis:
      assert: UNCONFIGURED
      clear: UNCONFIGURED
      dwell_ms: UNCONFIGURED
    provenance:
      basis: historical
      source: "rcs_dode.md:668-680, the phase-plane switching variable s = omega_e + k_p*theta_e with separate fire and release boundaries"
      note: >-
        the comparator latch that decides whether to request corrective torque, and the reason
        `rcs.deadband_deg` is a published telemetry rather than a constant. The three values are
        owed together because they are one design: the fire boundary, the release boundary below
        it, and the dwell that stops a boundary crossing from becoming a pulse train. Deriving
        them needs inertia, disturbance torque, sensor noise and the impulse bit — the inertia
        is the unpublished debt in vehicle.yaml and the impulse bit is the unpublished debt in
        this file, so the whole band is downstream of two numbers nobody has. It is declared
        latched and unset rather than given a plausible value: a deadband that is wrong by a
        factor of three is not a slightly worse controller, it is a controller that either
        chatters the valves or never fires them

  - id: allocation_status
    node: internal
    method: discrete
    unit: "enum[feasible,constrained,infeasible]"
    moved_by:
      - "logic:the allocator's own verdict on the wrench it was asked for"
    hysteresis:
      assert: UNCONFIGURED
      clear: UNCONFIGURED
      dwell_ms: UNCONFIGURED
    provenance:
      basis: historical
      source: "rcs_dode.md:722-727 and :1055, allocation_status published so that a physically unachievable target is distinguishable from a changed one"
      note: >-
        and the hysteresis band here is not a debounce, it is the *middle value*. A residual
        above the assert boundary is `infeasible`; below the clear boundary it is `feasible`;
        inside the band the request is still being met but with less margin than the design
        intends, and that is what `constrained` means. So the three-value enum and the two-band
        latch are the same object, and collapsing it to a boolean would delete the only warning
        that arrives *before* a request is refused

  - id: authority_margin
    node: internal
    method: algebraic
    unit: normalized
    provenance:
      basis: historical
      source: "rcs_dode.md:231, :889 and :1056 — the allocator recomputes available control authority before the mission layer decides anything, and its loss is the safe-hold trigger"
      note: >-
        how much of the commandable wrench set is still reachable, normalized by the design's
        requirement. It is the attitude-control analogue of a propellant gauge and it is the
        reason F-05's chain is dangerous in an unexpected direction: the pressure-switch failure
        costs no authority at all, and the *operators* cost it by isolating a healthy thruster
        on one sensor's word. Of every number this domain publishes, this is the one that moves
        when a fleet makes a mistake

  - id: safety_state
    node: internal
    method: discrete
    unit: "enum[nominal,rate_damp,safe_hold,fault_safe]"
    moved_by:
      - "logic:the ladder whose entry conditions are FDIR conclusions"
    dwell:
      min_on_s: 5
      min_off_s: 5
    provenance:
      basis: historical
      source: "rcs_dode.md:867-887, the safe-mode ladder; :889 on FAULT_SAFE not meaning 'fire nothing'"
      note: >-
        the ladder, with a five-second dwell (chosen): its entry conditions are FDIR conclusions
        that are already latched, so the dwell is a floor against re-entry chatter rather than a
        control parameter, and a safety posture that can change five times a second is one no
        log can be read against. What the ladder is *not* is a request to stop: `fault_safe` is
        the rung where a passive vehicle may be less safe than a rate-damping one — LRO's Sun
        Safe exists for power and thermal reasons, not because pointing at the Sun is
        intrinsically safe — so the enum says how degraded the service is and says nothing about
        whether it is firing

  - id: mode
    node: internal
    method: discrete
    unit: "enum[auto,manual,free_drift]"
    initial: auto
    initial_provenance:
      basis: derived
      source: mission.yaml:launch_state
      relation: "dap_active and sc_cont_cmc and cmc_mode_auto => auto"
      source_configuration:
        dap_active: {action: V46E, checklist_pdf_page: 53}
        sc_cont_cmc: {position: CMC, checklist_pdf_page: 55}
        cmc_mode_auto: {position: AUTO, checklist_pdf_page: 59}
        mapping_authority: {handbook_pdf_page: 57, section: "4.7.1.6"}
      note: >-
        in the Apollo 17 CSM Launch Checklist (Basic), 4 September 1972, the RCS DAP is loaded
        (PDF pp. 49 and 53) and activated by `V46E` (p. 53), AUTO RCS SELECT is set to MNA/MNB
        with MANATT at RATE CMD (p. 54), SC CONT is set to CMC (p. 55), and CMC MODE is set to
        AUTO at LM ejection (p. 59), with no intervening contrary selection before the post-ejection
        P00 start. Apollo Operations Handbook, Block II Spacecraft, SM2A-03-BLOCK II, G&C sections
        4.6-4.8, PDF p. 57, section 4.7.1.6 identifies CMC, ISS and active RCS DAP as the
        autopilot-control path. Map that CMC DAP ownership to this vehicle's `auto`, whose
        command help defines it as the service flying the attitude loop. The mapping is a model
        interpretation of published switch/program settings, not a historical Apollo mode name.
    initial_note: >-
      the RCS mode at the post-ejection P00 start, before the later V49 maneuver. The launch
      checklist's CMC control selection and active RCS DAP, followed by CMC MODE AUTO at LM
      ejection, make the computer the attitude-loop controller at this cut. The Block II handbook
      explains how those pieces enable autopilot control; `initial_provenance.relation` records
      the mapping to the vehicle's synthetic `auto`. P00 is an operative idling computer major mode
      and does not itself disable DAP attitude control. `manual` hands the loop to crew switches;
      `free_drift` leaves no attitude controller. `V49E` later can request an automatic or manual
      maneuver and is deliberately outside the MET 0 cut; it is not evidence for this initial mode.
    moved_by:
      - "command:set_rcs_mode"
    dwell:
      min_on_s: 2
      min_off_s: 2
    provenance:
      basis: apollo
      ref: "apollo_diode.md:147"
      note: >-
        apollo's three modes and no others: vocabulary §4 rules that rcs_dode.md:365's ATT_HOLD
        and TRACK are *targets*, argued through `set_attitude_target`, not modes. `manual` is
        the one that carries real weight here — in it the crew are the controller, and the
        commands reach the valves through `controls.switches` rather than through this service.
        Two seconds of dwell (chosen) because a posture that can change every tick is
        indistinguishable in a log from a fault

# --------------------------------------------------------------------------------------
# Components. The actuator inventory and the three strings it is wired as.
# --------------------------------------------------------------------------------------
components:

  - id: thruster_100lbf
    kind: flow
    class: thruster
    thrust_n: 445
    isp_s: 277.8
    count: 32
    vehicle_keys: [rcs_sm, rcs_lm]
    provenance:
      basis: historical
      source: "vehicle.yaml#propulsion.rcs_sm/rcs_lm — 16 SM + 16 LM = 32 thrusters, all 100 lbf, from A11 Tbl 8-XI and 9-XV"
      note: >-
        one component for the thirty-two SM and LM thrusters because they are the same article at
        the same throttle, and thirty-two near-identical entries would be thirty-two places for the
        arithmetic to differ. The twelve CM engines were in this article until the CSM Data Book
        showed them to be a different engine; they are `thruster_cm`. **C-26 is closed and this article carries the guide's figure now**:
        the 290 s that stood here was sourced to nothing, `lm_propulsion_rcs_study_guide.pdf` PDF
        p. 90 states both an Isp (275 s approx) and the flow rates of the same thruster
        (0.24 + 0.12 lb/s at 100 lbf), and those two agree with each other on 277.78 s. The
        operator's decision is recorded in `../integration/reconciliation/01-conflict-register.md`;
        what it moved is `E-RCSP-RCS`, `mass_flow_per_thruster` and the three `impulse_capacity`
        figures, together and in one round

  - id: thruster_cm
    kind: flow
    class: thruster
    thrust_n: 427
    isp_s: 272.0
    count: 12
    vehicle_keys: [rcs_cm]
    provenance:
      basis: historical
      source: >-
        CSM/LM Spacecraft Operational Data Book, Vol. I CSM Data Book, SNA-8-D-027(I) Rev 3,
        Table 4.4-1 "Command Module RCS Engine Vacuum Steady-State Performance", printed p. 4.4-9:
        thrust 96.0 lb (+3.6/-3.7) = 427 N, Isp 272.0 +/- 6.9 s, expansion ratio 9.00
        (https://www.ibiblio.org/apollo/Documents/HSI-41539.pdf)
      note: >-
        the CM engine is its own article: ablatively cooled at 9:1 where the SM engine is
        radiation-cooled at 40:1 (TN D-7151 pp. 3, 9-10; AOH printed p. 2.5-47 "nominal thrust 93
        pounds"). The Data Book's qualification figures are the ones taken, as its Table 4.3-1 is
        for the SM. A declaration only: the jets are `geometry.rcs_cm.jets` and the decision is
        docs/evidence/wp03-rcs-geometry.md G-7

  - id: pulse_generator
    kind: discrete
    class: controller
    frame_hz: 100
    provenance:
      basis: historical
      source: "rcs_dode.md:836, the 100 Hz reference control frame with its 8 ms pulse-quantization deadline"
      note: >-
        the last trusted software layer before the drivers, and the owner of the residual
        accumulator, the minimum-pulse check and the interlocks. Its 100 Hz frame is a
        *sub-step* inside the 50 Hz plant tick through the event queue, not a second plant rate

  - id: valve_driver
    kind: discrete
    class: driver
    driver_current_a: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: >-
        rcs_dode.md:1064 detects the driver open-circuit and overcurrent faults from a current
        envelope that nobody publishes for this thruster. The *fault* is in fault_policy.yaml
        because the vehicle must have it; the envelope is not invented, so RCS-06 is detectable
        only through its consequences until the number exists

  - id: rcs_string_sm_primary
    kind: discrete
    class: string
    thrusters: 8
    feeds: 2
    vehicle_keys: [rcs_sm]
    provenance:
      basis: historical
      source: "vehicle.yaml#propulsion.rcs_sm — 16 thrusters in 4 quads; the SM flew two independent systems, which is what makes a string isolable"
      note: >-
        a string is the unit of `isolate_rcs_manifold` and `set_rcs_quad`: the
        smallest set of thrusters a fleet can give up and still have a usable vehicle

  - id: rcs_string_sm_secondary
    kind: discrete
    class: string
    thrusters: 8
    feeds: 2
    vehicle_keys: [rcs_sm]
    provenance:
      basis: historical
      source: "as the primary string. This is the one Apollo 13 ran on after the SM's other systems were lost"
      note: "the redundant half, and the reason a stuck-on thruster is survivable at all"

  - id: rcs_string_cm
    kind: discrete
    class: string
    thrusters: 12
    feeds: 2
    vehicle_keys: [rcs_cm]
    provenance:
      basis: historical
      source: "vehicle.yaml#propulsion.rcs_cm — two systems of six thrusters (A11 Tbl 8-XI)"
      note: "the command module's own system, used for entry attitude and for separation transients"

  - id: rcs_string_lm
    kind: discrete
    class: string
    thrusters: 16
    feeds: 4
    vehicle_keys: [rcs_lm]
    provenance:
      basis: historical
      source: "vehicle.yaml#propulsion.rcs_lm — 16 thrusters in 4 clusters of 4 (A11 Tbl 9-XV)"
      note: >-
        the busiest system on the vehicle. apollo_diode.md:143 notes the LM flew thousands of
        short firings, which is why pulse accounting matters here more than thrust does, and why
        an unset minimum firing time hurts this string most

# --------------------------------------------------------------------------------------
# What is still owed, in the domain's own words rather than the linter's.
# --------------------------------------------------------------------------------------
open_debts:
  - "**The slew law reads the truth.** `control_torque`, `held_target` and `attitude_error` read `vehicle_dynamics` until `gnc.nav_solution` produces an estimate. On the estimate, a drifted platform makes the service hold the wrong attitude while `rcs.attitude_error_deg` reads zero, which is the confounder GNC-01 exists for (ADR 0005)."
  - "**LVLH targets are recorded and not flown.** `held_target` resolves EARTH_J2000, MOON_J2000 and BODY. An LVLH target needs the orbit-referenced axes and which body the vehicle is referenced to (`vehicle.yaml#frames`: Earth while Earth-referenced, Moon while lunar), which needs the phase; until then it records `status: frame_owed` and keeps the previous target."
  - "**Only the docked stack is flown.** The law and `gnc.body_rate` carry the docked stack's inertia tensor (`same_as` to `vehicle.yaml#mass_properties`); CSM-alone, LM and the separated configurations are owed there by name and here by consequence. The SM jets fly the stack; the CM's and the LM's jets do not fire."
  - "**The deadband wander is not simulated.** The hold sits on its target and pays the minimum-impulse limit cycle's propellant; the vehicle's attitude does not wander across the +/-0.5 or +/-5 deg band. A body-fixed sensor or antenna would see that wander, and the comms pointing is gimballed, so the cost is small until a consumer reads it."
  - "**A string is not a thruster.** `thruster_valve` is keyed by `thruster_id` and `set_rcs_quad` names a `group` — `sm_primary`, `sm_secondary`, `cm`, `lm` — so the key declaration says which argument selects the elements and the argument cannot name them. `rcs_string_sm_primary` and its siblings carry a `thrusters: 8` count and a `vehicle_keys` link; what none of them declares is *membership*, which is the same list the allocator needs for its wrench matrix. `isolate_rcs_manifold` is the other half: `branch` names a feed branch, and which thrusters a branch feeds is owed with the thruster geometry. **Quad membership is now declared** (`geometry.rcs_sm.jets[].quad`, four jets on each of A-D) and it does not fit the two eight-jet SM strings: the SM flew four independent quads (TN D-7151 p. 3, \"four independent assemblies, each of which was composed of a four-engine cluster\"), so the strings are a model decision for the RCS lane, not a transcription."

  - "The per-thruster minimum command-ON floor is owed until each thruster has SM, CM or LM membership and the controller path is named. Group enable/inhibit has a chosen zero policy dwell in both directions so inhibit and deliberate re-enable remain available; it is not an injector-pulse qualification. LM pulse-mode 10 ms and SM automatic-controller earliest OFF 12 ms are separately sourced under `capability.minimum_command_on_s`; CM hardware command timing remains unpublished in the sources reached. None is a delivered impulse bit or a universal qualification. The maximum ON time and duty cycle remain owed."
  - "Thrust rise and tailoff time constants. The asymmetry between them is what a total-impulse gauge misreads, and no source gives either."
  - "The other configurations' inertia tensors, owed by `vehicle.yaml` by name. **The docked stack's is flown** (ADR 0005): `control_torque` and `gnc.body_rate` carry it, `E-RCS-DYN` is closed on it, and the deadband is the DAP's own two settings. What this domain still cannot build is the general wrench matrix for all forty-four jets; the slew law fires the SM's sixteen through the DAP's couples, from the radii and cant in `geometry` (WP03)."
  - "Thruster geometry: what is left after WP03. **All three tables have landed** (`geometry`: SM jets 1-16 on quads A-D with their AOH engine names, CM engines 11-26 with positions and thrust directions, LM jets 1-16), so the allocator can build `B = [F_i d_i ; r_i x F_i d_i]` (rcs_dode.md:685-693) once each configuration supplies its centre of mass. What stays approximate, each recorded in `docs/evidence/wp03-rcs-geometry.md`: the SM roll thrust lines' 0.94 in fore-aft offset, the CM forward pitch engines' undimensioned tilt and the CM nozzle extensions' alignment angles. The CM article split (G-7) has landed as `thruster_cm`; this entry stays open for those three approximations."
  - "The mission's RCS propellant allocation. `rcs.total_impulse_ns` can be checked against the load (capability.impulse_capacity) but the mission declares no RCS budget, so the three systems still carry the linter's 'no mission burn' note while their loads are flown by attitude control, which no budget line can price."
