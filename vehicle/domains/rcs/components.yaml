    thrusters: 12
    feeds: 2
    vehicle_keys: [rcs_cm]
    provenance:
      basis: historical
      source: "vehicle.yaml#propulsion.rcs_cm — two systems of six thrusters (A11 Tbl 8-XI)"
      note: "the command module's own system, used for entry attitude and for separation transients"

  - id: rcs_string_lm
