# domains/comms/components.yaml — the link as an operational resource.
#
# ## Why this domain is authored rather than extracted
#
# Conflict C-14: `communcations_diode.md` contains **no communications subsystem**. `snr`,
# `antenna`, `pointing`, `carrier` and `S-band` occur zero times in it; its own open-parameter
# register is 33 rows of `UNSPECIFIED`. It is a secure-transport specification for the diode
# itself, and it was not wasted — it produced D-01 (the two one-way channels) and D-02 (the
# structured result block) — but it is a different document wearing the domain's name.
#
# So the domain is authored from `apollo_diode.md:161-168` (eight channels), `:786-790` (the
# attitude → pointing → link coupling), `:243` (five verbs), `:885-903` (five telemetry profiles
# and the rule that a degraded link must actually choose what arrives), and
# `vehicle.yaml#comms` (the antennas, rates, transmitters and VHF figures already sourced from
# the Apollo 11 references). That is a complete bill of materials, which is why this is the one
# "authored" domain that is not an act of invention.
#
# ## The domain's thesis: the fleet's view is a resource it allocates
#
# `apollo_diode.md:901` is the sentence the whole domain is built around:
#
#   "When communications degrade, the simulator should actually have to choose which data
#    arrives. Do not merely set `comm.degraded=true` while delivering every telemetry field
#    normally."
#
# Every other domain on this vehicle models a quantity. This one models a *constraint on
# observation*, and it is the only place where the experiment's epistemology has a bandwidth.
# Three consequences follow, and each is a state below:
#
#   - the link's capacity is finite and the publisher must satisfy it by **dropping content**,
#     not by flagging itself degraded — `E-LINK-TEL` is declared `one_way: true` for exactly
#     this reason, and the telemetry profile is the verb that chooses;
#   - a blackout is **planned** (`comm.blackout_state`), so the vehicle records and replays
#     rather than losing, and the recorder's fill is a published stock;
#   - the amplifier is a **load**, not just a transmitter: 36 W bare and 72 W with the power
#     amplifier, which makes `set_power_amplifier` a command that can start the flagship cascade
#     with nothing wrong anywhere (`E-AMP-LOAD`, F-03).
#
# ## The edge that was a contradiction
#
# `E-DYN-GEOM` carried `value: UNCONFIGURED` beside `relation: "the coupling is the signal
# itself; one unit in, one unit out"`. An identity relation has a value and it is 1.0 — three
# sibling edges with the same relation already said so. It is fixed, and what the fix makes
# visible is that the edge and the channel are different quantities: the edge is the geometry
# (one degree of attitude is one degree of boresight error for a body-mounted antenna) and
# `comm.hga_pointing_error_deg` is the *residual* after the gimbal compensates. Collapsing them
# would have made a gimbal failure indistinguishable from a vehicle pointing the wrong way.

domain: comms

# 1 Hz: the rate of the link's published state. The RF layer has no meaningful faster cadence on
# a vehicle whose slowest physical process is a 4.4-degree beam crossing a 2-degree error band.
natural_rate_hz: 1

reads: [bus_a, coldplate_t, vehicle_dynamics, command_executive]
writes: [link, antenna_geometry, data_recorder, ground_received]

# --------------------------------------------------------------------------------------
# What the link is made of. All of it is already in `vehicle.yaml#comms`; these entries are
# the domain's view of it, and they exist so that a threshold or a fault can name the object
# it is about.
# --------------------------------------------------------------------------------------
components:

  - id: hga
    kind: state
    class: antenna
    # `vehicle_keys` is the link, and it is declared rather than inferred for the reason
    # `domain_group` and the propulsion engines' is: the two files name one antenna differently
    # (`high_gain` against `hga`), so a rule guessed from the string would have to know that `hga`
    # is short for `high_gain`. What it buys is the whole of `check_comms_bindings`: every field
    # these two views of one antenna share is compared, without a list naming which ones.
    vehicle_keys: [high_gain]
    # Which relation governs the two figures below. Declared in both files, so `check_comms_bindings`
    # compares it for free: what the vehicle-level file and this component must agree about is not
    # only the gain and the width but what kind of pair they are.
    pattern: measured
    gain_db: 25.7
    beamwidth_deg: 4.4
    steerable: true
    provenance:
      basis: historical
      source: "vehicle.yaml#comms.antennas.high_gain — NASA TN D-6723 printed p. 10, Table I: four 31-inch parabolas and an 11-inch horn, transmit 8.0/18.0/25.7 dB at 40.0/11.3/4.4 deg wide/medium/narrow"
      note: >-
        the beamwidth was 1.0 in the first version of `vehicle.yaml`, then 9.4 derived from NR's
        26.7 dB through the ideal-aperture product, and it is 4.4 now because the primary source
        publishes it: TN D-6723 gives gain and width side by side, and the four-dish array is
        about 17 % efficient against an ideal aperture of its width, so neither earlier figure
        could have been derived. What the published pair makes true is operational: 2 degrees off
        boresight is 2.5 dB down, just inside the 2.2-degree half-power edge, so apollo's 0-2
        degree "good link" (`apollo_diode.md:163`) is a margin the pointing spends. This is the
        domain that surfaced it because the beamwidth is what the pointing channel and
        `E-GEOM-LINK` scale against

  - id: omni
    kind: state
    class: antenna
    # One component, two vehicle entries: `omni_a` and `omni_b` are the same hardware declared
    # twice in `vehicle.yaml` because a *selection* needs two members and the article is one. The
    # `count` below is the four helices NR publishes, which is a different number from the two
    # selectable antennas and is not a quantity either file states twice.
    vehicle_keys: [omni_a, omni_b]
    pattern: near_isotropic
    gain_db: 0
    count: 4
    provenance:
      basis: historical
      source: "vehicle.yaml#comms.antennas.omni_a/b — four flush omni helices rated 15 W continuous"
      note: >-
        the antennas that work when nothing else does, and the reason the domain has four of them
        rather than one: an omni needs no pointing, so it is the link a vehicle keeps while it is
        not sure which way it is facing. What it cannot do is carry 51.2 kbit/s, and that trade is
        the domain's central operational fact — `select_antenna` is a choice between knowing
        where you are pointing and being able to send much

  - id: sband_transceiver
    kind: flow
    class: transmitter
    vehicle_keys: [sband_transceiver]
    dc_w: 36
    rf_w: 2.8
    provenance:
      basis: historical
      source: "apollo_diode.md:157 (36 W input) and NR ch.18 (2.8 W RF as built, against 5 W in the 1965 SP-87 design)"
      note: >-
        the load that is always there when the link is up. `E-AMP-LOAD` converts its DC input to
        bus current at 1/28 A per W, so this transmitter is 1.29 A whenever it is on and the
        amplifier is another 1.29 A — and the *step* between them is what F-03 depends on

  - id: sband_power_amplifier
    kind: flow
    class: transmitter
    vehicle_keys: [sband_power_amplifier]
    dc_w: 72
    rf_w: 11.2
    provenance:
      basis: historical
      source: "apollo_diode.md:157 (72 W input) and NR ch.18 (11.2 W RF)"
      note: >-
        a 72 W electrical step and a 4x RF gain, and the one component on this vehicle whose
        *operation* is a hazard. `apollo_diode.md:1140` and `:1158` make it the trigger of the
        degraded chain and explicitly not its root cause: the amplifier does not fail, it
        *exposes* — a marginal pump, a weak contactor, a bus with less margin than anybody
        thought. That asymmetry is why switching it on is an operator decision with a phase
        argument rather than a housekeeping detail

  - id: lm_sband
    kind: flow
    class: transmitter
    # The LM's transmitter is one article with two power levels; `vehicle.yaml` declares it as two
    # entries, one per level, because that is how a bill of materials carries a two-position
    # device. `levels` is where the two shapes meet: the keys are the vehicle entry ids, so the
    # link and the figures are the same declaration rather than two that have to agree.
    #
    # The first version of this component carried `low_dc_w`, `high_dc_w`, `rf_w_low` and
    # `rf_w_high` — four names no other component on the vehicle uses and no tool read, which is
    # what a quantity looks like when it is written for a reader rather than for a rule. They are
    # `dc_w` and `rf_w` now, twice, under the entry each belongs to.
    vehicle_keys: [lm_sband_low, lm_sband_high]
    levels:
      lm_sband_low:
        dc_w: 20
        rf_w: 0.75
      lm_sband_high:
        dc_w: 90
        rf_w: 18.6
    provenance:
      basis: historical
      source: "vehicle.yaml#comms.transmitters.lm_sband_low/high — PSR's 0.75 W and 18.6 W RF figures, with the DC inputs chosen because no LM transmitter input-power figure was found"
      note: >-
        the LM's own link, and the one that matters during the descent, the surface and the
        ascent. Its two power levels are a 70 W step in DC terms, which is 2.5 A, and it is the
        reason the LM's electrical margin during a powered descent is coupled to a communications
        decision

  - id: recorder
    kind: stock
    class: storage
    # In bits, the unit `state recorder` counts: the CM PCM record at the high bit rate, 30 minutes
    # of tape at 15 in/s x 51,200 bit/s. The same tape holds 2 hours at 3-3/4 in/s, which at
    # 1,600 bit/s is 11.52 Mbit, so the capacity in bits depends on the rate recorded; the figure is
    # the high-rate one because the high-rate dump is what the vehicle plays back (`playback_rate`).
    # The quiet-coast episode's task volume D1 + D2 is the same 92.16 Mbit: a full tape.
    capacity_bit: 92160000
    capacity_provenance:
      basis: historical
      source: "CSM AOH Block II Vol 1 (SM2A-03-BLOCK II-(1), 15 Oct 1969) §2.8, printed 2.8-24A/B: '2250 feet of tape giving record times of 2 hours at 3-3/4 ips and 30 minutes at 15 ips'; printed 2.8-60: 'If PCM HIGH is selected, the record speed will be 15 ips ... High-bit rate PCM is dumped at 15 ips (1:1)'"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:903"
      note: >-
        the on-board record. Apollo could "record telemetry via the CSM, and later retransmit
        stored information", which is what makes a lunar occultation an operational condition
        rather than a data loss. Capacity matters: it is the bound on how long a blackout can
        last before the vehicle starts choosing what to forget. The quiet-coast pass did not find
        it (TN D-7598 and TN D-7684 describe the recorder without a size); AOH Vol 1 §2.8 has it,
        as `capacity_provenance` quotes. What the vehicle still does not model is the record side:
        nothing fills this stock while the link is down, so the fill only falls

  - id: gimbal
    kind: discrete
    class: pointing
    slew_rate_deg_s: UNCONFIGURED
    range_deg: UNCONFIGURED
    provenance:
      basis: UNCONFIGURED
      note: >-
        the mechanism that keeps a 4.4-degree beam on Earth while the vehicle rotates underneath
        it, and the component F-11 fails. Both parameters are owed: the Apollo HGA's gimbal range
        and slew rate are what decide whether a pointing error is a control problem (the gimbal has
        not caught up) or an attitude problem (the vehicle is not where it thinks), and
        `comm.hga_pointing_error_deg` is the observation while these two are the explanation.
        Searched, and none has it: `csm_ecs_study_guide.pdf`, `lm_ecs_study_guide.pdf`, `lunar_module_environmental_control_subsystem.pdf`, `ApolloTrainingElectricalPowerSystemStudyGuide.pdf`, `lm_propulsion_rcs_study_guide.pdf`, `Apollo_Mission_E_Spacecraft_Reference_Trajectory_Vol4_Consumables_Analysis.pdf` and the CSM/LM Operational Data Book Volume III — the seven documents this folder has acquired and extracted. That is a bounded search rather than an exhaustive one, and naming it is what makes it checkable.
        What would answer it is the LM's communications experience report
        (`Apollo Experience Report Lunar Module Communications System.pdf`, named in the manifest's
        section 6), which is the document that would carry a steerable antenna's travel and rate —
        and it is not acquired yet, so this entry says so rather than asserting a negative

# --------------------------------------------------------------------------------------
# State. Ten, and the split between them is the domain's argument: a link that is *sending*
# badly, a link that is *not sending*, and a link that is *not supposed to be*.
# --------------------------------------------------------------------------------------
# The order these states advance in. **Nothing on the sentinel advances today** — no edge
# can target it and the rules that would move these states are domain code — so this is a
# decision about the rules rather than a consequence of them, and it is declared so the
# frozen lexicographic tiebreak is not what decides. See `internal_order_note`.
internal_order: [blackout, light_time_s, comm_mode, antenna_selection, carrier_lock, telemetry_rate, recorder_play, frame_loss]
internal_order_note: >-
  the geometry, then the link chain: whether the Moon hides the Earth, and how long light takes
  to cross the range, come first because both are read off this tick's orbit and nothing on the
  sentinel moves them, and a carrier cannot lock through the Moon; then the mode selects the antenna, the antenna decides whether the carrier locks, the
  lock decides the rate, and the playback switch follows the rate it plays at; the frame-loss
  counter is what the chain costs, last because it counts the states above it. The recorder left the sentinel for `data_recorder` when playback made it a stock
  with an edge, because no edge can reach the sentinel.

state:

  - id: link_margin_db
    node: link
    method: algebraic
    unit: dB
    moved_by:
      - "command:select_antenna"
      - "command:point_hga"
    # The rule's parameters (`domains/comms/rules.py:link_margin_db`).
    received_carrier_dbm:
      high_gain: -97.1
      omni: -119.5
    reference_range_m: 398180000
    power_amplifier_off_db: -20.0
    required_carrier_dbm:
      "1600": -120.0
      "51200": -109.0
    hga_beamwidth_deg: 9.4
    pattern_loss_db_at_beamwidth: 12
    parameter_provenance:
      basis: historical
      source: "NASA CR-125670 (Bellcomm TM-71-2034-3, Schroeder, 30 Dec 1971), Table II PDF p. 51: received carrier power Pr at R = 215,000 n mi, CSM PM mode, 85-ft station, -127.1 dBW HGA(N) and -149.5 dBW omni (0 dB) with the PA on, both 20.0 dB lower with it off; Pmin -139.0 dBW for 51.2 kbit/s telemetry with voice and -150.0 dBW for 1.6 kbit/s. PDF pp. 6-7 (printed): the power margin is 'the magnitude by which the receiver input signal power could be reduced to achieve a circuit margin just equal to zero', and 'Circuit Margins and Power Margins are not directly related because the noise in the USB receivers is a function of the receiver input signal power'"
      note: >-
        dBW is converted to dBm (+30). 215,000 n mi is 398,180,000 m (1,852 m per n mi). The
        amplifier's 20.0 dB is Table II's own step between its PA-on and PA-off rows, kept so the
        rule moves the same reference it scales; TN D-6723 PDF pp. 17-18 gives the assembly 11.2 W in PM
        and 0.125 W in bypass, which is 19.5 dB, half a decibel less. The 210-ft
        stations receive 8.0 dB more in every row of the same table; the vehicle evaluates the
        85-ft case because no state says which station is tracking. `hga_beamwidth_deg` is the
        narrow beam of `vehicle.yaml#comms.antennas.high_gain`, the beam Bellcomm's HGA(N) row is,
        and `pattern_loss_db_at_beamwidth` is the 12 dB of the quadratic pattern
        `E-GEOM-LINK` states, so the rule and the edge give the same slope.
        `tests/test_comms_rules.py` holds the copies equal
    command_value:
      - verb: select_antenna
        argument: antenna
        selects: antenna_selection
        computed: >-
          the link budget closes in one tick from the selected antenna's gain, its pointing loss,
          the range and the receiver's threshold — `comms.link_margin_db` is algebraic for exactly that
          reason, and its own note says three edges meet here. This command changes which antenna
          the budget is evaluated for; it does not carry a dB
        why: >-
          the state this command *assigns* is `comms.antenna_selection`, a `command:` mover of the
          same verb carrying the identity mapping. `link` is the node where the consequences meet,
          which is why both states are on it
      - verb: point_hga
        argument: target
        computed: >-
          as `select_antenna`: pointing loss is a term in the same budget, and the gimbal's target
          changes it rather than setting the margin
        why: >-
          `point_hga` is authority A1 and declarative; what it changes is where the high-gain
          antenna looks, and the margin follows
        selects: UNCONFIGURED
        note: >-
          the gimbal's target and mode have no state. `antenna_pointing` is on `antenna_geometry`
          and is computed from the vehicle's attitude and the Earth's direction, and it has no
          command mover at all; what this verb sets is the *requested* target (`earth`,
          `moon_limb`, `csm`, `inertial`) and the mode (`auto`, `manual`), and nothing holds it. So
          a vehicle pointed at the Moon's limb cannot say that it is, and `link_margin_db` is computed
          from a geometry the command chose but did not record
    provenance:
      basis: apollo
      ref: "apollo_diode.md:164"
      note: >-
        `comm.link_margin_db` is the corpus's `comm.snr_db` row with the quantity it can source: the
        corpus gave an SNR band of 8-30 dB marked **Sim**, and the only Apollo prediction reachable
        gives power margins, which the same report says are not an SNR (`parameter_provenance`).
        The channel's band and both thresholds were re-based on the margin, and the 12.5 dB that
        once turned one into the other is gone, because no source joins them.
        The state is *algebraic* rather than dynamic because the link budget closes in one tick:
        transmit power, antenna gain, pointing loss, range and the receiver's threshold are all
        known at the same instant, and a lag on a quantity with no memory would invent a
        transient the physics does not have. Three edges land on `link` — E-BUS-COMM (a sagging
        bus), E-PLATE-COMM (a hot amplifier) and E-GEOM-LINK (pointing loss) — and this state is
        where they meet, which is why it is one number rather than three.

        **The budget is a calibrated prediction scaled by range, not a sum of terms.** No CSM
        design-control table or circuit-loss table was reachable (the North American circuit-
        margin ICDs MH01-13001-414 and MH01-13021-414 are not on NTRS), so the rule starts from
        Bellcomm's Apollo 14 prediction, which was built on them, and moves it by the three
        things the vehicle changes: range (20 log of the range ratio), the power amplifier
        (20.0 dB) and the high-gain antenna's pointing loss. The received power checks against
        flight: JPL TM 33-452 Vol. II Table 20 logs the Apollo 11 CSM on the high-gain antenna at
        -87 to -95 dBm at the Goldstone 210-ft, against -89.1 dBm predicted. At lunar range the
        margins are Table II's own: +11.9 dB for high-rate telemetry on the high-gain antenna with
        the amplifier on, -8.1 dB with it off, and on an omni -10.5 dB at the high rate and +0.5 dB
        at the low rate — Bellcomm's finding that only 1.6 kbit/s closes on an omni at the Moon.

        What it does not carry, and each is a confounder the sources support: the station's
        nonlinearity above -70 dBm (TN D-6852 p. 8), so near the Earth the margin is a budget the
        receiver could not use; the Moon in the ground beam (about 0.3-0.7 dB, SP-87 p. 52); an
        omni's gain varying with look angle (about +/-10 dB in the Apollo 11 logs); and
        E-PLATE-COMM, whose dB per K no source gives. **It is defined in every mode and behind the
        Moon**, as the budget of the configured S-band link: whether a carrier reaches the ground
        is `blackout`'s and `comm_mode`'s, and `link_margin_loss` is gated on the occultation, so
        a planned blackout raises no alarm and the published value never goes stale behind a gap

  - id: tx_power
    node: link
    method: algebraic
    unit: W
    moved_by:
      - "command:set_power_amplifier"
    command_value:
      - verb: set_power_amplifier
        argument: state
        computed: >-
          the draw is the selected transmitter's `dc_w`, and *which* transmitter is a second
          argument of the same verb — `vehicle.yaml#comms.transmitters` carries 36 W for
          `sband_transceiver` and 72 W for `sband_power_amplifier`, and the verb's own help calls it
          "a 72 W step on the bus" (it said 36 W until ADR 0004's review). A table over two arguments is not a mapping
          over one, which is why this is `computed` rather than `maps`
        why: >-
          `tx_power` is also where the flagship thermal cycle closes: a hot amplifier draws more
          current for the same output, and that returns to the bus as extra load
        selects: transmitter_on
        note: >-
          the switch position is `transmitter_on`, which this verb moves, and `tx_power`'s rule
          (`domains/comms/rules.py`) reads it. The verb's optional `transmitter` argument is not
          discriminated: the state is the CSM amplifier's, and the LM's transmitter has no switch
          state on this vehicle yet
    # The rule's parameters (`domains/comms/rules.py:tx_power`): the transmit chain's DC input is
    # the transceiver's, always, plus the amplifier's while it is switched on.
    transceiver_dc_w: 36
    amplifier_dc_w: 72
    parameter_provenance:
      basis: historical
      source: "vehicle.yaml#comms.transmitters (apollo_diode.md:157: 36 W input for the basic S-band transceiver, 72 W for the power amplifier); the same figures as `domains/power/components.yaml#loads.csm_sband_transceiver` and `.csm_sband_power_amplifier`, which are the loads' one home"
      note: >-
        this state is the *published measurement* of the chain's DC input (`comm.tx_power_w`),
        not a load: power counts the two loads from its own inventory (ADR 0003 item 5), and
        nothing adds this number to the bus. Whether the 72 W is the amplifier alone or the
        chain with the amplifier (apollo_diode.md:157 reads "72 W input for the S-band power
        amplifier"; the verb's help said a 36 W step until ADR 0004's review) is an open question the power
        inventory carries; this rule follows the inventory, 36 + 72
    provenance:
      basis: apollo
      ref: "apollo_diode.md:168, :157"
      note: >-
        `comm.tx_power_w` with apollo's events "low output" and "high draw", and the two events
        point in opposite directions on purpose. A low *RF* output with a normal DC draw is a
        failing final amplifier; a normal output with a high DC draw is an amplifier that has
        become a load — which is the closing mechanism of the flagship cycle, where "a hot
        amplifier draws more current for the same output, which returns to the bus as extra
        load" (`coupling.yaml#C-AMP-BUS-PUMP`). One channel carrying both is what makes that
        cycle visible as a single number going the wrong way in two dimensions

  - id: transmitter_on
    node: link
    method: discrete
    unit: "enum[on,off]"
    initial: "off"
    initial_provenance:
      basis: chosen
      reason: >-
        the quiet-coast episode's declared start (`09-quiet-coast-episode.md` §5: every policy
        begins with `set_power_amplifier on`). The power amplifier's switch position after LM
        extraction was not read out of the Apollo 17 launch checklist in this pass, so this is a
        stated starting condition rather than the flown one, and a scenario may override it
    moved_by:
      - "command:set_power_amplifier"
    dwell:
      min_on_s: 10
      min_off_s: 10
    provenance:
      basis: chosen
      reason: >-
        the switch position `tx_power`'s `command_value.selects` was owed: whether the S-band power
        amplifier is energised. A plain on/off rather than a map keyed by transmitter because the
        CSM has one amplifier and the LM's transmitter has no state yet. Power gates the
        amplifier's 72 W load on it and thermal gates its heat, both through `link`, which they
        already read. Ten seconds of dwell (chosen) for the reason `antenna_selection` gives: the
        switch is a 72 W step and a ~6 dB link change, and one re-commanded every tick is one
        whose transient a fleet cannot attribute

  - id: amp_dissipation_w
    node: link
    method: algebraic
    unit: W
    moved_by:
      - "logic:the power amplifier's DC input less its RF output, while it is switched on"
    amplifier_dc_w: 72
    amplifier_rf_w: 11.2
    provenance:
      basis: derived
      relation: >-
        heat = DC input - RF output = 72 - 11.2 = 60.8 W while `transmitter_on` is `on`, and 0
        while it is off (`domains/comms/rules.py:amp_dissipation_w`). Efficiency 11.2 / 72 = 15.6 %.
        The RF leaves the vehicle through the antenna; the rest is heat in the amplifier
      source: "vehicle.yaml#comms.transmitters.sband_power_amplifier: 72 W input (apollo_diode.md:157) and 11.2 W RF (NR ch.18)"
      note: >-
        ADR 0003 item 5: `thermal.comm_amp_t` was sized for 250 W of dissipation against a 72 W
        input. This is the dissipation that derives from the input and the efficiency, and
        thermal reads it through `link` for the amplifier's heat. Private: no channel publishes
        it, because `thermal.comm_amp_c` and `comm.tx_power_w` are the observations

  - id: antenna_pointing
    node: antenna_geometry
    method: algebraic
    unit: deg
    provenance:
      basis: apollo
      ref: "apollo_diode.md:163, :786-790"
      note: >-
        `comm.hga_pointing_error_deg`, whose "0-2 **Sim** good link" range and ">2 warning; scan
        limit" events are apollo's. The value is the *residual* after the gimbal compensates, and
        that is the whole distinction between this state and `E-DYN-GEOM`: the edge is 1 deg per
        deg of attitude error and this is what is left of it once the gimbal has done its work.
        A gimbal that has reached its range limit and an attitude that has run away both produce
        a growing error here, and separating them needs `gnc.attitude_q[0..3]` and the gimbal's
        own state

  - id: antenna_selection
    node: internal
    method: discrete
    unit: "enum[high_gain,omni_a,omni_b,sband_steerable]"
    initial: high_gain
    initial_provenance:
      basis: historical
      source: mission.yaml:launch_state
      note: >-
        the Apollo 17 launch checklist selects `S BD ANT OMNI - HI GAIN` on p. 56, before docking
        (p. 57) and LM extraction (p. 59). The p. 10 omni B setting was at the pad, and p. 29
        selects omni C or D after launch. This model begins after extraction, so `high_gain` is
        the applicable documented selection rather than the pad's omni B
    moved_by:
      - "command:select_antenna"
    dwell:
      min_on_s: 10
      min_off_s: 10
    provenance:
      basis: apollo
      ref: "apollo_diode.md:167"
      note: >-
        apollo's enum with its "unexpected switch" event, and the four members are exactly the
        antennas `vehicle.yaml#comms.antennas` declares — the linter refuses a mismatch, the same
        discipline the phase, posture and crew-station vocabularies get. Ten seconds of dwell
        (chosen) because the members are 25.7 dB and 0 dB apart: a selection that can be
        re-commanded every tick is one whose outage a fleet cannot attribute, since the antenna
        changed twice while the link was down

  - id: comm_mode
    node: internal
    method: discrete
    unit: "enum[sband_high,sband_low,vhf,none]"
    initial: sband_low
    initial_provenance:
      basis: derived
      relation: >-
        the launch checklist sets `PCM BIT RATE - LOW` before TLI (p. 35) and verifies LOW after
        docking (p. 57) and extraction (p. 59). `mission.yaml#launch_state` makes
        `telemetry_rate` 1,600 bit/s; the `low` profile's `link_mode` is `sband_low`
      source: mission.yaml:launch_state
      note: >-
        **This entry used to be owed, and the reason was a join written as prose.** Round 80's note
        said `sband_high` and `sband_low` "are the same choice as `telemetry_rate`'s `high` and
        `low`", and nothing in any tool read that sentence — so the two states could hold
        `sband_low` beside 51,200 bit/s, a link mode and a rate that contradict each other, and every
        check in the linter would pass. `apollo_diode.md:161` and `:165` declare the link mode and
        the rate as two channels of one choice, and the corpus's own prose says so: "the
        high-rate/low-rate telemetry distinction was 51.2 and 1.6 kbit/s". Round 81 moved the
        correspondence into `vehicle.yaml#comms.rates#link_mode`, where the rates are already
        declared once, and `check_link_profiles` now refuses the two positions disagreeing — so the
        sentence has a reader instead of a hope
    moved_by:
      - "command:set_comm_mode"
    dwell:
      min_on_s: 10
      min_off_s: 10
    provenance:
      basis: apollo
      ref: "apollo_diode.md:161"
      note: >-
        `comm.link_mode` with apollo's "loss/change" event. `vhf` is not a fallback for the
        Earth link and the enum says so by including it: it is the LM-to-CSM and EVA channel
        (`vehicle.yaml#comms.vhf`, 296.8 and 259.7 MHz), so a vehicle in `vhf` can talk to the
        other spacecraft and not to Earth — a distinction that matters enormously during a
        descent and is invisible in a single "comms is up" boolean

  - id: carrier_lock
    node: internal
    method: discrete
    unit: bool
    moved_by:
      - "logic:the receiver's own statement that it holds the carrier"
    dwell:
      min_on_s: 2
      min_off_s: 2
    provenance:
      basis: apollo
      ref: "apollo_diode.md:162"
      note: >-
        apollo's `comm.carrier_lock`, "true nominal", with a "lock loss" event. The receiver's
        statement that it has found the signal, which is a *different* fact from having a usable
        link: a carrier can lock at a power far too low to carry data, so this channel and
        `comm.link_margin_db` together separate "the receiver has lost the vehicle" from "the receiver
        can hear it and cannot read it". Two seconds of dwell in both directions because lock
        acquisition is a search rather than an instant, and a lock bit that flickered on every
        acquisition would make every pointing maneuver look like a comms fault

  - id: telemetry_rate
    node: internal
    method: discrete
    unit: bit/s
    initial: 1600
    initial_provenance:
      basis: historical
      source: mission.yaml:launch_state
      note: >-
        the `low` profile: `PCM BIT RATE - LOW` at GET 00:23:27 in the Apollo 17 launch checklist
        (p. 35), repeated after docking (p. 57) and after LM ejection (p. 59). The pad's HI
        position at p. 10 does not apply to this model's post-extraction MET 0. The rate is
        `vehicle.yaml#comms.rates`'s 1,600 bit/s low profile
    moved_by:
      - "command:set_telemetry_profile"
    command_value:
      - verb: set_telemetry_profile
        argument: profile
        maps:
          low: 1600
          high: 51200
          emergency: UNCONFIGURED
          normal: UNCONFIGURED
          burst: UNCONFIGURED
        why: >-
          the state is a rate and the command names a profile, so the mapping is the profile's bit
          rate. Two of the five are published — `vehicle.yaml#comms.rates` declares `low` at 1,600
          and `high` at 51,200, both from `apollo_diode.md:7, :165` — and they are *carried* here
          rather than restated, which is what makes the other three visible as missing
        note: >-
          three of the five profiles have no published rate, so the vehicle can be told to run a
          profile whose bit rate it does not know. `emergency`, `normal` and `burst` are ceilings in
          `presentation.yaml`'s cadence classes rather than rates any source gives. What closes each
          is one figure: apollo's downlink rate for the mode it flew
    dwell:
      min_on_s: 5
      min_off_s: 5
    provenance:
      basis: apollo
      ref: "apollo_diode.md:165"
      note: >-
        `comm.telemetry_rate_bps` with apollo's two Apollo-inspired profiles, 1,600 and 51,200
        bit/s, and its "mode change" event. Commanded rather than measured, which is why it is a
        machine with a dwell: the rate is what the publisher has chosen to send, and the
        *achieved* rate is a different quantity visible only as frame loss. The two together are
        the domain's bandwidth story, and a fleet that reads the commanded rate as the achieved
        one will believe it is receiving at 51.2 kbit/s while most of the frames are being
        dropped

  - id: frame_loss
    node: internal
    method: stock
    unit: "%"
    initial: 0
    initial_provenance:
      basis: chosen
      reason: "the accumulator starts empty and nothing in the mission pre-loads it. It is the *residue* of a fixed-point integration rather than an inventory, so its only honest starting value is zero — and saying so is what separates it from the tanks, whose initial amount is a fact about the pad"
    quantum: 0.01
    min_flow_per_s: 0.01
    provenance:
      basis: apollo
      ref: "apollo_diode.md:166"
      note: >-
        `comm.rx_frame_loss_pct`, apollo's band 0-0.5 % and its ">2 %" event. A stock because
        frames are counted and the fraction is a ratio of two integers, which is exactly the case
        `plant.md` §4's Bresenham accumulator exists for: a loss rate computed in floating point
        over four hours of frames drifts against the frame counters it is supposed to be a ratio
        of, and the drift is in the direction of the thing being measured

  - id: blackout
    node: internal
    method: discrete
    unit: "enum[clear,occulted]"
    moved_by:
      - "logic:the geometric occultation, computed from the orbit and the Moon's radius"
    # The rule's parameter (`domains/comms/rules.py:blackout`).
    moon_radius_m: 1737400
    parameter_provenance:
      basis: historical
      source: "vehicle.yaml#environment.moon_mean_radius_km (1,737.4 km), the radius the trajectory's own flyby check uses; `mission.yaml#comms_blackout.moon_radius_km` carries the same figure, and so does `link_ok`, which evaluates the same occultation. `tests/test_comms_rules.py` holds the four equal"
    # A geometric fact rather than a latch, so neither a band nor a floor: the state is a function
    # of where the vehicle and the Moon are this tick, and it changes twice a revolution.
    non_latching: true
    non_latching_reason: >-
      the sixty-second dwell this state carried was argued from the link fading through the limb
      ("a state that flipped on the first dropped frame would report the antenna's noise as the
      Moon's shadow"). That argument is about a state *inferred from frames*, and this one is
      computed from the orbit: no frame is read, so there is no noise to debounce, and a dwell would
      only move loss and acquisition of signal sixty seconds off the geometry. The fade through the
      limb belongs to the link margin, which is where a soft edge has a quantity to act on
    provenance:
      basis: derived
      relation: "the Moon occults the Earth when the angle between the vehicle->Moon-centre and vehicle->Earth directions is less than arcsin(R_moon / r_orbit). At a 100 km circular lunar orbit that is arcsin(1737.4/1837.4) = 71.0 deg half-angle, so 39.5 % of each revolution; over a 117.8 min period that is 46.5 min"
      note: >-
        `apollo_diode.md:903`'s property, made geometric. The derivation is worth checking
        against the historical figure because it is the only place in this vehicle where a
        derived number can be tested against an operational one: Apollo's loss-of-signal was
        about 45 minutes per revolution, and the derivation gives 46.5 — the difference being
        the orbit's eccentricity and the Earth's own 1.8-degree disc, both of which shorten the
        blackout slightly. Sixty seconds of dwell in both directions (chosen) because the
        transition is a geometric event with a soft edge: the link does not stop at an instant,
        it fades through the limb, and a state that flipped on the first dropped frame would
        report the antenna's noise as the Moon's shadow

  - id: light_time_s
    node: internal
    method: algebraic
    unit: s
    moved_by:
      - "logic:the vehicle's range from the Earth over the speed of light"
    # The rule's parameter (`domains/comms/rules.py:light_time_s`).
    speed_of_light_m_s: 299792458
    parameter_provenance:
      basis: historical
      source: "the SI definition of the metre (17th CGPM, 1983): the speed of light in vacuum is 299,792,458 m/s exactly"
    provenance:
      basis: derived
      relation: >-
        |r| / c, with r the vehicle's Earth-centred position (`gnc.orbital_state.position_m`,
        EARTH_J2000) this tick. On the declared trajectory that is 0.022 s at MET 0 (6,563 km),
        0.058 s at the end of the quiet-coast episode (40 min, 17,335 km), 0.70 s at 24 h and
        1.32 s at arrival (397,000 km)
      note: >-
        **This replaces `vehicle.yaml#environment.earth_moon_light_time_s`, a 1.3 s constant that
        nothing read.** The constant is right only near the Moon: for the first day of the coast
        the delay is a few hundredths to a few tenths of a second, and an experiment that applied
        1.3 s there would hand the fleet a lunar-distance lag the vehicle does not have. Decided
        by the coordinator under John's delegation of 2026-10-17 13:48Z ("preference more fidelity
        where it doesn't start creating significant delivery risk"): the vehicle publishes the
        computed delay (`comm.light_time_s`), and applying it to what crosses the window is the
        window's change (`apollo_diode.md:526` makes the Earth-link delay "a simulation setting").
        The ground end is the Earth's centre until the MSFN stations' coordinates are sourced; a
        station on the surface moves the figure by at most 6,378 km, 0.021 s

  - id: recorder
    node: data_recorder
    method: stock
    unit: bit
    initial: 0
    initial_provenance:
      basis: chosen
      reason: >-
        nothing on tape unless a scenario says so. The data on tape at MET 0 is the episode's task
        volume D1 + D2 (ADR 0003 item 7, B2), which is a demand rather than a fact about the
        vehicle, so it is a scenario `initial` override (`plant.load_scenario`) and never a figure
        in this file
    quantum: 1
    min_flow_per_s: 51200
    quantum_provenance:
      basis: derived
      relation: "data is counted in whole bits, and the only flow is playback at 51,200 bit/s (`playback_rate`), which moves 1,024 bits a 20 ms tick: an exact integer, so the drain has no residual"
    provenance:
      basis: apollo
      ref: "apollo_diode.md:903"
      note: >-
        `comm.recorder_fill_pct`. The reason the blackout is survivable, and the reason the
        domain has a *stock* rather than a flag: the vehicle stores what it cannot send, so a
        blackout converts a telemetry gap into a telemetry delay. Its capacity is the bound on
        how long that works, and `vehicle.yaml#comms` does not have the figure — recorded as a
        debt rather than filled in, because the interesting failure is the one where the
        recorder fills and the vehicle must start choosing what to forget. That choice is the
        same one `apollo_diode.md:901` demands of a degraded link, arriving from the other side.
        In bits since the quiet-coast task model (`09-quiet-coast-episode.md` §1): playback is a
        transfer of whole bits to `delivered_bits`, which a percentage of an unknown capacity
        could not count

  - id: recorder_play
    node: internal
    method: discrete
    unit: "enum[on,off]"
    initial: "off"
    initial_provenance:
      basis: chosen
      reason: >-
        playback is the episode's own act and every policy starts it by command
        (`09-quiet-coast-episode.md` §5); a scenario may override it
    moved_by:
      - "command:play_recorder"
    dwell:
      min_on_s: 5
      min_off_s: 5
    provenance:
      basis: chosen
      reason: >-
        the recorder's play control. Apollo had tape-recorder play and record controls on the
        crew panel and by up-telemetry, and the exact switch is not sourced (B2), so this is the
        declared form: on plays the record to the ground at the high bit rate while the link is
        ok. Five seconds of dwell (chosen), the telemetry profile's own, because playback is spent
        at that profile's rate

  - id: link_ok
    node: ground_received
    method: algebraic
    unit: bool
    moved_by:
      - "logic:the episode's link predicate over the commanded link configuration"
    high_rate_bps: 51200
    moon_radius_m: 1737400
    parameter_provenance:
      basis: apollo
      ref: "apollo_diode.md:165"
      note: >-
        `high_rate_bps` is the high telemetry profile's 51,200 bit/s, `vehicle.yaml#comms.rates.high`.
        `moon_radius_m` is `blackout`'s own parameter, `vehicle.yaml#environment.moon_mean_radius_km`:
        this predicate evaluates the occultation itself (`rules.py:occulted`, the one function both
        states call) rather than reading `blackout`, because `blackout` is on the sentinel, which
        advances after `ground_received`, and a logic-moved state on it has no value at tick 0
    provenance:
      basis: chosen
      reason: >-
        ADR 0003 item 8 (B3): the high-bit-rate link's availability is not computable, because
        the link budget's constant terms are owed (`open_debts`), so the episode declares it as a
        boundary. True exactly when `antenna_selection` is `high_gain`, `comm_mode` is
        `sband_high`, `telemetry_rate` is the high profile's 51,200 bit/s and `transmitter_on` is
        `on` (`domains/comms/rules.py:link_ok`) — and the Moon is not between the vehicle and
        the Earth, the occultation `blackout` publishes, evaluated from this tick's orbit. That
        term is what makes the recorder's job real outside the quiet coast: playback stops at loss
        of signal and resumes at acquisition, so a crew that wants a dump to finish has to start it
        with a contact period left. The quiet-coast episode is near the Earth and never occulted,
        so the term changes none of its runs. Private truth, published nowhere

  - id: playback_rate
    node: ground_received
    method: algebraic
    unit: bit/s
    moved_by:
      - "logic:the playback rate while the recorder plays over an ok link"
    play_rate_bps: 51200
    parameter_provenance:
      basis: historical
      source: "CSM AOH Block II Vol 1 §2.8, printed 2.8-60: 'High-bit rate PCM is dumped at 15 ips (1:1) while low-bit rate PCM is dumped at 120 ips (32:1)', so a high-rate record plays back at its own 51,200 bit/s"
      note: >-
        ADR 0003 item 7 (B2a) chose the published high bit rate (`apollo_diode.md:165`) because
        the DSE's playback rate was not found; the AOH confirms it for a high-rate record. A
        low-rate record dumps at 32 x 1,600 = 51,200 bit/s too, so the rate is the same either way
    provenance:
      basis: chosen
      reason: >-
        `play_rate_bps` while `recorder_play` is `on` and `link_ok`, and 0 otherwise
        (`domains/comms/rules.py:playback_rate`). It drives `E-REC-GND`, so it is the drain the
        recorder sees; the recorder advances first in the schedule, so the drain follows the
        command by one tick

  - id: delivered_bits
    node: ground_received
    method: stock
    unit: bit
    initial: 0
    initial_provenance:
      basis: chosen
      reason: "nothing has been delivered at the episode's start; the stock counts what this episode's playback lands"
    quantum: 1
    min_flow_per_s: 51200
    quantum_provenance:
      basis: derived
      relation: "the recorder's own quantum, which a transfer between two stocks must share (WP10): one bit, and 1,024 of them a tick at the playback rate"
    provenance:
      basis: chosen
      reason: >-
        the ground-received data, the quiet-coast episode's completion oracle
        (`09-quiet-coast-episode.md` §1, §5: M is `delivered_bits >= D1`, S is `>= D1 + D2`).
        Filled only by `E-REC-GND` from `recorder`, so `recorder + delivered_bits` is the task
        volume exactly, every tick. **Private truth:** it is in `points.yaml#not_published`,
        because a fleet that could read the oracle would be reading its own score

# --------------------------------------------------------------------------------------
open_debts:

  - "**The occultation the phase table says cannot happen.** `blackout` is computed from the orbit, and on the declared free return it is `occulted` from MET 72.78 h to 73.23 h — 27 minutes at closest approach, which is where Apollo flew its lunar-orbit insertion burns, out of contact (`tests/test_comms_rules.py`). `translunar_coast` ends at 73.0 h, and `mission.yaml#comms_blackout.not_affected` lists it. The block budgets a circular 100 km orbit per phase (`plant.py --blackout`), so it cannot see a flyby, and adding the phase to `phases_affected` would budget 73 hours of revolutions that are not flown. What is owed is the LOI timing against the arrival: whether the coast ends before, at or after loss of signal is the ladder's choice, and the burn that ends it is the propulsion lane's."
  - "Gimbal range and slew rate. Both owed, and both needed to separate a pointing error the gimbal can still fix from one it cannot — which is the difference between `point_hga` being a control action and being a message nobody can act on."
  - "`E-BUS-COMM`'s dB per volt, and `E-PLATE-COMM`'s dB per kelvin. Both need the amplifier's gain-versus-supply and gain-versus-temperature curves, which are not published. They stay UNCONFIGURED and they are the two edges that make the flagship cycle quantitative rather than qualitative."
  - "The LM steerable S-band antenna's gain and beamwidth (`vehicle.yaml#comms.antennas.sband_steerable`). Owed rather than picked, because a gain invented there propagates into `E-GEOM-LINK` and from there into every link margin a fleet ever reads."
  - "The link budget's missing terms. `link_margin_db` scales Bellcomm's Apollo 14 lunar-range prediction (CR-125670 Table II) by range, the amplifier and pointing loss, because the North American circuit-margin ICDs it was built on (MH01-13001-414, MH01-13021-414) were not reachable. Still owed: which station is tracking (the 210-ft adds 8.0 dB and no state says when it is in view), the stations as the ground end, for link_ok, light time and the margin's range (GSFC TM X-68818 has the 85-ft sites, on local datums, but on the declared trajectory and the arbitrary `mission.yaml#met_epoch_utc` none of them sees the vehicle from MET 0 to 0.49 h, which would fail the quiet-coast episode for an accident of the epoch; Apollo covered that phase with the 30-ft sites, ships and ARIA aircraft, so what is owed is their coordinates or an epoch chosen to match a historical TLI's station geometry, and the coordinator kept the Earth's centre under delegation on 2026-10-17), the ground receiver's noise rising above -125 dBm and saturating above -70 dBm, the Moon in the ground beam, an omni's gain with look angle, the medium and wide beams (the budget assumes the narrow), and the CSM/LM relay geometry during the docked and rendezvous phases."
