# domains/consumables/commands.yaml — the four verbs this domain keeps, and the fourteen it
# declines.
#
# ## What is declined, and why it is the most consequential decision in the domain
#
# `consumables_diode.md:1002-1021` offers fourteen agent-facing verbs, four of which are the
# claims lifecycle: `RESERVE_RESOURCE`, `RELEASE_RESERVATION`, `REQUEST_ALLOCATION`,
# `RELEASE_ALLOCATION`. `simulator-design.md:254-257` declines them, and the reasoning is the
# spine of the whole experiment: reservations are a **deconfliction primitive**, and
# `design.md` §8 refuses to supply one. Ten agents flying one vehicle have to invent
# deconfliction; a vehicle that hands them a reservation table has answered the mission's first
# question for them.
#
# The declined verbs are listed below with their reasons, because a decline that is not written
# down is a decline somebody re-proposes in three months.
#
# ## What survives, and why each is safe
#
# The three that survive are safe for three different reasons, and the reasons are the useful
# part: `set_reserve_policy` only ever *tightens* the caller's own ceiling (monotone, so it
# cannot be used to take a resource from anyone); `request_reconciliation` asks the trusted
# service to re-derive a number the service already owns (a read, dressed as a verb);
# and `set_o2_source` / `set_absorber_path` are ordinary vehicle controls that route a flow
# rather than allocate one.

domain: consumables
commands:
  - verb: set_reserve_policy
    argument_schema:
      resource:
        type: enum
        values: [o2_csm, o2_lm, water_potable, water_cooling, prop_main, prop_rcs,
                 pressurant_he, absorber_capacity_csm, absorber_capacity_lm, h2_csm,
                 battery]
        # The floor is a level **on a channel**, and the channel decides the unit: the tanks are
        # floored in kg and the four level gauges in percent. So the unit is declared once per
        # resource here rather than named in the argument, which is what `floor_kg` did and what
        # made four of the nine resources unsettable in their own unit. `check_reserve_floors`
        # holds each entry against the unit of the channel the floor's threshold monitors, so this
        # block and `reserve_floor` in `profiles.yaml` are two halves of one declaration rather
        # than two lists that have to be kept in step.
        floor_units:
          o2_csm: kg
          o2_lm: kg
          water_potable: kg
          water_cooling: kg
          prop_main: "%"
          prop_rcs: "%"
          pressurant_he: kg
          absorber_capacity_csm: "%"
          absorber_capacity_lm: "%"
          h2_csm: kg
          battery: "%"
      floor: {type: number, minimum: 0}
      note: {type: string, optional: true, max_length: 200}
    authority: A1
    gate: {kind: preference, variable: reserve_floor_<resource>_enable}
    interlocks: none
    conflict_domain: res.<resource>.policy
    allowed_phases: [translunar_coast, lunar_orbit, descent, surface, ascent_rendezvous,
                     lunar_orbit_docked, transearth_coast, entry]
    irreversible: false
    idempotent: true
    execution_class: declarative
    maximum_queue_age_s: 600
    help: >-
      Set your own reserve floor for a resource. The service keeps its own floor underneath
      yours and the effective floor is the higher of the two, so this verb can only ever make
      the caller more conservative. `apollo_diode.md:55` says reserve policies should remain
      agent-created, and this is the narrowest reading of that: a floor is a commitment about
      the caller's own future spending, not a claim on a quantity, and no other agent can see
      it or be bound by it. **`floor` is in the resource's own unit, which the vehicle declares
      per resource and which this help therefore states rather than assumes: kg for `o2_csm`,
      `o2_lm`, `water_potable`, `water_cooling`, `pressurant_he` and `h2_csm`, and percent for
      `prop_main`, `prop_rcs`, `absorber_capacity_csm`, `absorber_capacity_lm` and `battery`.
      A floor on a tank is a quantity and a floor on a gauge is a fraction of full scale, and
      the two are not interchangeable: 20 kg of main propellant is a tenth of a percent of the
      18,508 kg the service module carries, and 20 percent of it is 3,702 kg.**
    provenance:
      basis: apollo
      ref: "apollo_diode.md:55"
      note: "the corpus's own position is that reserve policies should remain agent-created; the min(agent, operator) monotonicity in diode-contract.md:143-144 is what makes it safe to allow"

  - verb: request_reconciliation
    argument_schema:
      resource: {type: enum, values: [o2_csm, o2_lm, water_potable, water_cooling, prop_main,
                                    prop_rcs, pressurant_he, absorber_capacity_csm,
                                    absorber_capacity_lm, all]}
    authority: A0
    gate: {kind: preference, variable: recon_request_enable}
    interlocks: none
    conflict_domain: res.<resource>.recon
    allowed_phases: [translunar_coast, lunar_orbit, descent, surface, ascent_rendezvous,
                     lunar_orbit_docked, transearth_coast, entry]
    irreversible: false
    idempotent: true
    execution_class: declarative
    maximum_queue_age_s: 300
    help: >-
      Ask the trusted service to re-derive the ledger and publish a fresh residual. It changes
      no physical quantity and grants nothing: the service recomputes its own accounting and
      says what it now believes. An agent that suspects a leak can ask for a reconciliation,
      and the answer is a number rather than a permission.
    provenance:
      basis: apollo
      ref: "consumables_diode.md:1020"
      note: "the corpus's own REQUEST_RECONCILIATION, which survives the claims decline because it allocates nothing. It is the verb that makes the ledger pair usable: without it, a residual only updates on the service's own cadence"

  - verb: set_o2_source
    argument_schema:
      vehicle: {type: enum, values: [csm, lm]}
      source: {type: enum, values: [primary, surge, isolated]}
    authority: A2
    gate: {kind: preference, variable: o2_<vehicle>_<source>_enable}
    interlocks: [eclss.cabin_pressure_caution, eclss.lm_cabin_pressure_caution, o2_reserve_10]
    # Two arguments together (ADR 0004 §Direction, amended 2026-10-17): which way a command moves
    # each hazard depends on the vehicle *and* the source, so each guard names the combinations it
    # applies to. The flow band is `set_o2_flow`'s (`eclss.o2_flow`), not an argument here. Owned by
    # the ECLSS lane, which owns this verb's interlocks.
    interlocks_when:
      - interlocks: [eclss.cabin_pressure_caution]
        argument: [vehicle, source]
        values:
          - [csm, isolated]
        why: >-
          a cabin below its 4.5 psia caution is losing gas, and what makes it worse is cutting its
          oxygen: an isolated supply. `primary` and `surge` admit oxygen and are the recovery, so
          they are never refused by this guard; the emergency regulator's published job is exactly
          that, holding the cabin above 3.5 psia for as long as the supply lasts
          (`apollo_diode.md:84`). The guard reads the CSM's cabin, so it guards the CSM's element
      - interlocks: [eclss.lm_cabin_pressure_caution]
        argument: [vehicle, source]
        values:
          - [lm, isolated]
        why: >-
          the same hazard in the LM's cabin, which `eclss.cabin_o2_supply_lm_kg_s` stops feeding
          when its source is `isolated`; a CSM caution neither licenses nor blocks it
      - interlocks: [o2_reserve_10]
        argument: [vehicle, source]
        values:
          - [csm, primary]
        why: >-
          the reserve this guard watches is the service module's cryogenic oxygen (`o2_csm`, through
          `res.o2_remaining_kg`), and only the CSM's `primary` spends it. `csm_ecs_study_guide.pdf`
          PDF p. 12 (printed p. 2-1, §2.1-2.2.1) places the two cryogenic tanks in the S/M and the
          3.7 lb surge tank in the command module's LH equipment bay, fed in parallel downstream of
          the S/M shut-off valve, so `surge` draws a different store and `isolated` draws none.
          `surge` and `isolated` are the recovery, and the surge tank's own floor is not this
          guard's to hold. In the plant `surge` moves the regulator's draw to
          `eclss.o2_surge_csm_kg` (`eclss.o2_source`), so the S/M tanks stop feeding the cabin.
          `primary` is refused whatever the band, because the band is `set_o2_flow`'s;
          `set_o2_flow flow=off` is the other recovery. The LM draws on its own store
          (`consumables.o2_lm_kg`), which this guard does not watch
    conflict_domain: res.<vehicle>.o2_source
    allowed_phases: [translunar_coast, lunar_orbit, descent, surface, ascent_rendezvous,
                     lunar_orbit_docked, transearth_coast, entry]
    irreversible: false
    idempotent: true
    execution_class: declarative
    maximum_queue_age_s: 60
    help: >-
      Select the oxygen source the cabin regulator draws from. How hard it draws is
      `set_o2_flow`'s band; what an agent chooses here is which tank the regulator draws from,
      and a vehicle that has to reason about its own reserve should be able to say "spend this
      tank first".
    provenance:
      basis: apollo
      ref: "apollo_diode.md:238"
      note: "apollo's set_o2_source. It carried a flow band too until PR #64; the band is set_o2_flow's alone, because a second writer bypassed that verb's gate and fire and overpressure guards, and an argument that moved nothing was accepted as though it had"

  # `set_absorber_path` used to live here. It moved to `domains/eclss/` in round 6, and the
  # reason is the distinction that runs through the vehicle: **consumables owns the stock and
  # ECLSS owns the air.** The beds' capacity is a resource — consumed, floored, planned against
  # — but the path is a routing decision about cabin air, and a resource domain with an opinion
  # about ducting is how one verb ends up with two implementations.

declined:

  - verb: reserve_resource
    corpus: "consumables_diode.md:1008"
    why: >-
      it is a claim on a quantity, and a published claim table is a deconfliction primitive.
      The mission is to find out whether ten agents invent one; handing them the vehicle's own
      would answer the question instead of asking it.
  - verb: release_reservation
    corpus: "consumables_diode.md:1009"
    why: "the inverse of a declined verb is a declined verb"
  - verb: request_allocation
    corpus: "consumables_diode.md:1010"
    why: "an allocation is a granted claim — the same primitive, one state further along"
  - verb: release_allocation
    corpus: "consumables_diode.md:1011"
    why: "the inverse of a declined verb is a declined verb, and the inverse is the sharper half here: request_allocation is declined because an allocation *is* a granted claim, so a release verb is the one command that would let a fleet hand that claim back — the deconfliction primitive one state further along rather than a separate idea about resources"
  - verb: request_transfer
    corpus: "consumables_diode.md:1012"
    why: >-
      a cross-vehicle resource transfer is a real thing on this vehicle (the LM is the lifeboat
      and the CSM has the oxygen), and it is declined here because the *transport* between the
      two vehicles is a docking-and-plumbing question rather than an accounting one. When it
      lands it belongs to the structure domain's hatch and docking verbs, not to a resource
      verb that moves a number between two tanks that are not connected.
  - verb: request_replenishment
    corpus: "consumables_diode.md:1013"
    why: "there is nobody to ask. The vehicle has no supplier, and a verb addressed to a ground crew that does not exist would be a channel to a human the experiment does not have"
  - verb: set_agent_budget_cap
    corpus: "consumables_diode.md:1018"
    why: >-
      kept in spirit and renamed: `set_reserve_policy` is the same monotone ceiling-narrowing
      move, expressed against a resource rather than against a spending allowance. Two verbs
      for one idea is how a dictionary ends up with eight names for one object.
  - verb: request_load_shed
    corpus: "consumables_diode.md:1019"
    why: "load shedding is the power domain's; a resource verb that shed a load would be a second, uncoordinated path to the same state"
  - verb: request_data_purge
    corpus: "consumables_diode.md:1020"
    why: "the recorder is the operator's, not the fleet's, and a purge verb would be the one command that could destroy the record"
  - verb: set_telemetry_profile
    corpus: "consumables_diode.md:1021"
    why: "a publisher-level verb listed per-domain by every spec that mentions it, which is how one verb acquires six argument schemas (vocabulary V-06)"
  - verb: cancel_pending_resource_action
    corpus: "consumables_diode.md:1022"
    why: >-
      subsumed by the command lifecycle: `CONFLICT_SUPERSEDED`, `EXPIRED` and `INHIBITED` are
      refusals the executive already produces, and a verb that duplicates the lifecycle is a
      verb that can disagree with it
  - verb: ack_resource_event
    corpus: "consumables_diode.md:1023"
    why: "acknowledgement is not a resource action and the caution/warning domain owns it. More to the point, `crew_diode.md:433` makes acknowledgement not a clear predicate, so an ack verb here would imply an authority it does not have"
  - verb: submit_plan_demand
    corpus: "consumables_diode.md:1024"
    why: >-
      this is the interesting decline. A non-authoritative future-demand submission is *not* a
      claim — it grants nothing and reserves nothing — and it would let the service tell a
      fleet whether a plan is feasible. It is declined for now because a shared demand register
      is a coordination artifact by another name: an agent could read the register and learn
      what its siblings intend, which is exactly the information the world declines to supply.
      If a future condition wants to test whether the fleet invents that register, this is the
      verb to restore.
