name: Live smoke stack

# The container world, built and run (docs/vehicle-completion/06-verification.md, `live.yml`): builds
# the agent image (its build needs deb.debian.org, which a hosted runner reaches), starts the
# three-agent smoke stack on the stub model with a dummy key, and runs aurora/live against it.
# Run by hand before any adoption merge. Not part of `CI / required`: it takes minutes of image
# build and it proves the world, not a change. A change to this file runs it, so it tests itself.

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/live.yml']

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: live smoke stack
    runs-on: ubuntu-24.04
    # test_quiet_coast.py drives the whole 40-minute episode through the window at m = 1, which a
    # loaded runner keeps at about 0.6 of real time, then replays it to judge it.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Let the image's uid 1000 write the smoke stack's scratch directories
        # The stack's scratch root is aurora/.smoke-<pid>/, plain host directories the containers
        # write as uid 1000 (live/stack.py). A hosted runner's user is uid 1001, and on such a host
        # Postgres cannot initialise under /state. Default ACLs on aurora/ give uid 1000, and the
        # runner, write access to everything the stack creates there.
        run: |
          command -v setfacl || sudo apt-get install -y acl
          setfacl -m "u:1000:rwX" aurora
          setfacl -d -m "u:1000:rwX,u:$(id -u):rwX" aurora
      - name: Build, start and check the smoke stack
        working-directory: aurora
        run: python -m pytest live -q -rs
      - name: Show the services' logs
        if: ${{ failure() }}
        run: |
          for log in aurora/.scratch/live-evidence/*; do
            [ -f "$log" ] || continue
            echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: live-evidence
          path: aurora/.scratch/live-evidence/
          if-no-files-found: warn
          retention-days: 30
