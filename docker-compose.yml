# Generated by scripts/build_compose.py from scripts/volume_images.py. Edits are lost: change the
# generator or the manifest, run `python3 scripts/build_compose.py`, and commit both.
#
# The world, as a topology. The hard rule is that no agent container has a route outward: every
# process that needs the outside lives in its own container on a network the agents cannot reach.
# Each agent's recorder holds the model credential and talks to the model; the window's far side
# is the vehicle's. The fleet reaches both through bounded volumes, never sockets of its own.
#
# Each agent is its own container on `worknet`, an internal network with no gateway, so the fleet
# can reach each other and anything they start for themselves: a control layer needs somewhere to
# run, and building one is the mission. Every surface an agent writes is a loop-mounted image
# bound to that agent alone (scripts/volume_images.py), with `create_host_path: false`, so a
# service whose image is not mounted refuses to start rather than writing to the host disk.
#
# The file declares ten agents, and every `compose up` -- a bare one too, since the monitor and the
# review panel bind every agent's record -- needs a roster of exactly ten (FLEET_COUNT=10 in .env):
# a smaller roster has no images for the agents past it, and their binds refuse. prepare_host.sh
# refuses a roster that does not match. Run it, and mount what it prints, before the first `up`.

name: space-chassis

services:
  agent_1:
    image: space-chassis-agent
    build:
      context: .
      dockerfile: Dockerfile.agent
      target: agent
    restart: unless-stopped
    init: true
    hostname: agent_1
    stop_grace_period: 20s
    depends_on: [recorder_1]
    networks: [worknet]
    environment:
      AGENT_SLUG: ${FLEET_1_SLUG:-agent_1}
      AGENT_NAME: ${FLEET_1_NAME:-agent_1}
      OPENROUTER_API_KEY: "sk-dummy"
      LLM_MODEL: ${HOST1_LLM_MODEL:-${LLM_MODEL:-deepseek/deepseek-v4-pro}}
      CONTEXT_WINDOW_TOKENS: ${HOST1_CONTEXT_WINDOW_TOKENS:-${CONTEXT_WINDOW_TOKENS:-200000}}
      CONTEXT_WINDOW_EVICTION_TOKENS: ${CONTEXT_WINDOW_EVICTION_TOKENS:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      PUMP_MAX_ENTRIES: ${PUMP_MAX_ENTRIES:-32}
      PUMP_MAX_CONCURRENT: ${PUMP_MAX_CONCURRENT:-8}
    volumes:
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/state_${FLEET_1_SLUG:-agent_1}/data
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/pump_${FLEET_1_SLUG:-agent_1}/data
        target: /pump
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/build_${FLEET_1_SLUG:-agent_1}/data
        target: /build
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/telemetry_${FLEET_1_SLUG:-agent_1}/data
        target: /telemetry
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/llm_sock_${FLEET_1_SLUG:-agent_1}/data
        target: /llm/sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/llm_console_${FLEET_1_SLUG:-agent_1}/data
        target: /llm/console
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/shared/data
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/diode/data/${FLEET_1_SLUG:-agent_1}
        target: /diode/${FLEET_1_SLUG:-agent_1}
        bind:
          create_host_path: false
      - ./vendor/registry:/vendor/registry:ro
      - ./vendor/cargo-config.toml:/.cargo/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp
      - /work:size=1g,uid=1000,gid=1000
      - /home/agent:size=256m,uid=1000,gid=1000
      - /run/agent:size=64m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${AGENT_CPUS:-1.0}
    mem_limit: ${AGENT_MEM:-3g}
    memswap_limit: ${AGENT_MEM:-3g}
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  recorder_1:
    image: space-chassis-agent
    entrypoint: ["python", "/usr/local/lib/recorder/proxy.py"]
    restart: unless-stopped
    hostname: recorder_1
    networks: [modelnet]
    # The recorder resolves the upstream host on every request, and Docker's embedded
    # resolver drops queries at that rate once ten sockets are busy.
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      AGENT_SLUG: ${FLEET_1_SLUG:-agent_1}
      FLEET_LEDGER_PATH: /ledger/ledger.jsonl
      TRANSCRIPT_DIR: /transcripts
      LLM_SOCKET_PATH: /llm/sock/core.sock
      LLM_CONSOLE_FILE: /llm/console/console.json
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RECORDER_HOURLY_MAX: ${RECORDER_HOURLY_MAX:-2400}
      RECORDER_TOKEN_HOURLY_MAX: ${RECORDER_TOKEN_HOURLY_MAX:-200000000}
      RECORDER_TOKEN_GLOBAL_HOURLY_MAX: ${RECORDER_TOKEN_GLOBAL_HOURLY_MAX:-2000000000}
      RECORDER_CORE_RESPONSE_RESERVE: ${RECORDER_CORE_RESPONSE_RESERVE:-32768}
      REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-16777216}
      RESPONSE_MAX_BYTES: ${RESPONSE_MAX_BYTES:-16777216}
      RECORDER_MIN_FREE_BYTES: ${RECORDER_MIN_FREE_BYTES:-134217728}
      RECORDER_CLIENT_TIMEOUT: ${RECORDER_CLIENT_TIMEOUT:-600}
      RECORDER_DEADLINE_MARGIN: ${RECORDER_DEADLINE_MARGIN:-30}
      RECORDER_UPSTREAM_DEADLINE: ${RECORDER_UPSTREAM_DEADLINE:-540}
      RECORDER_LATEST_START: ${RECORDER_LATEST_START:-480}
      RECORDER_OPERATION_TIMEOUT: ${RECORDER_OPERATION_TIMEOUT:-60}
      STREAM_HOURLY_MAX: ${STREAM_HOURLY_MAX:-}
      STREAM_TOKEN_HOURLY_MAX: ${STREAM_TOKEN_HOURLY_MAX:-}
      STREAM_TOKEN_GLOBAL_HOURLY_MAX: ${STREAM_TOKEN_GLOBAL_HOURLY_MAX:-}
      STREAM_REASONING_ALLOWANCE: ${STREAM_REASONING_ALLOWANCE:-}
      STREAM_MODEL_ALLOW_TEXT: ${STREAM_MODEL_ALLOW_TEXT:-}
      STREAM_MODEL_ALLOW_VISION: ${STREAM_MODEL_ALLOW_VISION:-}
      STREAM_BASE_URL: ${STREAM_BASE_URL:-}
      STREAM_API_KEY: ${STREAM_API_KEY:-}
      STREAM_UPSTREAM_URL: ${STREAM_UPSTREAM_URL:-}
    volumes:
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/transcripts_${FLEET_1_SLUG:-agent_1}/data
        target: /transcripts
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/llm_sock_${FLEET_1_SLUG:-agent_1}/data
        target: /llm/sock
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/llm_console_${FLEET_1_SLUG:-agent_1}/data
        target: /llm/console
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/fleet_ledger/data
        target: /ledger
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

