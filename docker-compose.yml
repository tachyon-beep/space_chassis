# The world, as a topology.
#
# The hard rule is that no agent container has a route outward. Everything else
# here is a decision about what the world is made of, and the comments say why
# each one is the way it is.
#
# Two consequences of the rule shape the whole file:
#
#   * every process that needs the outside lives in its own container on a
#     network the agents cannot reach -- the recorder holds the model
#     credential and talks to the model; the diode holds the vehicle's
#     credentials and talks to the vehicle;
#   * the fleet reaches those processes through volumes, not sockets. The
#     recorder's per-agent unix socket and the diode's per-agent directory are
#     the entire interface in both directions.
#
# The agent containers join `worknet`, an internal network with no gateway, so
# they can reach each other and anything they start for themselves. That is
# deliberate: a control layer needs somewhere to run, and the fleet is expected
# to build one.
#
# Durable state lives under ./volumes as bind mounts rather than named volumes,
# for two reasons. A named volume cannot carry a variable in its name, so ten
# agents with distinct homes would need ten hand-written volume lists; a path
# can. And an operator can read, back up and delete a member's stores with the
# tools they already have. Directories under ./volumes must be owned by uid
# 1000 -- scripts/prepare_host.sh does it -- because the containers drop every
# capability and cannot chown anything.
#
# Each service repeats its own mount list rather than sharing an anchor. A YAML
# sequence alias cannot be merged into a longer list by the compose parser
# (verified against Compose v5.5.0), and a shared-list-plus-extras anchor would
# hide exactly the thing a reader wants to see: what this agent, and no other,
# was given.

name: space-chassis

x-env: &env
  # Each service sets: AGENT_SLUG, AGENT_NAME, LLM_SOCKET_PATH,
  # DIODE_DUTY_DIR, PUMP_DUTY_DIR.
  LLM_BASE_URL: http://localhost/api/v1
  # Carried as a shape only. The recorder replaces it with the real key.
  OPENROUTER_API_KEY: sk-dummy
  LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-pro}
  CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-200000}
  CONTEXT_WINDOW_EVICTION_TOKENS: ${CONTEXT_WINDOW_EVICTION_TOKENS:-}
  # A run ends at either of these and another starts. Empty means a run ends
  # only when it ends itself, or dies.
  RUN_MAX_TURNS: ${RUN_MAX_TURNS:-}
  RUN_MAX_SECONDS: ${RUN_MAX_SECONDS:-}
  RECORDER_TIMEOUT_SECONDS: ${RECORDER_TIMEOUT_SECONDS:-600}
  SUPERVISOR_INACTIVITY_SECONDS: ${SUPERVISOR_INACTIVITY_SECONDS:-86400}
  PUMP_MAX_ENTRIES: ${PUMP_MAX_ENTRIES:-64}
  PUMP_MAX_CONCURRENT: ${PUMP_MAX_CONCURRENT:-16}
  TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile.agent
  image: space-chassis-agent
  restart: unless-stopped
  init: true
  # No outside: `internal: true` means no gateway and no NAT, so there is no
  # route off this network even if something asks for one.
  networks: [worknet]
  environment: *env
  # Resource hygiene for one member of a ten-member fleet, not a containment
  # boundary: everything valuable here is reachable without them.
  cpus: ${AGENT_CPUS:-1.0}
  mem_limit: ${AGENT_MEM:-3g}
  memswap_limit: ${AGENT_MEM:-3g}
  pids_limit: 1024
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  stop_grace_period: 20s

# ---------------------------------------------------------------------------
# The fleet. Ten of the same thing, distinguished only by their durable
# stores, by the sliver of conversation each holds, and by a name drawn from
# the pool in scripts/roster.py. The names carry no rank: allocating work is
# the first problem the mission has to solve, and nothing here solves it for
# them.
#
# Every agent gets: the shared codebase, everyone's record (read-only), the
# window, its own process directory, the recorder's sockets (read-only), the
# crate registry, and one home and one diary that are mounted into nobody
# else. agents 2..10 are in the `fleet` profile so a one-agent run stays
# cheap; start the whole fleet with `--profile fleet`.
# ---------------------------------------------------------------------------
services:
  agent_1:
    <<: *base
    hostname: agent_1
    environment:
      <<: *env
      AGENT_SLUG: ${FLEET_1_SLUG:-agent_1}
      AGENT_NAME: ${FLEET_1_NAME:-agent_1}
      LLM_SOCKET_PATH: /llm/sock/${FLEET_1_SLUG:-agent_1}.sock
      DIODE_DUTY_DIR: /diode/${FLEET_1_SLUG:-agent_1}
      PUMP_DUTY_DIR: /pump/${FLEET_1_SLUG:-agent_1}
      LLM_MODEL: ${HOST1_LLM_MODEL:-${LLM_MODEL:-deepseek/deepseek-v4-pro}}
      CONTEXT_WINDOW_TOKENS: ${HOST1_CONTEXT_WINDOW_TOKENS:-${CONTEXT_WINDOW_TOKENS:-200000}}
    volumes:
      - ./volumes/work:/work
      - ./volumes/transcripts:/transcripts:ro
      - type: bind
        source: ./volumes/telemetry
        target: /telemetry
        read_only: true
      - type: bind
        source: ./volumes/telemetry/mirror
        target: /telemetry/mirror
      - ./volumes/diode:/diode
      - ./volumes/pump:/pump
      - ./volumes/llm_sock:/llm/sock:ro
      - ./vendor/registry:/vendor/registry:ro
      - ./vendor/cargo-config.toml:/.cargo/config.toml:ro
      - ./volumes/home/${FLEET_1_SLUG:-agent_1}:/home/agent
      # The supervisor writes its decisions and its mirror into one directory
      # of its own, while the rest of the record stays read-only: an agent can
      # read what an operator sees and cannot edit it.
      - type: bind
        source: ./volumes/telemetry/agents/${FLEET_1_SLUG:-agent_1}
        target: /telemetry/agents/${FLEET_1_SLUG:-agent_1}
      - type: bind
        source: ./volumes/telemetry/work/${FLEET_1_SLUG:-agent_1}
        target: /telemetry/work
      - ./volumes/diary/${FLEET_1_SLUG:-agent_1}:/diary

