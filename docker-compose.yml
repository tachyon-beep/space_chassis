  # ---------------------------------------------------------------------------
  # The recorder. Holds the model credential, injects it, and writes the
  # transcript nobody in the fleet can edit. It is on no network the agents can
  # see: the unix sockets in ./volumes/llm_sock are the whole interface.
  # ---------------------------------------------------------------------------
  recorder:
    image: space-chassis-agent
    entrypoint: ["python", "/opt/services/recorder.py"]
    restart: unless-stopped
    networks: [modelnet]
    environment:
      # No list of agents: the recorder serves whichever sockets are in its
      # directory, so the fleet's names (drawn at random, per host) never have
      # to be repeated here and a rename cannot desynchronise the two.
      RECORDER_STREAMS: stream
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Operator ceilings, in the recorder's environment and nowhere else. When
      # the fleet hits one, the refusal is recorded like any other turn.
      RECORDER_HOURLY_MAX: ${RECORDER_HOURLY_MAX:-2400}
      RECORDER_TOKEN_HOURLY_MAX: ${RECORDER_TOKEN_HOURLY_MAX:-200000000}
      RECORDER_TOKEN_GLOBAL_HOURLY_MAX: ${RECORDER_TOKEN_GLOBAL_HOURLY_MAX:-2000000000}
      REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-16777216}
      TRANSCRIPTS_DIR: /transcripts
      SOCKET_DIR: /llm/sock
    volumes:
      - ./volumes/transcripts:/transcripts
      - ./volumes/llm_sock:/llm/sock
      # Where each agent announces the name it was given, read-only: the fleet
      # writes the announcements and this process only reads them. Without it
      # the recorder cannot know which sockets to open, and a list in the
      # environment would have to repeat names that are drawn at random.
      - ./volumes/work:/work:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    # The recorder resolves the upstream host on every request. Docker's
    # embedded resolver is one small UDP service per network and drops queries
    # under that rate once ten sockets are busy, which surfaces to an agent as
    # a spurious name-resolution failure and costs it a turn.
    dns: [1.1.1.1, 8.8.8.8]

  # ---------------------------------------------------------------------------
  # The watcher. Reads every agent's public surfaces and writes one row per
  # agent to /telemetry/fleet.jsonl. Read-only mounts, no network, and no
  # channel back into an agent: it observes and cannot influence.
  # ---------------------------------------------------------------------------
  fleet_monitor:
    image: space-chassis-agent
    entrypoint: ["python", "/opt/services/fleet_monitor.py"]
    restart: unless-stopped
    network_mode: none
    environment:
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-15}
      # It watches every agent that has ever run, by reading the record.
    volumes:
      - ./volumes/telemetry:/telemetry
      - ./volumes/transcripts:/transcripts:ro
      - ./volumes/work:/work:ro
      - ./volumes/home:/home:ro
      - ./volumes/diary:/diary:ro
      - ./volumes/pump:/pump:ro
      - ./volumes/diode:/diode:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  # ---------------------------------------------------------------------------
  # The review panel. The fleet monitor answers "is the world working"; this
  # answers "what did that agent actually think", which needs the conversation,
  # the reasoning, the tool calls and what came back -- and needs it to stay
  # cheap while a transcript grows without bound.
  #
  # It is read-only, and it is not on the fleet's network. `network_mode: none`
  # is the stronger form and is unavailable here: Docker refuses to publish a
  # port for a container that has no network, so a panel with nowhere to route
  # cannot be reached from the host at all. `reviewnet` below is `internal:
  # true`, which gives the same guarantee -- no gateway, no route outward --
  # while leaving the listener the operator needs. The agents are never on it.
  # ---------------------------------------------------------------------------
  review:
    image: space-chassis-agent
    entrypoint: ["python", "/opt/services/review.py"]
    restart: unless-stopped
    networks: [reviewnet]
    environment:
      REVIEW_PORT: ${REVIEW_PORT:-8090}
      # How much of each transcript's tail is parsed to serve a page. A line
      # holds the whole conversation, so a turn costs about the size of the
      # conversation: minutes of a real run is megabytes.
      REVIEW_MAX_BYTES: ${REVIEW_MAX_BYTES:-33554432}
      REVIEW_CACHE_TURNS: ${REVIEW_CACHE_TURNS:-200}
      REVIEW_DEFAULT_TURNS: ${REVIEW_DEFAULT_TURNS:-25}
    ports:
      # Host loopback only. A panel that can read everything an agent thought
      # should not turn up on a network by accident.
      - "${REVIEW_BIND:-127.0.0.1}:${REVIEW_PORT:-8090}:8090"
    volumes:
      - ./volumes/transcripts:/transcripts:ro
      - ./volumes/telemetry:/telemetry:ro
      - ./volumes/work:/work:ro
      - ./volumes/home:/home:ro
      - ./volumes/pump:/pump:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256

  # ---------------------------------------------------------------------------
  # The window. The implementation is mounted in by whoever builds the vehicle;
  # without it the stack still runs -- the diode volume is simply an empty
  # directory and nothing in the fleet can leave.
  # ---------------------------------------------------------------------------
  diode:
    image: space-chassis-agent
    entrypoint: ["python", "/opt/diode/diode.py"]
    restart: unless-stopped
    profiles: ["diode"]
    # The only service with both faces: `windowside` is outward, `worknet` is
    # where the agents can see it.
    networks: [worknet, windowside]
    environment:
      DIODE_DIR: /diode
      # The window serves every agent directory it finds, for the same reason.
      DIODE_POLL_SECONDS: ${DIODE_POLL_SECONDS:-5}
      DIODE_HOURLY_MAX: ${DIODE_HOURLY_MAX:-120}
    volumes:
      - ./volumes/diode:/diode
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # The vehicle: the reference console, serving into the *same* diode volume the
  # fleet reads. `diode` above is the slot for whatever implementation the
  # operator brings; this is the one this repository carries, and the two are
  # alternatives rather than neighbours -- start one or the other, because two
  # publishers into one `<slug>` is two vehicles wearing one name.
  #
  # It is on `worknet` alone. The agents are the only thing that reads a window,
  # and a vehicle with a route to the model network would be a vehicle that could
  # reach the fleet's mind -- the one hard rule in AGENTS.md is that agents join
  # `worknet` and nothing else, and this side of the wall obeys it too.
  # ---------------------------------------------------------------------------
  vehicle:
    image: space-chassis-agent
    entrypoint: ["/usr/local/bin/serve_vehicle.sh"]
    restart: unless-stopped
    profiles: ["vehicle"]
    hostname: vehicle
    networks: [worknet]
    environment:
      DIODE_DIR: /diode
      VEHICLE_DIR: /opt/vehicle
      # **Which windows to serve.** The fleet's agents are each given their own slug by the roster
      # (`scripts/roster.py` draws them into `.env`, which is where `FLEET_SLUGS` comes from; agent
      # *n* is handed `DIODE_DUTY_DIR=/diode/$FLEET_N_SLUG`), so a vehicle publishing into one
      # directory of its own name would be a vehicle every agent reads as silent. `FLEET_SLUGS` is
      # the roster's whole list, so an empty variable here still serves every agent the stack has.
      # `vehicle` is always added by the script, because that is the window a hand-run probe points
      # at.
      VEHICLE_SLUGS: ${VEHICLE_SLUGS:-${FLEET_SLUGS:-vehicle}}
      # The run's own identity, recorded in the window's `state.json` and in the
      # vehicle's `pending.json`: a scenario is a posture and a seed, and those
      # two are what make a run replayable.
      VEHICLE_SCENARIO: ${VEHICLE_SCENARIO:-nominal}
      VEHICLE_SEED: ${VEHICLE_SEED:-0}
      # Seconds between cycles. The window's own cadence is the frame rate; this
      # is how often the loop turns, and the reference value is deliberately slow
      # because a console cycle rewrites `state.json` and appends a frame.
      DIODE_POLL_SECONDS: ${DIODE_POLL_SECONDS:-5}
      VEHICLE_RING_SLOTS: ${VEHICLE_RING_SLOTS:-300}
    volumes:
      # The same bind the agents have, so the window appears inside *their*
      # mount rather than beside it.
      - ./volumes/diode:/diode
    # The image is read-only and the volume is not: the console writes the six
    # files into /diode and nothing else, which is the smallest writable surface
    # a publisher can have.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

networks:
  # No gateway. Members can reach each other and nothing else.
  worknet:
    internal: true
  # The agents are not on this one.
  modelnet: {}
  # The review panel's own network: no gateway, and no other member. It exists
  # so a container can hold a listener the host can reach while having no route
  # anywhere -- which `network_mode: none` cannot do, because Docker will not
  # publish a port for a container with no network at all.
  reviewnet:
    internal: true
  # An operator may attach a diode here instead of giving it a route to the
  # public internet.
  windowside: {}
