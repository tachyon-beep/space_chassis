      - "${REVIEW_BIND:-127.0.0.1}:${REVIEW_PORT:-8090}:8090"
    volumes:
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/telemetry_${FLEET_1_SLUG:-agent_1}/data
        target: /mirror/${FLEET_1_SLUG:-agent_1}
