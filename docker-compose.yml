  # The window's fixture: contract/fake_diode.py, which satisfies the contract and models
  # nothing; `vehicle` below is the real implementation, and one or the other runs. It binds
  # the whole shared window image; each agent binds only its own directory in it.
  diode:
    image: space-chassis-agent
    entrypoint: ["python", "/opt/fake/fake_diode.py"]
    restart: unless-stopped
    profiles: ["diode"]
    # Its interface is the volume, so it needs no network at all (spec section 5).
    network_mode: none
    environment:
      DIODE_DIR: /diode
      DIODE_POLL_SECONDS: ${DIODE_POLL_SECONDS:-5}
      DIODE_HOURLY_MAX: ${DIODE_HOURLY_MAX:-120}
    volumes:
      - ${SPACE_VOLUMES_DIR:-./volumes}/diode/data:/diode
      - ./contract/fake_diode.py:/opt/fake/fake_diode.py:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The vehicle: the reference console, serving into the same window image the fleet reads.
  # `diode` above is the contract fixture; start one or the other. No network at all: its
  # interface is the window volume, as the fixture's is (spec 5), and its code opens no
  # socket. On `worknet` it was a named host the agents could address and whose restarts
  # they could observe, which is evidence about hidden vehicle state outside the instruments.
  # Its image is its own, the only one carrying /opt/vehicle; built only by name, with
  # `docker compose --profile vehicle build`, and its entrypoint is the serve script.
  vehicle:
    image: space-chassis-vehicle
    build:
      context: .
      dockerfile: Dockerfile.agent
      target: vehicle
    restart: unless-stopped
    init: true
    profiles: ["vehicle"]
    network_mode: none
    environment:
      DIODE_DIR: /diode
      VEHICLE_DIR: /opt/vehicle
      VEHICLE_STATE_DIR: /state
      VEHICLE_SLUGS: ${VEHICLE_SLUGS:-${FLEET_SLUGS:-vehicle}}
      VEHICLE_SCENARIO: ${VEHICLE_SCENARIO:-nominal}
      VEHICLE_SEED: ${VEHICLE_SEED:-0}
      DIODE_POLL_SECONDS: ${DIODE_POLL_SECONDS:-5}
      VEHICLE_RING_SLOTS: ${VEHICLE_RING_SLOTS:-300}
    volumes:
      - ${SPACE_VOLUMES_DIR:-./volumes}/diode/data:/diode
      - type: bind
        source: ${SPACE_VOLUMES_DIR:-./volumes}/vehicle_state/data
        target: /state
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # No gateway. Members can reach each other and nothing else.
  worknet:
    internal: true
  # The recorders' network. The agents are not on this one.
  modelnet: {}
  # The review panel's own network: no gateway, and no other member.
  reviewnet:
    internal: true
