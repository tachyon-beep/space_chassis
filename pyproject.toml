[project]
name = "space-chassis"
version = "0.1.0"
description = "Space Aurora: a world for ten self-modifying agents (aurora/) and the spacecraft they fly (vehicle/)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# The vendored crate registry carries whatever Python its crates happen to
# ship, which is not this project's code and not this project's business.
# `harness/` is vendored from Aurora at 42faf41 and kept close to upstream so it can be re-synced.
# `recorder/` is vendored from Aurora at 42faf41 the same way: its two modules and its seven
# vendored test files, but not its conftest or the tests this repository adds.
exclude = [
    # endurance/runs/ is the retired endurance harness's output, left on the operator's disk.
    "aurora/vendor", ".scratch", "aurora/endurance/runs", "aurora/harness",
    # The vehicle stream keeps its own ruff configuration (vehicle/pyproject.toml) and its own checks.
    "vehicle",
    "aurora/recorder/proxy.py", "aurora/recorder/recorder_streams.py",
    "aurora/recorder/tests/test_proxy.py", "aurora/recorder/tests/test_recorder_streams.py",
    "aurora/recorder/tests/test_recorder_console_hostile.py", "aurora/recorder/tests/test_unix_listener.py",
    "aurora/recorder/tests/test_upstream_selection.py", "aurora/recorder/tests/test_recorder_events.py",
    "aurora/recorder/tests/hostile_inputs.py",
    "aurora/pump/pump.py", "aurora/pump/tests/test_pump.py", "aurora/pump/tests/hostile_inputs.py",
]

[tool.ruff.format]
# ruff 0.16 formats Python inside Markdown too. The corpus is frozen evidence, the vehicle is its own
# repository with its own rules, and the plans are history: none of them is reformatted here.
exclude = ["docs/deep_research/**", "docs/superpowers/**", "vehicle/**"]

[tool.ruff.lint]
# The services here are deliberately standard-library-first. E501 is off
# because the docstrings carry the reasoning and the prose reads worse wrapped.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
# One suite: `pytest -q` at this root runs both build streams. The aurora stream: the operator side
# and the assertions about the repository's own files (aurora/tests/), Aurora's harness, recorder and
# pump with the tests this repository added to them. The vehicle stream: its referee (vehicle/tests/).
# aurora/live/ is not here: it starts containers.
testpaths = [
    "aurora/tests",
    "aurora/harness/tests",
    "aurora/recorder/tests",
    "aurora/pump/tests",
    "vehicle/tests",
]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "quiet_coast_full: the 120,000-tick quiet-coast runs (QUIET_COAST_FULL=1); CI runs them in their own job",
]
