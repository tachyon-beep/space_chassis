[project]
name = "space-chassis"
version = "0.1.0"
description = "A world for ten self-modifying agents: a floor of capability, one window outward, and a record they cannot reach"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# The vendored crate registry carries whatever Python its crates happen to
# ship, which is not this project's code and not this project's business.
exclude = ["vendor", ".scratch", "endurance/runs"]

[tool.ruff.lint]
# The services here are deliberately standard-library-first. E501 is off
# because the docstrings carry the reasoning and the prose reads worse wrapped.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
# The vehicle's referee lives in its own repository, mounted here as a git submodule. The suite is
# still one suite: `pytest -q` at this root runs the operator side, the assertions about this
# repository's own files, and the vehicle's 312 tests.
testpaths = ["tests", "docs/deep_research/vehicle/tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
